plugins {
    id 'org.springframework.boot' version '2.4.4'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}

group = 'com.onionsoftware.mk119.commtestsuite'
version = '2.0.0'

// 운영 런타임이 Java 8 이므로 toolchain 을 8 로 고정한다.
// 고정하지 않으면 gradle 을 띄운 JVM 이 그대로 쓰여, 같은 코드가 Java 8 과 17 에서
// 다르게 동작했다(예: etherip 의 CIPData.toString() 이 Java 9+ 의 ByteBuffer.clear()
// 시그니처를 요구해 Java 8 에서만 NoSuchMethodError). 컴파일·bootRun·테스트가 모두 8 을 쓴다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.mangoautomation.net/repository/ias-release/'
    }
    google()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
    implementation 'org.projectlombok:lombok:1.18.28'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:2.1.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.63.Final'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.7'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '2.3.3'
    implementation group: 'org.bgee.log4jdbc-log4j2', name: 'log4jdbc-log4j2-jdbc4.1', version: '1.16'
    implementation group: 'com.google.guava', name: 'guava', version: '32.0.1-jre'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'

    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    implementation files('lib/ireasoningsnmp.jar')
    implementation files('lib/etherip-1.0.0.jar')
    // Spring Boot DevTools 는 뺀다. 켜 두면 애플리케이션 class 가 RestartClassLoader 에서
    // 로드되는데, logback 이 설정 시점에 올려두는 어펜더(WebRealtimeAppender)와 Spring 이
    // 스캔한 Component(LogBroadcaster) 가 서로 다른 ClassLoader 에 걸려 static 필드가 분리된다.
    // 그러면 어펜더가 쌓은 ring buffer 와 WebSocket 핸들러가 조회하는 ring buffer 가 서로 달라
    // Settings 화면의 실시간 로그가 늘 빈 배열로 온다. 자동 재시작이 필요하면 다시 넣기 전에
    // META-INF/spring-devtools.properties 로 web.logs 패키지를 base classloader 로 올려야 한다.
    // developmentOnly("org.springframework.boot:spring-boot-devtools")
}

test {
    // @Tag("db") 는 Docker 의 DB 가 있어야 해서 따로 돈다(dbTest)
    useJUnitPlatform { excludeTags 'db' }
}

/*
 * 두 DB 이식성 통합 시험(DbPortabilityIT). MariaDB 와 SQL Server 에 임시 DB 를 만들어 1.x 스키마로 앱을 띄워 본다.
 *   ./gradlew dbTest                                       로컬 Docker 의 localhost:3306(root), localhost:1433(sa)
 *   ./gradlew dbTest -Dcts.it.sqlserver.url=jdbc:sqlserver://host:1433;encrypt=false -Dcts.it.keep=true
 * 결과는 build/db-it/report-{mariadb,sqlserver}.md. 앱 로그는 build/db-it/logs 에 남아 개발 앱의 logs/ 와 섞이지 않는다.
 */
tasks.register('dbTest', Test) {
    description = 'Boots the app against scratch MariaDB and SQL Server databases built from the 1.x schema.'
    group = 'verification'
    useJUnitPlatform { includeTags 'db' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir = file("$buildDir/db-it")
    doFirst { workingDir.mkdirs() }
    systemProperty 'cts.it.config', file('application.properties').absolutePath
    System.properties.each { k, v -> if (k.toString().startsWith('cts.it.')) systemProperty k.toString(), v }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

/*
 * 셸에서 띄우면서도 VS Code 로 디버깅할 수 있게 JDWP 를 '서버 모드' 로 연다.
 *   ./gradlew bootRun -PdebugPort=5005
 * launch.json 의 "Attach (MK119)" 로 붙였다 뗐다 할 수 있다 — 앱을 죽이지 않아도 된다.
 * 기본 launch 설정(VS Code 가 JVM 을 띄우는 방식)은 그대로 두었으므로 둘 다 쓸 수 있다.
 *
 * 주소를 'host:port' 가 아니라 포트만 적는다 — JDK 8 의 jdwp 는 '*:5005' 형식을 모른다
 * (그 문법은 JDK 9+). 포트만 주면 모든 인터페이스에서 듣는다.
 */
bootRun {
    if (project.hasProperty('debugPort')) {
        jvmArgs = ["-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=${project.debugPort}"]
    }
}
