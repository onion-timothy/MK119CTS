plugins {
    id 'org.springframework.boot' version '2.4.4'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}

group = 'com.onionsoftware.mk119.commtestsuite'
version = '1.0.1'

// 운영 런타임이 Java 8 이므로 toolchain 을 8 로 고정한다.
// 고정하지 않으면 gradle 을 띄운 JVM 이 그대로 쓰여, 같은 코드가 Java 8 과 17 에서
// 다르게 동작했다(예: etherip 의 CIPData.toString() 이 Java 9+ 의 ByteBuffer.clear()
// 시그니처를 요구해 Java 8 에서만 NoSuchMethodError). 컴파일·bootRun·테스트가 모두 8 을 쓴다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.mangoautomation.net/repository/ias-release/'
    }
    google()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
    implementation 'org.projectlombok:lombok:1.18.28'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:2.1.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.63.Final'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.4'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.7'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '2.3.3'
    implementation group: 'org.bgee.log4jdbc-log4j2', name: 'log4jdbc-log4j2-jdbc4.1', version: '1.16'
    implementation group: 'com.google.guava', name: 'guava', version: '32.0.1-jre'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'

    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    implementation files('lib/ireasoningsnmp.jar')
    implementation files('lib/etherip-1.0.0.jar')
    // Spring Boot DevTools 는 뺀다. 켜 두면 애플리케이션 class 가 RestartClassLoader 에서
    // 로드되는데, logback 이 설정 시점에 올려두는 어펜더(WebRealtimeAppender)와 Spring 이
    // 스캔한 Component(LogBroadcaster) 가 서로 다른 ClassLoader 에 걸려 static 필드가 분리된다.
    // 그러면 어펜더가 쌓은 ring buffer 와 WebSocket 핸들러가 조회하는 ring buffer 가 서로 달라
    // Settings 화면의 실시간 로그가 늘 빈 배열로 온다. 자동 재시작이 필요하면 다시 넣기 전에
    // META-INF/spring-devtools.properties 로 web.logs 패키지를 base classloader 로 올려야 한다.
    // developmentOnly("org.springframework.boot:spring-boot-devtools")
}

test {
    useJUnitPlatform()
}
