# 이 파일은 jar 안에 넣지 않는다. jar 와 같은 디렉터리(또는 그 아래 config/)에 두면
# Spring Boot 가 자동으로 읽으므로, 운영에서 값을 바꿀 때 다시 빌드할 필요가 없다.
#
#   java -jar MK119CommunicationTestSuite-2.0.0.jar
#
# 다른 경로의 파일을 쓰려면 실행할 때 지정한다.
#
#   java -jar MK119CommunicationTestSuite-2.0.0.jar --spring.config.location=file:/etc/mk119/application.properties
#
# 이 파일이 없으면 Spring 기본값으로 뜬다. DataSource 설정이 없어 부팅에 실패한다.

server.port=8082
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false

# DataSource. MariaDB 와 SQL Server 를 지원한다. 바꿀 때는 아래 두 블록 중 하나만 살린다.
# Hibernate 방언은 URL 을 보고 앱이 고른다(DialectSelector). spring.jpa.database-platform 은 적지 않는다 —
# SQL Server 에서는 적어 두어도 문자열을 유니코드(nvarchar)로 다루는 CtsSqlServerDialect 로 바꾼다.
# 기동할 때 스키마 확인·마이그레이션 결과는 logs/server.log 와 GET /api/system/startup 에 남는다.
#
# DataSource (MariaDB)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/cts
spring.datasource.username=root
spring.datasource.password=midknight1!
# DataSource (SQL Server)
# 예전 버전이 만든 DB 에 처음 붙으면 문자열 열(varchar·text)을 nvarchar 로 한 번 바꾼다. 올리기 전에 DB 를 백업한다.
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cts;encrypt=false
#spring.datasource.username=sa
#spring.datasource.password=midknight1!
spring.jpa.hibernate.ddl-auto=update
# OSIV 끄기: 켜져 있으면 HTTP 요청 하나가 영속성 컨텍스트를 끝까지 들고 가서
# batch insert 중 flush 마다 누적된 전체 엔티티를 dirty 검사/UPDATE 한다 (O(n^2)).
spring.jpa.open-in-view=false
# 대량 insert 를 JDBC 배치로 묶는다
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#logging.level.jdbc.sqlonly=debug
#logging.level.jdbc.sqltiming=off
#logging.level.jdbc.resultsettable=off
#logging.level.jdbc.audit=off
#logging.level.jdbc.resultset=off
#logging.level.jdbc.connection=off

# Server Data 편집 화면 동시 진입. false(기본) 면 디바이스당 1명, true 면 제한 없음.
# true 일 때 만료 없는 lock 은 그 디바이스의 마지막 편집 세션이 끝날 때 풀린다.
cts.serverdata.multi-session.enabled=true

# Debug: SIMULATION 에러 검증용 modbus 폴러 (기본 off)
debug.modbus-poll.enabled=false
debug.modbus-poll.host=localhost
debug.modbus-poll.port=502
debug.modbus-poll.unitId=1
debug.modbus-poll.expected.original=30
debug.modbus-poll.expected.error=100
