# 이 파일은 jar 안에 넣지 않는다. jar 와 같은 디렉터리(또는 그 아래 config/)에 두면
# Spring Boot 가 자동으로 읽으므로, 운영에서 값을 바꿀 때 다시 빌드할 필요가 없다.
#
#   java -jar MK119CommunicationTestSuite-1.0.0.jar
#
# 다른 경로의 파일을 쓰려면 실행할 때 지정한다.
#
#   java -jar MK119CommunicationTestSuite-1.0.0.jar --spring.config.location=file:/etc/mk119/application.properties
#
# 이 파일이 없으면 Spring 기본값으로 뜬다. DataSource 설정이 없어 부팅에 실패한다.

server.port=8082
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false

# DataSource (MariaDB)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/cts
spring.datasource.username=root
spring.datasource.password=midknight1!
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# DataSource (SQL Server) - 예전 설정, 전환 시 위를 주석 처리하고 아래 해제
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cts_mk119_test
#spring.datasource.username=sa
#spring.datasource.password=midknight1!
spring.jpa.hibernate.ddl-auto=update
# OSIV 끄기: 켜져 있으면 HTTP 요청 하나가 영속성 컨텍스트를 끝까지 들고 가서
# batch insert 중 flush 마다 누적된 전체 엔티티를 dirty 검사/UPDATE 한다 (O(n^2)).
spring.jpa.open-in-view=false
# 대량 insert 를 JDBC 배치로 묶는다
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#logging.level.jdbc.sqlonly=debug
#logging.level.jdbc.sqltiming=off
#logging.level.jdbc.resultsettable=off
#logging.level.jdbc.audit=off
#logging.level.jdbc.resultset=off
#logging.level.jdbc.connection=off