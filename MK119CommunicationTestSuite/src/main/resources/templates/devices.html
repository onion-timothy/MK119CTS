    <script>
        /*<![CDATA[*/
        let devicesTable;
        let tree;

        function onload() {
            tree = $('#tree-container').jstree({
                'core': {
                    'themes': {
                        'responsive': true,
                        "variant": "large"
                    },
                    'check_callback': true,
                    'data': {
                        'url': '/api/device/devices/treeData',
                        'data': function (node) {
                            return {'id': node.id === '#' ? 0 : node.id.split("_")[1]};
                        }
                    },
                },
                "types": {
                    "group": {
                        "icon": "fas fa-folder",
                        "valid_children": ["device", "group"]
                    },
                    "device": {
                        "icon": "fas fa-server"
                    }
                },
                "plugins": [
                    "types", "wholerow", "contextmenu", "sort"
                ],
                'contextmenu': {
                    'items': customMenu
                },
            }).on("select_node.jstree", function (e, data) {
                if (data.node.type === 'group') {
                    $.jstree.reference('#tree-container').open_node(data.node.id);
                    $('#group-title').text('Devices of ' + data.node.text);

                    if (devicesTable)
                        devicesTable.destroy();

                    $.ajax({
                        url: '/api/device/devices/' + data.node.id.split("_")[1],
                        type: 'GET',
                        success: function (data) {
                            let table = $('#devicesTable');
                            $('#devicesTable > tbody').empty();

                            for (let i = 0; i < data.length; i++) {
                                let button = "<button class='" + (data[i].enabled === 1 ? "btn btn-success" : "btn btn-danger") + "' onclick='toggleDevice(" + data[i].id + "," + data[i].enabled + ", this.id)' id='" + data[i].name + "'></button>"
                                let markup = "<tr id='" + data[i].id + "'><td>" + data[i].id + "</td><td>" + data[i].transport + " " + data[i].host + ":" + data[i].port + "</td><td>" + data[i].protocol + "</td><td>" + data[i].name + "</td><td>" + button + "</tr>";
                                table.append(markup);
                            }

                            devicesTable = $('#devicesTable').DataTable({
                                "paging": true,
                                "lengthChange": false,
                                "searching": false,
                                "ordering": true,
                                "info": true,
                                "autoWidth": false,
                                "responsive": true,
                            });

                            $(function () {
                                $('#devicesTable').contextMenu({
                                    selector: 'td',
                                    callback: function (key, options) {
                                        let id = $(this).parent().attr('id');
                                        if (key === 'add') {
                                            location.href = '/addDevice';
                                        } else if (key === 'edit') {
                                            if (typeof (id) != 'undefined') {
                                                location.href = '/editDevice/' + id;
                                            }
                                        } else if (key === 'delete') {
                                            if (id != undefined) {
                                                if (confirm("Confirm to delete device '" + id + "'")) {
                                                    $.ajax({
                                                        url: '/api/device/deleteDevice/' + id,
                                                        type: 'DELETE',
                                                        contentType: 'application/json',
                                                        success: function () {
                                                            location.reload();
                                                        },
                                                        error: function (request) {
                                                            alert(request.status + request.responseText);
                                                        }
                                                    });
                                                }
                                            }
                                        } else if (key === 'toggle') {
                                            if (id != undefined) {
                                                let enabled;
                                                $.ajax({
                                                    url: '/api/device/getEnabled/' + id,
                                                    type: 'GET',
                                                    async: false,
                                                    contentType: 'application/json',
                                                    success: function (data) {
                                                        enabled = data;
                                                    },
                                                    error: function (request) {
                                                        alert(request.status + request.responseText);
                                                    }
                                                });
                                                let deviceName = '';
                                                for (let i = 0; i < devicesTable.rows().count(); i++) {
                                                    if (devicesTable.cell(i, 0).data() === id) {
                                                        deviceName = devicesTable.cell(i, 3).data();
                                                    }
                                                }
                                                if (confirm((enabled ? 'Disable' : 'Enable') + " device '" + deviceName + "'?")) {
                                                    $.ajax({
                                                        url: '/api/device/setEnabled/' + id + '/' + (enabled ? 0 : 1),
                                                        type: 'POST',
                                                        contentType: 'application/json',
                                                        success: function () {
                                                            location.reload()
                                                        },
                                                        error: function (request) {
                                                            alert(request.status + request.responseText);
                                                        }
                                                    });
                                                }
                                            }
                                        }
                                    },
                                    items: {
                                        "add": {name: "Add device", icon: "fas fa-plus"},
                                        "edit": {name: "Edit device", icon: "fas fa-pen"},
                                        "delete": {name: "Delete device", icon: "fas fa-trash"},
                                        "toggle": {name: "Toggle device", icon: "fas fa-toggle-off"},
                                    }
                                });
                            });
                        }
                    });

                }
            }).on("ready.jstree", function (e, data) {
                // 시작할 때 루트 노드를 열어준다.
                $.jstree.reference('#tree-container').open_node('g_1');
                $.jstree.reference('#tree-container').select_node('g_1');
            });
        }

        function customMenu(node) {
            let items = {
                'addGroup': {
                    'label': 'Add group',
                    'action': function (data) {
                        let group = {};
                        group.name = prompt('Enter name of new group.');
                        group.parent_id = $.jstree.reference('#tree-container').get_selected()[0].split("_")[1];
                        if (group.name === null) {
                            return;
                        } else {
                            $.ajax({
                                url: '/api/group/addGroup',
                                type: 'PUT',
                                contentType: 'application/json',
                                data: JSON.stringify(group),
                                success: function (data) {
                                    location.reload();
                                },
                                error: function (request, status, error) {
                                    if (request.responseText.includes('GROUPS_UNIQUE')) {
                                        alert("Cannot create groups with the same name within a group.");
                                    } else
                                        alert(request.status + request.responseText);
                                }
                            });
                        }
                    }
                },
                'deleteGroup': {
                    'label': 'Delete group',
                    'action': function () {
                        let id = $.jstree.reference('#tree-container').get_selected()[0];
                        let groupName = $.jstree.reference('#tree-container').get_text(id);
                        if (confirm("Confirm to delete group '" + groupName + "'?")) {
                            $.ajax({
                                url: '/api/group/deleteGroup/' + id.split("_")[1],
                                type: 'DELETE',
                                contentType: 'application/json',
                                success: function (data) {
                                    location.reload();
                                },
                                error: function (request, status, error) {
                                    alert(request.status + request.responseText);
                                }
                            });
                        }
                    }
                },
                'renameGroup': {
                    'label': 'Rename group',
                    'action': function () {
                        let id = $.jstree.reference('#tree-container').get_selected()[0];
                        let oldName = $.jstree.reference('#tree-container').get_text(id);
                        let newName = prompt("Enter new name of group '" + oldName + "'");
                        if (newName === null) {
                            return;
                        } else {
                            let group = {};
                            group.id = id.split("_")[1];
                            group.name = newName;
                            $.ajax({
                                url: '/api/group/renameGroup',
                                type: 'POST',
                                data: JSON.stringify(group),
                                contentType: 'application/json',
                                success: function (data) {
                                    location.reload();
                                },
                                error: function (request, status, error) {
                                    if (request.responseText.includes('GROUPS_UNIQUE')) {
                                        alert("Cannot create groups with the same name within a group.");
                                    } else
                                        alert(request.status + request.responseText);
                                }
                            });
                        }
                    }
                }
            }

            if (node.type === 'device') {
                delete items.deleteGroup;
                delete items.addGroup;
                delete items.renameGroup;
            }
            return items;
        }

        function toggleDevice(id, enabled, deviceName) {
            if (confirm((enabled === 1 ? 'Disable' : 'Enable') + " device '" + deviceName + "'?")) {
                $.ajax({
                    url: '/api/device/setEnabled/' + id + '/' + (enabled === 1 ? 0 : 1),
                    type: 'POST',
                    contentType: 'application/json',
                    success: function (data) {
                        location.reload()
                    },
                    error: function (request, status, error) {
                        alert(request.status + request.responseText);
                    }
                });
            }
        }

        /*]]>*/
    </script>
