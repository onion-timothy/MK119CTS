<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/plugins/tabulator/css/tabulator_bootstrap5.min.css">
    <link rel="stylesheet" href="/css/cts-table.css">
    <th:block th:replace="~{fragments/tabler :: tree-assets}"></th:block>

    <style>

        /* 메인 카드: 툴바가 card-header 로 이동했으므로 카드를 container 로 삼는다. */
        .cts-main-card { container-type: inline-size; container-name: devs; }

        /* 테이블 wrapper: 외곽 border/radius 는 바깥 card 가 제공한다. (JS 가 ancestor 로 참조) */
        .devices-panel { overflow: hidden; min-height: 0; }

        /* 툴바 버튼 텍스트: 좁아지면 숨기고 아이콘만 표시 */
        #devicesToolbar .btn { white-space: nowrap; }
        @container devs (max-width: 720px) {
            #devicesToolbar .btn-text { display: none; }
        }
        @container devs (max-width: 520px) {
            #devicesSearchInput { width: 100px !important; }
        }

        /* 뷰포트 방향에 따라 트리/본문 배치를 전환한다.
           가로가 길면 좌우, 세로가 길면 상하. 인라인 flex 비율을 덮어쓰므로 !important 가 필요하다. */
        @media (orientation: portrait) {
            .cts-split { flex-direction: column !important; }
            .cts-split > .cts-split-side { flex: 2 1 0 !important; }
            .cts-split > .cts-split-main { flex: 5 1 0 !important; }
        }
    </style>

    <script>
        /*<![CDATA[*/
        let devicesTable;
        let tree;
        let _devices;
        let _simulations;
        let currentDevices;

        let groupSelected = '[[${group}]]';

        /** 편집기가 지금 보고 있는 그룹을 미리 골라 두게 넘긴다 */
        function addDeviceUrl() {
            const id = tree && tree.selected();
            return '/addDevice' + (id ? '?group=' + id.split('_')[1] : '');
        }

        String.format = function () {
            let args = arguments;
            return args[0].replace(/{(\d+)}/g, function (match, num) {
                num = Number(num) + 1;
                return typeof (args[num]) != 'undefined' ? args[num] : match;
            });
        }

        function escapeHtml(s) {
            if (s === null || typeof s === 'undefined') return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderSettingsSummary(raw) {
            if (!raw) return '<span class="text-muted">-</span>';
            let obj;
            try {
                obj = (typeof raw === 'string') ? JSON.parse(raw) : raw;
            } catch (e) {
                return '<span class="text-danger">' + escapeHtml(raw) + '</span>';
            }
            if (!obj || typeof obj !== 'object') {
                return escapeHtml(raw);
            }
            let rows = Object.keys(obj).map(function (k) {
                let v = obj[k];
                if (v !== null && typeof v === 'object') v = JSON.stringify(v);
                return '<div><span class="text-muted">' + escapeHtml(k) + '</span> ' + escapeHtml(v) + '</div>';
            });
            return '<div style="font-size:0.85rem; line-height:1.5; text-align:left;">' + rows.join('') + '</div>';
        }

        function onload() {
            tree = CtsTree.create(document.getElementById('tree-container'), {
                url: '/api/device/devices/treeData',
                // ?group= 로 들어온 그룹을 고른다. ROOT 면 그것만 펼치고, 아니면 끝까지 펼쳐야 찾는다
                expandAll: groupSelected !== '1',
                expandOnSelect: true,
                initialSelect: 'g_' + groupSelected,
                // 장비를 눌러도 그 장비가 든 그룹이 골라진다 — 오른쪽 표가 그룹 단위라서
                selectable: function (node) { return node.type === 'group' ? node.id : node.parent; },
                contextMenu: customMenu,
                onSelect: function (node) {
                    if (node.type !== 'group') return;
                    $('#group-title').text('Devices of ' + node.text);

                    if (devicesTable) {
                        devicesTable.destroy();
                        devicesTable = null;
                    }

                    $.ajax({
                        url: '/api/device/devices/' + node.id.split("_")[1],
                        type: 'GET',
                        success: function (data) {
                            currentDevices = data;

                            devicesTable = new Tabulator('#devicesTable', {
                                data: data,
                                layout: 'fitData',
                                height: '100%',
                                renderVertical: 'basic',
                                pagination: true,
                                paginationSize: 10,
                                selectableRows: true,
                                placeholder: 'No devices in this group',
                                rowContextMenu: buildDeviceRowMenu(),
                                columns: CtsTable.columns([
                                    CtsTable.selectionColumn(),
                                    {title: 'Name', field: 'name', kind: 'text'},
                                    {
                                        title: 'Address',
                                        field: 'address',
                                        kind: 'text',
                                        formatter: function (cell) {
                                            let d = cell.getRow().getData();
                                            return escapeHtml(d.transport) + ' ' + escapeHtml(d.host) + ':' + escapeHtml(d.port);
                                        }
                                    },
                                    {title: 'Protocol', field: 'protocol', kind: 'text'},
                                    {
                                        title: 'Enabled',
                                        field: 'enabled',
                                        kind: 'action',
                                        formatter: function (cell) {
                                            let enabled = cell.getValue() === 1;
                                            return '<button class="cts-toggle' + (enabled ? ' on' : '') + '" aria-label="' + (enabled ? 'Enabled' : 'Disabled') + '"></button>';
                                        },
                                        cellClick: function (e, cell) {
                                            let d = cell.getRow().getData();
                                            toggleDevice(d.id, d.enabled, d.name);
                                        }
                                    }
                                ])
                            });
                            CtsTable.attach(devicesTable, { rowH: DEVICES_BASE_ROW_H });
                            devicesTable.on('tableBuilt', function () {
                                applyDevicesSearch();
                                injectDevicesFooterButtons();
                            });
                        }
                    });
                }
            });

            bindDevicesToolbarActions();
            bindDevicesSearch();
            bindTreeSearch();

            $('#excel').change(function (e) {
                let file = e.target.files[0];
                if (!file) return;
                let groupId = tree.selected().split('_')[1];
                let reader = new FileReader();
                reader.onload = function () {
                    let wb = XLSX.read(reader.result, { type: 'binary' });
                    let deviceSheet = wb.SheetNames[0];
                    let simSheet = wb.SheetNames[1];
                    let deviceRows = deviceSheet ? XLSX.utils.sheet_to_json(wb.Sheets[deviceSheet]) : [];
                    let simRows = simSheet ? XLSX.utils.sheet_to_json(wb.Sheets[simSheet]) : [];

                    let normalizedDevices = deviceRows.map(function (r) {
                        let cs = r.communicationSettings;
                        if (typeof cs === 'string') {
                            try { cs = JSON.parse(cs); } catch (e) { /* 서버 검증이 Invalid JSON 으로 잡음 */ }
                        }
                        return {
                            name: r.name,
                            host: r.host,
                            transport: r.transport,
                            port: r.port,
                            protocol: r.protocol,
                            communicationSettings: cs,
                            enabled: r.enabled
                        };
                    });

                    let normalizedSims = simRows.map(function (r) {
                        let p = {};
                        ['id', 'policy', 'data_type', 'value', 'stopOnControl'].forEach(function (k) {
                            if (k in r) p[k] = r[k];
                        });
                        if (r.range !== undefined && r.range !== null && r.range !== '') {
                            p.range = String(r.range).split(',').map(function (b) { return parseInt(b, 10); });
                        }
                        return {
                            deviceName: r.deviceName,
                            name: r.name,
                            target: r.target,
                            interval: r.interval,
                            enabled: r.enabled,
                            policies: [p]
                        };
                    });

                    // 검증은 batch 페이지가 클라이언트에서 수행한다. 여기서는 파싱 결과만 넘긴다.
                    sessionStorage.setItem('batchAddValidation', JSON.stringify({
                        devices: normalizedDevices,
                        simulations: normalizedSims
                    }));
                    location.href = '/devices/batch?group=' + groupId;
                };
                reader.readAsBinaryString(file);
                $('#excel').val('');
            });
        }

        function getErrorMessage(devices, obj, objs) {
            const duplicatedName1 = devices.filter((device) => device.name === obj.name);
            if (duplicatedName1.length > 0) {
                return 'Duplicated device name.'
            }
            const duplicatedName2 = objs.filter((_obj) => _obj.name === obj.name);
            if (duplicatedName2.length > 1) {
                return 'Duplicated device name.'
            }
            if (obj.transport !== 'TCP' && obj.transport !== 'UDP') {
                return 'Invalid transport.'
            }
            if (!Number.isInteger(obj.port) || obj.port > 65535 || obj.port < 0) {
                return 'Invalid port.'
            }
            if (obj.protocol !== 'GENERIC' &&
                obj.protocol !== 'MODBUS' &&
                obj.protocol !== 'XGT_PLC' &&
                obj.protocol !== 'DAEYUN_RCU' &&
                obj.protocol !== 'SNMP' &&
                obj.protocol !== 'BACNET'
                && obj.protocol !== 'OPC_AGENT'
                && obj.protocol !== 'DB'
                && obj.protocol !== 'ETHERNET_IP') {
                return 'Invalid protocol.'
            }
            return '';
        }


        function convertObject(obj) {
            let ret = {};
            ret.transport = obj.transport;
            ret.protocol = obj.protocol;

            ret.host = obj.host;
            ret.port = obj.port;
            ret.communicationSettings = JSON.parse(obj.communicationSettings);
            ret.name = obj.name;
            let group = {};
            group.id = tree.selected().split("_")[1];
            ret.group = group;
            ret.enabled = obj.enabled;
            ret.log = 0;
            return ret;
        }

        function getSimulationErrorMessage(obj, allowedDeviceNames) {
            if (!obj.deviceName) return 'Missing deviceName.';
            if (!allowedDeviceNames.has(obj.deviceName)) return 'Unknown device: ' + obj.deviceName;
            if (!obj.name) return 'Missing simulation name.';
            return '';
        }

        function convertSimulationObject(obj) {
            let simulationPolicy = {};
            ['id', 'policy', 'data_type', 'value', 'stopOnControl'].forEach(function (key) {
                if (key in obj) simulationPolicy[key] = obj[key];
            });
            if (obj.range !== undefined && obj.range !== null && obj.range !== '') {
                simulationPolicy.range = String(obj.range).split(',').map(function (b) { return parseInt(b); });
            }
            return {
                deviceName: obj.deviceName,
                name: obj.name,
                target: obj.target,
                interval: obj.interval,
                enabled: obj.enabled,
                policies: [simulationPolicy]
            };
        }

        /** 우클릭 메뉴. 그룹에서만 뜨고, 장비에서는 아무것도 주지 않는다 */
        function customMenu(node) {
            if (node.type !== 'group') return [];
            return [
                {
                    label: 'Add group',
                    action: function () {
                        let group = {};
                        group.name = prompt('Enter name of new group.');
                        if(group.name == null || group.name === '') return;
                        group.parentId = tree.selected().split("_")[1];

                        $.ajax({
                            url: '/api/group/addGroup',
                            type: 'PUT',
                            contentType: 'application/json',
                            data: JSON.stringify(group),
                            success: function () {
                                let group = tree.selected().split("_")[1];
                                location.href = '/devices?group=' + group;
                            },
                            error: function (request) {
                                if (request.responseText.includes('GROUPS_UNIQUE')) {
                                    alert("Cannot create groups with the same name within a group.");
                                } else
                                    alert(request.status + request.responseText);
                            }
                        });

                    }
                },
                {
                    label: 'Delete group',
                    action: function () {
                        let id = tree.selected();
                        if (id === 'g_1') {
                            alert('ROOT cannot be deleted.');
                            return;
                        }
                        let groupName = tree.textOf(id);
                        if (confirm("Confirm to delete group '" + groupName + "'?")) {
                            $.ajax({
                                url: '/api/group/deleteGroup/' + id.split("_")[1],
                                type: 'DELETE',
                                contentType: 'application/json',
                                success: function () {
                                    let group = tree.selected().split("_")[1];
                                    location.href = '/devices?group=' + group;
                                },
                                error: function (request) {
                                    alert(request.status + request.responseText);
                                }
                            });
                        }
                    }
                },
                {
                    label: 'Rename group',
                    action: function () {
                        let id = tree.selected();
                        if (id === 'g_1') {
                            alert('ROOT cannot be renamed.');
                            return;
                        }
                        let oldName = tree.textOf(id);
                        let newName = prompt("Enter new name of group '" + oldName + "'");

                        let group = {};
                        group.id = id.split("_")[1];
                        group.name = newName;
                        $.ajax({
                            url: '/api/group/renameGroup',
                            type: 'POST',
                            data: JSON.stringify(group),
                            contentType: 'application/json',
                            success: function (data) {
                                let group = tree.selected().split("_")[1];
                                location.href = '/devices?group=' + group;
                            },
                            error: function (request, status, error) {
                                if (request.responseText.includes('GROUPS_UNIQUE')) {
                                    alert("Cannot create groups with the same name within a group.");
                                } else
                                    alert(request.status + request.responseText);
                            }
                        });

                    }
                }
            ];
        }

        function bindDevicesToolbarActions() {
            // 툴바 + Tabulator footer 모두 아우르는 패널에 delegation
            let panel = document.querySelector('.devices-panel');
            if (!panel) return;
            panel.addEventListener('click', function (e) {
                let btn = e.target.closest('[data-action]');
                if (!btn) return;
                let action = btn.getAttribute('data-action');
                if (action === 'add') {
                    location.href = addDeviceUrl();
                } else if (action === 'batchAdd') {
                    $('#excel').click();
                } else if (!devicesTable) {
                    alert('Select a group first.');
                } else if (action === 'toggle') {
                    toggleSelectedDevices();
                } else if (action === 'copy') {
                    alert('Copy device: not implemented yet.');
                } else if (action === 'delete') {
                    deleteSelectedDevices();
                }
            });
        }

        // 선택과 무관한 액션 버튼들을 Tabulator footer(pagination) 좌측에 주입
        function injectDevicesFooterButtons() {
            if (!devicesTable) return;
            let footerContents = devicesTable.element.querySelector('.tabulator-footer .tabulator-footer-contents');
            if (!footerContents) return;
            if (footerContents.querySelector('.cts-footer-actions')) return;
            let el = document.createElement('div');
            el.className = 'cts-footer-actions';
            el.style.cssText = 'display:inline-flex; gap:0.25rem;';
            el.innerHTML =
                '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="add"><i class="fas fa-plus"></i> <span class="btn-text">Add</span></button>' +
                '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="batchAdd"><i class="fas fa-file-excel"></i> <span class="btn-text">Batch Add</span></button>' +
                '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="copy"><i class="fas fa-copy"></i> <span class="btn-text">Copy</span></button>';
            footerContents.insertBefore(el, footerContents.firstChild);
        }

        function toggleSelectedDevices() {
            let rows = devicesTable.getSelectedRows();
            if (rows.length === 0) { alert('No devices selected.'); return; }
            if (!confirm('Toggle ' + rows.length + ' device(s)?')) return;
            let items = rows.map(function (r) { return {id: r.getData().id, enabled: r.getData().enabled}; });
            let groupId = tree.selected().split("_")[1];
            let failures = [];
            let i = 0;
            let next = function () {
                if (i >= items.length) {
                    if (failures.length > 0) alert('Failed: ' + failures.join(', '));
                    location.href = '/devices?group=' + groupId;
                    return;
                }
                let it = items[i];
                $.ajax({
                    url: '/api/device/setEnabled/' + it.id + '/' + (it.enabled === 1 ? 0 : 1),
                    type: 'POST',
                    contentType: 'application/json',
                    error: function (r) { failures.push(it.id + ' (' + r.status + ')'); },
                    complete: function () { i++; next(); }
                });
            };
            next();
        }

        // 디바이스를 지우면 딸린 것도 함께 사라진다. 목록까지 보여 주면 길어지므로 무엇이
        // 지워지는지만 알린다.
        const CASCADE_WARNING =
            'Their value simulations, error simulations, and test plan actions will be deleted too.';

        /** Action 이 하나도 안 남아 통째로 사라진 Test Plan 을 알린다. 없으면 아무 말도 하지 않는다. */
        function notifyDroppedPlans(names) {
            if (!names || names.length === 0) return;
            alert('These test plans were deleted because they had no actions left:\n\n'
                + names.map(function (n) { return '  · ' + n; }).join('\n'));
        }

        function deleteSelectedDevices() {
            let rows = devicesTable.getSelectedRows();
            if (rows.length === 0) {
                alert('No devices selected.');
                return;
            }
            if (!confirm('Delete ' + rows.length + ' device(s)?\n\n' + CASCADE_WARNING)) return;

            let ids = rows.map(function (r) { return r.getData().id; });
            let groupId = tree.selected().split("_")[1];
            let failures = [];
            let droppedPlans = [];
            let i = 0;

            let next = function () {
                if (i >= ids.length) {
                    if (failures.length > 0) {
                        alert('Failed to delete: ' + failures.join(', '));
                    }
                    notifyDroppedPlans(droppedPlans);
                    location.href = '/devices?group=' + groupId;
                    return;
                }
                let id = ids[i];
                $.ajax({
                    url: '/api/device/deleteDevice/' + id,
                    type: 'DELETE',
                    contentType: 'application/json',
                    success: function (res) {
                        droppedPlans = droppedPlans.concat((res && res.deletedPlans) || []);
                    },
                    error: function (request) {
                        failures.push(id + ' (' + request.status + ')');
                    },
                    complete: function () {
                        i++;
                        next();
                    }
                });
            };
            next();
        }

        function bindTreeSearch() {
            let input = document.getElementById('treeSearchInput');
            if (!input) return;
            let timer;
            input.addEventListener('input', function () {
                clearTimeout(timer);
                timer = setTimeout(function () {
                    if (tree) tree.search(input.value);
                }, 150);
            });
        }

        function bindDevicesSearch() {
            let fieldEl = document.getElementById('devicesSearchField');
            let inputEl = document.getElementById('devicesSearchInput');
            if (!fieldEl || !inputEl) return;
            fieldEl.addEventListener('change', applyDevicesSearch);
            inputEl.addEventListener('input', applyDevicesSearch);
        }

        function applyDevicesSearch() {
            if (!devicesTable) return;
            let field = document.getElementById('devicesSearchField').value;
            let val = document.getElementById('devicesSearchInput').value.trim();
            if (!val) {
                devicesTable.clearFilter();
                return;
            }
            let needle = val.toLowerCase();
            if (field === 'address') {
                devicesTable.setFilter(function (data) {
                    let addr = (data.transport + ' ' + data.host + ':' + data.port).toLowerCase();
                    return addr.indexOf(needle) !== -1;
                });
            } else {
                devicesTable.setFilter(field, 'like', val);
            }
        }

        // 기준 행 높이. 실제 높이는 CtsTable 이 표 높이를 나눠떨어지게 조금 늘린다
        const DEVICES_BASE_ROW_H = 48;

        function buildDeviceRowMenu() {
            return [
                {
                    label: "<i class='fas fa-plus'></i> Add device",
                    action: function () { location.href = addDeviceUrl(); }
                },
                {
                    label: "<i class='fas fa-file-excel'></i> Add device(batch)",
                    action: function () { $('#excel').click(); }
                },
                {
                    label: "<i class='fas fa-pen'></i> Edit device",
                    action: function (e, row) {
                        location.href = '/editDevice/' + row.getData().id;
                    }
                },
                {
                    label: "<i class='fas fa-trash'></i> Delete device",
                    action: function (e, row) {
                        let d = row.getData();
                        if (!confirm("Delete device '" + d.name + "'?\n\n" + CASCADE_WARNING)) return;
                        $.ajax({
                            url: '/api/device/deleteDevice/' + d.id,
                            type: 'DELETE',
                            contentType: 'application/json',
                            success: function (res) {
                                notifyDroppedPlans(res && res.deletedPlans);
                                let group = tree.selected().split("_")[1];
                                location.href = '/devices?group=' + group;
                            },
                            error: function (request) {
                                alert(request.status + request.responseText);
                            }
                        });
                    }
                },
                {
                    label: "<i class='fas fa-toggle-off'></i> Toggle device",
                    action: function (e, row) {
                        let d = row.getData();
                        toggleDevice(d.id, d.enabled, d.name);
                    }
                },
                {
                    label: "<i class='fas fa-sliders-h'></i> Server Data",
                    action: function (e, row) {
                        location.href = '/devices/' + row.getData().id + '/serverdata';
                    }
                }
            ];
        }

        function toggleDevice(id, enabled, deviceName) {
            if (confirm((enabled === 1 ? 'Disable' : 'Enable') + " device '" + deviceName + "'?")) {
                $.ajax({
                    url: '/api/device/setEnabled/' + id + '/' + (enabled === 1 ? 0 : 1),
                    type: 'POST',
                    contentType: 'application/json',
                    success: function () {
                        let group = tree.selected().split("_")[1];
                        location.href = '/devices?group=' + group;
                    },
                    error: function (request) {
                        alert(request.status + request.responseText);
                    }
                });
            }
        }

        function performUpload() {
            let totalDev = _devices.length;
            let totalSim = _simulations.length;
            let total = totalDev + totalSim;
            if (total === 0) {
                alert('Nothing to register.');
                return;
            }
            let group = tree.selected().split("_")[1];

            // deviceName → id 매핑 (기존 group 내 device + 새로 생성될 device)
            let nameToId = {};
            $.ajax({
                url: '/api/device/devices/' + group,
                type: 'GET',
                async: false,
                success: function (res) {
                    (res || []).forEach(function (d) { nameToId[d.name] = d.id; });
                }
            });

            let $bar = $('#uploadProgressBar');
            let $text = $('#uploadProgressText');
            let doneCount = 0;
            let failures = [];
            let setProgress = function () {
                let pct = total ? Math.round(doneCount / total * 100) : 0;
                $bar.css('width', pct + '%').attr('aria-valuenow', pct).text(pct + '%');
                $text.text(doneCount + ' / ' + total + (failures.length > 0 ? ' (' + failures.length + ' failed)' : ''));
            };
            setProgress();

            let finishUpload = function () {
                if (failures.length > 0) {
                    CtsModal.hide('#uploadProgressModal');
                    alert('Completed with ' + failures.length + ' failure(s):\n\n' + failures.join('\n'));
                }
                location.href = '/devices?group=' + group;
            };

            let j = 0;
            let uploadNextSim = function () {
                if (j >= totalSim) {
                    finishUpload();
                    return;
                }
                let sim = _simulations[j];
                let devId = nameToId[sim.deviceName];
                if (!devId) {
                    failures.push((sim.name || ('#' + j)) + ': device "' + sim.deviceName + '" not found');
                    j++;
                    doneCount++;
                    setProgress();
                    uploadNextSim();
                    return;
                }
                let payload = {
                    name: sim.name,
                    target: sim.target,
                    interval: sim.interval,
                    enabled: sim.enabled,
                    policies: sim.policies,
                    device: { id: devId }
                };
                $.ajax({
                    url: '/api/simulation/addSimulation',
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    error: function (request) {
                        failures.push((sim.name || ('#' + j)) + ': ' + request.status + ' ' + request.responseText);
                    },
                    complete: function () {
                        j++;
                        doneCount++;
                        setProgress();
                        uploadNextSim();
                    }
                });
            };

            let i = 0;
            let uploadNextDevice = function () {
                if (i >= totalDev) {
                    uploadNextSim();
                    return;
                }
                let device = _devices[i];
                $.ajax({
                    url: '/api/device/addDevice',
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(device),
                    success: function (created) {
                        if (created && created.name && created.id) {
                            nameToId[created.name] = created.id;
                        }
                    },
                    error: function (request) {
                        let msg = request.responseText && request.responseText.includes('UNIQUE')
                            ? 'Cannot create with the same name.'
                            : (request.status + ' ' + request.responseText);
                        failures.push((device.name || ('#' + i)) + ': ' + msg);
                    },
                    complete: function () {
                        i++;
                        doneCount++;
                        setProgress();
                        uploadNextDevice();
                    }
                });
            };

            // excel 모달을 닫고, 닫힘 완료 후 진행률 모달(입력 차단)을 띄운 뒤 업로드 시작
            // BS5 의 hidden.bs.modal 은 네이티브 이벤트다. jQuery .one() 으로는 안 걸린다
            CtsModal.onHidden('#excelTableModal', function () {
                CtsModal.show('#uploadProgressModal');
                uploadNextDevice();
            });
            CtsModal.hide('#excelTableModal');
        }

        function generateTemplate() {
            // Sheet 1: devices
            let deviceRows = currentDevices.map(({ id, group, log, ...rest }) => rest).map(row => {
                return {
                    ...row,
                    communicationSettings: JSON.stringify(row.communicationSettings)
                };
            });
            const deviceHeaders = ['name', 'host', 'transport', 'port', 'protocol', 'communicationSettings', 'enabled'];

            // Sheet 2: simulations (first column = deviceName)
            let simulationRows = [];
            currentDevices.forEach(function (dev) {
                $.ajax({
                    url: '/api/simulation/simulations/' + dev.id,
                    type: 'GET',
                    async: false,
                    success: function (sims) {
                        (sims || []).forEach(function (s) {
                            let p = (s.policies && s.policies[0]) || {};
                            simulationRows.push({
                                deviceName: dev.name,
                                name: s.name,
                                target: s.target,
                                id: p.id,
                                policy: p.policy,
                                data_type: p.data_type,
                                range: p.range ? p.range.join(',') : null,
                                // SEQUENCE 의 value 는 숫자 배열 — 그대로 넣으면 SheetJS 가 칸을 비워 둔다
                                value: Array.isArray(p.value) ? p.value.join(',')
                                    : p.value === null || p.value === undefined ? 'null' : p.value,
                                // stopOnControl 은 Simulation 의 최상위 필드다. policies[0] 에서 읽으면 늘 비어 있다
                                stopOnControl: s.stopOnControl,
                                interval: s.interval,
                                enabled: s.enabled
                            });
                        });
                    }
                });
            });
            const simHeaders = ['deviceName', 'name', 'target', 'id', 'policy', 'data_type', 'range', 'value', 'stopOnControl', 'interval', 'enabled'];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.json_to_sheet(deviceRows, { header: deviceHeaders }), 'Devices');
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.json_to_sheet(simulationRows, { header: simHeaders }), 'Simulations');
            XLSX.writeFile(workbook, 'batch_template.xlsx');
        }

        /*]]>*/
    </script>
</head>
<body onload="onload()">
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('devices')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('Devices', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list">
            <button type="button" class="btn btn-sm" onclick="generateTemplate()" title="Export the device list to Excel">
                <i class="fas fa-download"></i> Export
            </button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <input type="file" id="excel" name="excel" style="display:none" accept=".xlsx"/>
            <div class="container-fluid flex-grow-1 d-flex cts-split" style="gap: var(--cts-page-gap); min-height:0;">
                <div class="d-flex flex-column cts-split-side" style="flex: 3 1 0; min-width: 0; min-height: 0;">
                    <th:block th:replace="~{fragments/tabler :: tree-card}"></th:block>
                </div>
                <div class="d-flex flex-column cts-split-main" style="flex: 7 1 0; min-width: 0; min-height: 0;">
                    <div class="card cts-main-card mb-0 d-flex flex-column flex-grow-1" id="devicesCard" style="min-height: 0;">
                        <div class="card-header flex-shrink-0" style="gap:0.25rem;">
                            <h3 class="card-title mb-0" id="group-title"></h3>
                            <div id="devicesToolbar" class="card-actions table-toolbar">
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-action="toggle"><i class="fas fa-toggle-off"></i> <span class="btn-text">Toggle</span></button>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete"><i class="fas fa-trash"></i> <span class="btn-text">Delete</span></button>
                                <select id="devicesSearchField" class="form-select form-select-sm" style="width:auto;">
                                    <option value="name">Name</option>
                                    <option value="address">Address</option>
                                    <option value="protocol">Protocol</option>
                                </select>
                                <input id="devicesSearchInput" type="search" class="form-control form-control-sm" placeholder="Search..." style="width:180px; min-width:0;">
                            </div>
                        </div>
                        <!-- /.card-header -->
                        <div class="card-body flex-grow-1 d-flex flex-column" style="overflow:hidden; min-height:0; padding:0;">
                            <div class="devices-panel flex-grow-1 d-flex flex-column" style="min-height:0;">
                                <div id="devicesTable" class="cts-tabulator cts-fill"></div>
                            </div>
                        </div>
                        <!-- /.card-body -->
                    </div>
                </div>
            </div><!-- /.container-fluid -->
        </div>
        <!-- /.page-body -->
    </div>
    <!-- /.page-wrapper -->

    <!-- excel table modal -->
    <div class="modal fade" id="excelTableModal" tabindex="-1" role="dialog" aria-labelledby="excelTableModalLabel"
         aria-hidden="true">
        <div class="modal-dialog" role="document" style="max-width:fit-content">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="excelTableModalLabel">Register New Devices and Simulations by Excel</h5>
                </div>
                <div class="modal-body">
                    <h6 class="mt-1">Devices <small class="text-muted" id="excelDeviceCount"></small></h6>
                    <table class="table table-bordered" id="excelObjects" style="overflow-y: auto;">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Host</th>
                            <th>Transport</th>
                            <th>Port</th>
                            <th>Protocol</th>
                            <th>Communication Settings</th>
                            <th>Enabled</th>
                            <th>Error</th>
                        </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                    <h6 class="mt-3">Simulations <small class="text-muted" id="excelSimCount"></small></h6>
                    <table class="table table-bordered" id="excelSimObjects" style="overflow-y: auto;">
                        <thead>
                        <tr>
                            <th>Device Name</th>
                            <th>Name</th>
                            <th>Target</th>
                            <th>Policy</th>
                            <th>Interval</th>
                            <th>Enabled</th>
                            <th>Error</th>
                        </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button class="btn btn-outline-secondary" type="button" onclick="$('#excel').click();"><i class="fas fa-file-excel"></i> Upload</button>
                    <button class="btn btn-primary" type="button" onclick="performUpload()" id="registerByExcel" disabled>
                        Register
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Excel modal end -->

    <!-- progress modal -->
    <div class="modal fade" id="uploadProgressModal" data-backdrop="static" data-keyboard="false"
         tabindex="-1" role="dialog" aria-labelledby="uploadProgressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadProgressModalLabel">Registering devices and simulations…</h5>
                </div>
                <div class="modal-body">
                    <div class="progress" style="height: 22px;">
                        <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                             role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0"
                             aria-valuemax="100">0%</div>
                    </div>
                    <div id="uploadProgressText" class="text-muted small mt-2">0 / 0</div>
                    <div class="text-muted small mt-1">Please wait, do not close this window.</div>
                </div>
            </div>
        </div>
    </div>
    <!-- progress modal end -->

</div>
<!-- /.page -->
