<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS — Simulation</title>

    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/css/dist-editor.css">
    <link rel="stylesheet" href="/css/cts-target-aid.css">
    <link rel="stylesheet" href="/css/cts-reg-map.css">

    <style>
        /* 세로로 길면 위아래로 쌓고, 가로로 넓으면 좌(등록정보·정책) / 우(등록 현황) 로 나눈다 */
        .ed-body { flex: 1 1 auto; min-height: 0; display: grid; gap: var(--cts-page-gap);
                   grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
        @media (min-width: 1100px) {
            .ed-body { grid-template-columns: minmax(0, 3fr) minmax(0, 7fr); grid-template-rows: minmax(0, 1fr); }
        }
        .ed-left { display: flex; flex-direction: column; gap: var(--cts-page-gap); min-height: 0; min-width: 0; }
        /* 시뮬레이션 자체는 칸이 몇 개뿐이라 내용만큼만 쓰는 띠로 둔다 */
        .ed-head { flex: 0 0 auto; }
        /* 정책 칸은 등록정보 아래 남는 높이를 다 쓴다. 넘치면 그 안에서 세로로 스크롤한다 */
        .ed-policies { flex: 1 1 auto; min-height: 0; }

        /* target 입력 보조의 조각 이름표는 폼 label 굵기를 따르지 않는다 */
        label.ta-part { font-weight: normal; margin-bottom: 0; color: inherit; }
        .ta-part select, .ta-part input { font-size: .875rem; }

        /* 정책 카드는 칸 폭을 다 쓰고 위아래로 쌓인다. 많아지면 세로로 넘긴다 */
        #policies { display:flex; flex-direction:column; gap:.6rem; }
        .ed-policy { border:1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); overflow:hidden; flex:0 0 auto; }
        .ed-policy-head { background: var(--tblr-bg-surface-secondary, #f8f9fa); border-bottom:1px solid var(--tblr-border-color);
                          padding:.35rem .75rem; font-weight:600; font-size:.85rem; }
        .ed-policy-body { padding: .75rem; }
        .ed-policy-body > :last-child { margin-bottom: 0 !important; }

        #target-wrapper { position: relative; width: 100%; }
        #target, #target-placeholder {
            font-size: .9rem;
            font-family: inherit;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            box-sizing: border-box;
            padding: 8px 10px; /* 텍스트 시작 위치를 동일하게 */
        }
        #target {
            position: relative;
            z-index: 1;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: white;
            width: 100%;
            overflow: hidden;
            min-height: 38px; /* 기본 높이 - JS에서 조정 */
            height: auto;
        }
        #target-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            color: #aaa;
            font-style: italic;
            pointer-events: none;
            width: 100%;
        }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        let simulation;

        // target 입력 보조 (static/js/cts-target-aid.js)
        let targetAid;
        // 등록 현황 지도 (static/js/cts-reg-map.js)
        let regMap;

        /** 지도에 지금 편집 중인 target 을 알린다. 레지스터 폭이 타입에 걸려 있어 타입이 바뀔 때도 부른다. */
        function syncRegMap() {
            if (regMap) regMap.setCurrent($('#target').text());
        }

        function mountRegMap() {
            regMap = CtsRegMap.mount(document.getElementById('reg-map'), {
                device: device,
                selfId: simulation ? simulation.id : undefined,
                currentType: function () { return $('#policies-0-datatype').val(); },
            });
            syncRegMap();
        }

        function mountTargetAid() {
            targetAid = CtsTargetAid.mount(document.getElementById('target-aid'), {
                device: device,
                selfId: simulation ? simulation.id : undefined,
                statusEl: document.getElementById('target-status'),
                onChange: function (text) {
                    $('#target').text(text);
                    updatePlaceholderVisibility();
                    adjustHeight();
                    applyAllDataTypeOptions();
                    syncRegMap();
                },
                insertText: insertIntoTarget,
                policyIds: function () {
                    const ids = [];
                    const count = parseInt($('#policies-count').val()) || 0;
                    for (let i = 0; i < count; i++) ids.push($.trim($('#policies-' + i + '-id').val()));
                    return ids;
                },
            });
            targetAid.setValue($('#target').text());
            // 같은 장비의 다른 Simulation — 이미 쓰는 target 과 'Next free', 등록 현황 지도에 쓴다
            $.getJSON('/api/simulation/simulations/' + device.id).done(function (list) {
                targetAid.setSiblings(list);
                if (regMap) regMap.setSiblings(list);
            });
        }

        // target 칸의 마지막 커서 위치(글자 수). 칩을 누르면 포커스가 버튼으로 가므로 미리 기억해 둔다
        let targetCaret = null;
        document.addEventListener('selectionchange', function () {
            const el = document.getElementById('target');
            const sel = window.getSelection();
            if (!el || !sel.rangeCount || !el.contains(sel.focusNode)) return;
            const r = document.createRange();
            r.selectNodeContents(el);
            r.setEnd(sel.focusNode, sel.focusOffset);
            targetCaret = r.toString().length;
        });

        /** 마지막 커서 자리에 넣는다. target 칸을 건드린 적이 없으면 끝에 붙인다. */
        function insertIntoTarget(text) {
            const $t = $('#target');
            const cur = $t.text();
            const at = targetCaret == null || targetCaret > cur.length ? cur.length : targetCaret;
            $t.text(cur.slice(0, at) + text + cur.slice(at));
            $t.trigger('input');
            // focus 처리기가 커서를 맨 앞으로 보내므로 그 다음 차례에 넣은 글 뒤로 옮긴다
            const el = $t[0];
            el.focus();
            setTimeout(function () {
                const range = document.createRange();
                range.setStart(el.firstChild || el, el.firstChild ? at + text.length : 0);
                range.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }, 0);
        }

        // 정책별 분포 편집기 (static/js/dist-editor.js)
        let distEditors = {};

        function distEditor(pnum) {
            const el = document.getElementById('policy-' + pnum + '-dist-editor');
            if (!el) return null;
            if (!distEditors[pnum]) distEditors[pnum] = DistEditor.mount(el);
            return distEditors[pnum];
        }

        /**
         * 장비 프로토콜과 target 이 받는 data type 으로 목록을 다시 채운다(CtsDataTypes).
         * 고른 값이 새 목록에 있으면 그대로 두고, 없으면 첫 타입으로 바꾼다.
         */
        function applyDataTypeOptions(i) {
            const sel = '#policies-' + i + '-datatype';
            const $sel = $(sel);
            if ($sel.length === 0) return;
            const types = CtsDataTypes.typesFor(device && device.protocol, $('#target').text());
            const current = $sel.val();
            $sel.empty();
            types.forEach(function (t) { $sel.append($('<option>').val(t).text(t)); });

            // 화면은 조합 선택칸이 맡는다. 값은 숨은 select 에 넣고 change 를 울려
            // 기존 핸들러(onDataTypeChanged)가 그대로 돌게 한다
            const picker = dataTypePicker(i);
            picker.setTypes(types, current);
            const picked = picker.value();
            $sel.val(picked);
            lastDataType[i] = picked;
            applyBinaryConstraints(i);
        }

        function applyAllDataTypeOptions() {
            const count = parseInt($('#policies-count').val()) || 0;
            for (let i = 0; i < count; i++) applyDataTypeOptions(i);
        }

        // ── BINARY 제약 ─────────────────────────────────────────────
        // BINARY 는 0 과 1 만 담는다. STATIC 값, RANDOM 범위 양 끝, SEQUENCE 의 각 값이 0 또는 1 이어야 하고
        // ACCUMULATE 는 쓸 수 없다(서버 SimulationTargetValidator 와 같은 규칙).

        /**
         * 지금 고른 정책. jQuery .val() 은 disabled 된 선택지를 건너뛰고 undefined 를 준다 —
         * BINARY 라서 ACCUMULATE 를 막아 둔 상태가 바로 그 경우다. 네이티브 value 로 읽어야
         * '고를 수 없는 정책이 그대로 남아 있다' 는 사실이 저장 직전 검사까지 전달된다.
         */
        function policyOf(pnum) {
            const el = document.getElementById('policies-' + pnum + '-policy');
            return el ? el.value : '';
        }

        function isBinary(pnum) {
            return $('#policies-' + pnum + '-datatype').val() === 'BINARY';
        }

        /** 0 또는 1 인 입력값. 빈 칸은 아직 넣지 않은 것으로 보고 통과시킨다. */
        function isBitOrBlank(text) {
            const s = String(text == null ? '' : text).trim();
            return s === '' || Number(s) === 0 || Number(s) === 1;
        }

        /** 지금 정책의 값이 BINARY 에 맞지 않는 이유. 맞으면 null. */
        function binaryProblem(pnum) {
            const policy = policyOf(pnum);
            if (policy === 'ACCUMULATE') return 'ACCUMULATE cannot be used with BINARY.';
            if (policy === 'STATIC') {
                const v = $('#policies-' + pnum + '-value').val();
                if (!isBitOrBlank(v)) return 'Value ' + v + ' is not 0 or 1.';
            } else if (policy === 'SEQUENCE') {
                const bad = getSequence(pnum).filter(v => v !== 0 && v !== 1);
                if (bad.length) return 'Sequence has values other than 0 and 1 (' + bad.join(', ') + ').';
            } else if (policy === 'RANDOM') {
                const lo = $('#policy-' + pnum + '-range-min').val(), hi = $('#policy-' + pnum + '-range-max').val();
                if (!isBitOrBlank(lo) || !isBitOrBlank(hi)) return 'Range ' + lo + ' ~ ' + hi + ' is not within 0 and 1.';
            }
            return null;
        }

        /** 타입에 맞게 고를 수 있는 정책과 입력 안내를 맞춘다. */
        /**
         * BINARY 면 값 입력칸을 0·1 중에서 고르는 select 로 바꾼다. 아니면 다시 글자 칸으로 돌린다.
         * 같은 id 를 그대로 쓰므로 값을 읽고 쓰는 다른 코드는 손댈 것이 없다.
         *
         * @param placeholder 글자 칸일 때 쓸 안내 문구
         * @param blank       select 에 "고르지 않음"을 둘지. 시퀀스 추가 칸은 비워 둘 일이 없다
         */
        function setBitControl(id, binary, placeholder, blank) {
            const el = document.getElementById(id);
            if (!el) return;
            const isSelect = el.tagName === 'SELECT';
            if (binary === isSelect) {
                if (!binary) el.placeholder = placeholder;
                return;
            }
            const keep = isBitOrBlank(el.value) ? el.value : '';
            const next = document.createElement(binary ? 'select' : 'input');
            next.id = id;
            next.className = binary ? 'form-select' : 'form-control';
            if (binary) {
                next.innerHTML = (blank ? '<option value=""></option>' : '')
                    + '<option value="0">0</option><option value="1">1</option>';
                next.value = keep;
            } else {
                next.type = 'text';
                next.placeholder = placeholder;
                next.value = keep;
                // 숫자만 받는 필터는 인라인 핸들러로 걸려 있었다. 다시 만들 때도 같이 건다
                next.setAttribute('onbeforeinput', 'numeric_filter(this, event)');
            }
            // 원래 칸에 걸려 있던 동작을 옮긴다 (시퀀스 추가의 Enter 등)
            ['onkeydown', 'oninput'].forEach(function (k) {
                const v = el.getAttribute(k);
                if (v) next.setAttribute(k, v);
            });
            el.parentNode.replaceChild(next, el);
        }

        function applyBinaryConstraints(pnum) {
            const binary = isBinary(pnum);
            const policy = policyOf(pnum);
            $('#policies-' + pnum + '-policy option[value="ACCUMULATE"]').prop('disabled', binary);
            setBitControl('policies-' + pnum + '-value', binary, 'Simulation designated value', true);
            setBitControl('policy-' + pnum + '-seq-input', binary, 'Number to append', false);
            const $lo = $('#policy-' + pnum + '-range-min'), $hi = $('#policy-' + pnum + '-range-max');
            if (policy === 'RANDOM') {
                $lo.attr('placeholder', binary ? '0 or 1' : 'Minimum for simulation value');
                $hi.attr('placeholder', binary ? '0 or 1' : 'Maximum for simulation value');
            }
            // BINARY 의 RANDOM 은 0 과 1 두 구간에서 고른다. 범위는 0~1 로 고정한다.
            // 0·1 이 아닌 값이 남아 있으면(target 때문에 저절로 BINARY 가 된 경우) 고치지 않고 저장 때 막는다
            const fixed = binary && policy === 'RANDOM' && isBitOrBlank($lo.val()) && isBitOrBlank($hi.val());
            if (fixed) { $lo.val('0'); $hi.val('1'); }
            $lo.prop('readonly', fixed);
            $hi.prop('readonly', fixed);
            renderDistributionChart(pnum);
        }

        /**
         * BINARY 에서 정책을 바꾸면 새로 보이는 칸에 남아 있던 값을 0·1 에 맞춘다.
         * 숨어 있던 칸이라 타입을 바꿀 때 검사하지 않은 값이다.
         */
        function fitHiddenValuesToBinary(pnum, policy) {
            if (policy === 'STATIC') {
                const $v = $('#policies-' + pnum + '-value');
                if (!isBitOrBlank($v.val())) $v.val('');
            } else if (policy === 'RANDOM') {
                $('#policy-' + pnum + '-range-min').val('0');
                $('#policy-' + pnum + '-range-max').val('1');
            } else if (policy === 'SEQUENCE') {
                sequenceValues[pnum] = getSequence(pnum).filter(v => v === 0 || v === 1);
                renderSequenceList(pnum);
            }
        }

        /**
         * Datatype 을 사용자가 바꿨을 때. BINARY 로 바꾸려는데 지금 값이 0·1 이 아니면 알리고 되돌린다.
         * target 이 BINARY 하나만 받아 저절로 바뀐 경우(clickedIndex 가 null)는 되돌릴 곳이 없으므로
         * 저장할 때 막는다(doSubmit).
         */
        // 되돌릴 값. 사용자가 고르기 직전의 datatype 을 정책 번호별로 들고 있는다
        const lastDataType = {};

        // 정책 번호별 datatype 조합 선택칸
        const dataTypePickers = {};

        function dataTypePicker(i) {
            if (dataTypePickers[i]) return dataTypePickers[i];
            const host = document.getElementById('policies-' + i + '-dtp');
            dataTypePickers[i] = CtsDataTypePicker.mount(host, {
                onChange: function (code) {
                    const el = document.getElementById('policies-' + i + '-datatype');
                    if (!el || el.value === code) return;
                    el.value = code;
                    // 숨은 select 라 사용자가 직접 바꿀 수 없다. 고른 것으로 쳐서 알린다
                    el.dispatchEvent(new Event('change', { bubbles: true }));
                },
            });
            return dataTypePickers[i];
        }

        function onDataTypeChanged(pnum, clickedIndex, previous) {
            if (clickedIndex !== null && clickedIndex !== undefined && isBinary(pnum)) {
                const problem = binaryProblem(pnum);
                if (problem) {
                    alert('Cannot change to BINARY. ' + problem + ' BINARY takes 0 or 1 only.');
                    $('#policies-' + pnum + '-datatype').val(previous);
                    lastDataType[pnum] = previous;
                    dataTypePicker(pnum).setTypes(
                        CtsDataTypes.typesFor(device && device.protocol, $('#target').text()), previous);
                }
            }
            applyBinaryConstraints(pnum);
            // MODBUS 레지스터는 타입 폭만큼 자리를 먹는다 — 지도의 칸 수가 달라진다
            if (String(pnum) === '0') syncRegMap();
        }

        const targetExample = {
            'GENERIC': 'A target of the protocol definition<br><i>e.g. <b>전압1</b></i>',
            'MODBUS': '{function_code}_{register|coil}<br><i>e.g. <b>3_100</b></i>',
            'XGT_PLC': '{block_code}{length}{register}<br><i>e.g. <b>%MW1000</b></i>',
            'DAEYUN_RCU': '@RCUDI_{channel}, @RCUAI_{channel} or a target of the protocol definition<br><i>e.g. <b>@RCUDI_2</b></i>',
            'SNMP': '{oid}<br><i>e.g. <b>.1.3.6.1.4.1.27732.1.1.0.1.1</b></i>',
            'BACNET': '{type} {instance_number}<br><i>e.g. <b>analog_input 10</b></i>',
            'OPC_AGENT': '{taglist_index}<br><i>e.g. <b>30</b></i>',
            'DB': 'SQL with ${policy ID} placeholders<br><i>e.g. <b>UPDATE ubms_voltage_curr SET voltage1=${v1},voltage2=${v2} WHERE uid=1</b></i>',
            'ETHERNET_IP': '{tag}[{element}] — the CIP type follows the data type<br><i>e.g. <b>sys_runtime_acc[0]</b></i>',
        };

        document.addEventListener('DOMContentLoaded', function () {
            device = [[${device}]];
            simulation = [[${simulation}]] == null ? undefined : [[${simulation}]];

            let $target = $('#target');
            let $placeholder = $('#target-placeholder');
            // 타입 목록이 target 을 보므로 target 을 먼저 채운다
            if (simulation) $target.html(simulation.target);

            // 정책 칸은 모두 addPolicy 가 만든다 (0번도 예외가 아니다)
            const policyCount = simulation ? simulation.policies.length : 1;
            for (let i = 0; i < policyCount; i++) addPolicy();

            if (simulation) {
                $('#name').val(simulation.name);
                $('#enabled').val(simulation.enabled);
                $('#interval').val(simulation.interval)
                $('#stopOnControl').val(simulation.stopOnControl != null ? simulation.stopOnControl : 0);
                for (let i = 0; i < simulation.policies.length; i++) {
                    $('#policies-'+i+'-id').val(simulation.policies[i].id);

                    let $policy = $('#policies-'+i+'-policy');
                    $policy.val(simulation.policies[i].policy);
                    $policy.change()

                    $('#policies-'+i+'-datatype').val(simulation.policies[i].data_type);
                    dataTypePicker(i).setTypes(
                            CtsDataTypes.typesFor(device && device.protocol, $('#target').text()),
                            simulation.policies[i].data_type);
                    if(simulation.policies[i].policy === 'STATIC') {
                        $('#policies-'+i+'-value').val(simulation.policies[i].value)
                    } else if (simulation.policies[i].policy === 'SEQUENCE') {
                        // value 가 숫자 배열이다
                        let saved = simulation.policies[i].value;
                        sequenceValues[i] = Array.isArray(saved) ? saved.map(Number) : [];
                        renderSequenceList(i);
                    } else {
                        $('#policy-'+i+'-range-min').val(simulation.policies[i].range[0]);
                        $('#policy-'+i+'-range-max').val(simulation.policies[i].range[1]);

                        let dist = simulation.policies[i].distribution;
                        if (simulation.policies[i].policy === 'RANDOM' && dist
                                && dist.type === 'BINS' && dist.binCount && dist.weights) {
                            $('#policy-'+i+'-dist-enabled').prop('checked', true);
                            $('#policies-'+i+'-distribution-body').show();
                            distEditor(i).setState(dist);
                            renderDistributionChart(i);
                        }
                    }
                }
            }

            $('#policy-tools').toggle(allowsManyPolicies());
            $placeholder.html(targetExample[device.protocol])
            updatePlaceholderVisibility();
            adjustHeight();
            // target 입력칸이 먼저다. 등록 현황은 곁다리라 거기서 탈이 나도 입력은 살아 있어야 한다
            mountTargetAid();
            mountRegMap();
            // 정책 종류를 바꾸거나 분포 편집기를 펴면 카드 높이가 변한다. 한 군데서 다 받는다
            fitPolicies();
            if (window.ResizeObserver) new ResizeObserver(fitPolicies).observe($('#policies').get(0));
            $(window).on('resize', fitPolicies);
            // input 감지
            $target.on('input', function () {
                updatePlaceholderVisibility();
                adjustHeight();
                applyAllDataTypeOptions();
                targetAid.setValue($target.text());
                syncRegMap();
            });

            // 정책은 나중에 추가되므로 위임으로 건다.
            // 기본 select 라 네이티브 change 를 듣는다. 코드가 .val() 로 넣는 값은 change 를
            // 울리지 않으므로, 여기 오는 건 사용자가 고른 것뿐이다
            $(document).on('change', 'select[id^="policies-"][id$="-datatype"]', function () {
                const pnum = this.id.split('-')[1];
                const previous = lastDataType[pnum];
                lastDataType[pnum] = this.value;
                onDataTypeChanged(pnum, 1, previous);
            });

            // DB 는 target 의 ${자리}가 정책 ID 를 가리킨다. 한 화면이라 고치는 즉시 보조 표시를 맞춘다
            if (device.protocol === 'DB') {
                $(document).on('input', 'input[id^="policies-"][id$="-id"]', function () {
                    if (targetAid) targetAid.refresh();
                });
            }

            // 클릭하면 커서를 맨 앞에
            $target.on('focus', function () {
                setTimeout(() => {
                    const el = $target.get(0);
                    if (el.childNodes.length === 0) {
                        el.innerHTML = '';
                        el.appendChild(document.createTextNode(''));
                    }
                    setCaretToStart(el);
                }, 0);
            });

            // 클릭이나 포커스 외에도 텍스트 삭제 시에도 감지
            $target.on('keyup', function () {
                updatePlaceholderVisibility();
            });

            $('#pageTitle').text(simulation ? 'Edit simulation' : 'Add simulation');
            $('#pageSubtitle').text(device.name + ' · ' + device.protocol);
        });

        function updatePlaceholderVisibility() {
            let $target = $('#target');
            let $placeholder = $('#target-placeholder');

            if ($.trim($target.text()) === '') {
                $placeholder.show();
            } else {
                $placeholder.hide();
            }
        }

        function setCaretToStart(el) {
            const range = document.createRange();
            const sel = window.getSelection();
            range.setStart(el, 0);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function adjustHeight() {
            const $target = $('#target');
            const $placeholder = $('#target-placeholder');

            // placeholder 높이 측정
            const phHeight = $placeholder[0].scrollHeight;

            // placeholder보다 최소 높이를 확보 (여유 padding 포함)
            $target.css('min-height', (phHeight + 2) + 'px');

            // 실제 내용 기반 자동 높이 조정
            $target[0].style.height = 'auto';
            $target[0].style.height = $target[0].scrollHeight + 'px';
        }

        function cancelEdit() {
            location.href = '/simulations?device=' + device.id;
        }

        /** 알리고 그 칸으로 데려간다. 단계가 없으니 첫 문제에서 멈춘다. */
        function complain(message, selector) {
            alert(message);
            const el = $(selector).get(0);
            if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
            return false;
        }

        /** 예전 1·2단계의 Next 가 막던 검사. 저장할 때 한 번에 한다. */
        function validateHeader() {
            if ($('#name').val() === '') return complain('Name cannot be empty.', '#name');
            const interval = $('#interval').val();
            if (interval === '' || isNaN(interval) || interval === '0') {
                return complain('Simulation interval must be a natural number.', '#interval');
            }
            if ($('#target').html().trim() === '') return complain('Target cannot be empty.', '#target');
            return true;
        }

        function doSubmit() {
            if (!validateHeader()) return;

            let policies_count = $('#policies-count').val();
            let policies = [];
            for (let i = 0; i < policies_count; i++) {
                let p = {};
                p.id = $('#policies-' + i + '-id').val();
                if(p.id === '') {
                    return complain('ID of policy ' + i + ' is empty.', '#policies-' + i + '-id');
                }
                p.policy = policyOf(i);
                p.data_type = $('#policies-' + i + '-datatype').val();
                // target 이 BINARY 만 받아 타입이 저절로 바뀐 경우, 그 전에 넣은 값이 남아 있을 수 있다
                if (p.data_type === 'BINARY') {
                    const problem = binaryProblem(i);
                    if (problem) {
                        return complain('Policy ' + i + ' is BINARY. ' + problem + ' BINARY takes 0 or 1 only.',
                                '#policies-' + i + '-id');
                    }
                }
                if (p.policy === 'STATIC') {
                    p.value = $('#policies-'+i+'-value').val();
                    if(p.value === '') {
                        return complain('Value of policy ' + i + ' is empty.', '#policies-' + i + '-value');
                    }
                    // 숫자로 보낸다. 문자열이면 서버가 숫자 값으로 읽지 못한다(SimulationPolicy.numericValue)
                    p.value = Number(p.value);
                    p.range = null;
                } else if (p.policy === 'SEQUENCE') {
                    // value 에 숫자 배열을 그대로 담는다 (서버가 JSON number array 로 저장)
                    let seq = getSequence(i);
                    if (seq.length === 0) {
                        return complain('Sequence of policy ' + i + ' is empty. Add at least one value.',
                                '#policy-' + i + '-seq-input');
                    }
                    p.value = seq.slice();
                    p.range = null;
                } else {
                    p.range = [];
                    p.range.push($('#policy-'+i+'-range-min').val());
                    p.range.push($('#policy-'+i+'-range-max').val());
                    if(p.range[0] === '' || p.range[1] === ''){
                        return complain('Range of policy ' + i + ' is empty.', '#policy-' + i + '-range-min');
                    }
                    p.range = p.range.map(Number);
                    if (p.policy === 'RANDOM' && $('#policy-'+i+'-dist-enabled').is(':checked')) {
                        renderDistributionChart(i);
                        const ed = distEditor(i);
                        const distError = ed.validate();
                        if (distError) {
                            alert('Distribution of policy ' + i + ': ' + distError);
                            return;
                        }
                        p.distribution = ed.getDistribution();
                    } else {
                        p.distribution = null;
                    }
                }
                policies.push(p);
            }

            let sim = {};
            sim.target = $('#target').html().trim();
            sim.policies = policies;
            sim.interval = $('#interval').val();
            sim.enabled = $('#enabled').val();
            sim.device = device;
            sim.name = $('#name').val();
            sim.stopOnControl = parseInt($('#stopOnControl').val()) || 0;

            if(simulation) {
                sim.id = simulation.id;
            }

            // DB 는 정책 값이 ${정책 ID} 자리에 들어간다. 서버는 보지 않으므로 어긋나면 여기서 묻는다
            if (device.protocol === 'DB') {
                const problems = targetAid.problems();
                if (problems.length && !confirm(problems.map(p => p.text).join('\n') + '\n\nSave anyway?')) return;
            }

            // 저장은 페이지를 떠나므로, 서버가 거절하면 입력이 사라진다. 같은 검증을 먼저 받아 여기서 알린다
            $.ajax({
                url: '/api/simulation/validate',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(sim)
            }).done(function (resp) {
                if (resp && resp.error) {
                    alert(resp.error);
                    return;
                }
                submitSimulation(sim);
            }).fail(function () {
                // 저장 경로가 같은 검증을 다시 한다
                submitSimulation(sim);
            });
        }

        function submitSimulation(sim) {
            let form = $('<form>', {
                'action': '/saveSimulation',
                'method': 'post'
            });
            let hiddenInput = $('<input>', {
                'type': 'hidden',
                'name': 'simulationJson',
                'value': JSON.stringify(sim)
            });
            form.append(hiddenInput);
            $('body').append(form);
            form.submit();
        }

        function numeric_filter(input, e) {
            // BINARY 정책의 칸(값, 범위, 시퀀스 추가)은 0 또는 1 하나만 받는다. 붙여넣기도 막는다
            const owner = /^polic(?:y|ies)-(\d+)-/.exec(input.id);
            if (owner && isBinary(owner[1])) {
                if (!e.inputType || e.inputType.indexOf('insert') !== 0) return;
                const data = e.data != null ? e.data
                    : (e.dataTransfer ? e.dataTransfer.getData('text') : '');
                const next = input.value.slice(0, input.selectionStart) + data + input.value.slice(input.selectionEnd);
                if (!/^[01]?$/.test(next)) e.preventDefault();
                return;
            }
            // 입력 타입이 텍스트가 아니면 무시
            if (e.inputType !== "insertText") return;

            const char = e.data;
            const { selectionStart, selectionEnd, value } = input;

            // 입력 후 결과 예측값
            const nextValue =
                value.slice(0, selectionStart) + char + value.slice(selectionEnd);

            // 조건:
            // 1. 숫자/마침표/하이픈만 포함
            // 2. 하이픈은 0~1회만, 맨 앞에만
            // 3. 마침표는 0~1회만
            const dashCount = (nextValue.match(/-/g) || []).length;
            const dotCount = (nextValue.match(/\./g) || []).length;

            const isValid =
                /^-?\d*(\.\d*)?$/.test(nextValue) &&
                dashCount <= 1 &&
                (nextValue.indexOf('-') <= 0) &&
                dotCount <= 1;

            if (!isValid) {
                e.preventDefault(); // 입력 차단
            }
        }

        /** SEQUENCE 정책의 숫자 배열. key = policy index */
        let sequenceValues = {};

        function changePolicy(el) {
            let pnum = el.id.split("-")[1];
            let val = el.value;

            let value = $('#policies-' + pnum + '-value-wrapper')
            let range = $('#policies-' + pnum + '-range-wrapper');
            let distribution = $('#policies-' + pnum + '-distribution-wrapper');
            let sequence = $('#policies-' + pnum + '-sequence-wrapper');

            if(val === 'STATIC'){
                value.show();
                range.hide();
                distribution.hide();
                sequence.hide();
            } else if (val === 'SEQUENCE') {
                value.hide();
                range.hide();
                distribution.hide();
                sequence.show();
                renderSequenceList(pnum);
            } else {
                value.hide();
                range.show();
                sequence.hide();

                let range_min = $('#policy-'+pnum+'-range-min');
                let range_max = $('#policy-'+pnum+'-range-max');
                if(val === 'RANDOM'){
                    range_min.prop('placeholder', 'Minimum for simulation value');
                    range_max.prop('placeholder', 'Maximum for simulation value');
                    distribution.show();
                }
                if(val === 'ACCUMULATE') {
                    range_min.prop('placeholder', 'Initial simulation value');
                    range_max.prop('placeholder', 'Accumulate per interval');
                    distribution.hide();
                }
            }
            if (isBinary(pnum)) fitHiddenValuesToBinary(pnum, val);
            applyBinaryConstraints(pnum);
        }

        function getSequence(pnum) {
            if (!Array.isArray(sequenceValues[pnum])) sequenceValues[pnum] = [];
            return sequenceValues[pnum];
        }

        /** 입력칸의 숫자를 배열 끝에 추가한다. */
        function addSequenceValue(pnum) {
            let $input = $('#policy-' + pnum + '-seq-input');
            let raw = $input.val();
            if (raw === null || String(raw).trim() === '' || !Number.isFinite(Number(raw))) {
                alert('Enter a number to add.');
                return;
            }
            if (isBinary(pnum) && Number(raw) !== 0 && Number(raw) !== 1) {
                alert('BINARY takes 0 or 1 only.');
                return;
            }
            getSequence(pnum).push(Number(raw));
            $input.val('').trigger('focus');
            renderSequenceList(pnum);
        }

        function removeSequenceValue(pnum, index) {
            getSequence(pnum).splice(index, 1);
            renderSequenceList(pnum);
        }

        function moveSequenceValue(pnum, index, delta) {
            let arr = getSequence(pnum);
            let to = index + delta;
            if (to < 0 || to >= arr.length) return;
            let tmp = arr[index]; arr[index] = arr[to]; arr[to] = tmp;
            renderSequenceList(pnum);
        }

        function clearSequenceValues(pnum) {
            if (getSequence(pnum).length === 0) return;
            if (!confirm('Remove all sequence values?')) return;
            sequenceValues[pnum] = [];
            renderSequenceList(pnum);
        }

        function renderSequenceList(pnum) {
            let arr = getSequence(pnum);
            let $list = $('#policy-' + pnum + '-seq-list');
            if ($list.length === 0) return;
            if (arr.length === 0) {
                $list.html('<div class="text-muted" style="font-size:.85rem;">No values yet. Add at least one.</div>');
                return;
            }
            let rows = arr.map(function (v, i) {
                return '<span class="badge badge-light border mr-1 mb-1" style="font-size:.85rem; padding:6px 8px;">'
                    + '<span class="text-muted mr-1">' + (i + 1) + '.</span>'
                    + '<b>' + v + '</b>'
                    + '<button type="button" class="btn btn-link btn-sm p-0 ms-2" title="Move left"'
                    + ' onclick="moveSequenceValue(' + pnum + ',' + i + ',-1)">&#8592;</button>'
                    + '<button type="button" class="btn btn-link btn-sm p-0 ms-1" title="Move right"'
                    + ' onclick="moveSequenceValue(' + pnum + ',' + i + ',1)">&#8594;</button>'
                    + '<button type="button" class="btn btn-link btn-sm p-0 ms-1 text-danger" title="Remove"'
                    + ' onclick="removeSequenceValue(' + pnum + ',' + i + ')">&times;</button>'
                    + '</span>';
            }).join('');
            $list.html(rows
                + '<div class="mt-1">'
                + '<span class="text-muted" style="font-size:.8rem;">' + arr.length + ' value(s)</span>'
                + '<button type="button" class="btn btn-outline-danger btn-sm ms-2 py-0"'
                + ' onclick="clearSequenceValues(' + pnum + ')">Clear all</button>'
                + '</div>');
        }

        function toggleDistribution(pnum) {
            let enabled = $('#policy-'+pnum+'-dist-enabled').is(':checked');
            $('#policies-'+pnum+'-distribution-body').toggle(enabled);
            if (enabled) renderDistributionChart(pnum);
        }

        /** Range 와 BINARY 여부를 분포 편집기에 알린다. Range 입력칸의 oninput 이 부른다. */
        function renderDistributionChart(pnum) {
            if (!$('#policy-'+pnum+'-dist-enabled').is(':checked')) return;
            const ed = distEditor(pnum);
            if (!ed) return;
            ed.setRange(parseFloat($('#policy-'+pnum+'-range-min').val()), parseFloat($('#policy-'+pnum+'-range-max').val()));
            ed.setBinary(isBinary(pnum));
        }

        // 세로로 쌓이는 화면에서는 정책 칸이 카드 수만큼 한없이 길어져 페이지가 스크롤된다.
        // 카드 두 장까지만 늘어나게 잡고 그 뒤로는 칸 안에서 스크롤한다.
        const POLICY_FIT = 2;

        function fitPolicies() {
            const body = document.querySelector('.ed-policies > .card-body');
            const list = document.getElementById('policies');
            if (!body || !list) return;

            // 좌우로 나뉜 화면에서는 칸이 이미 남는 높이를 다 쓴다. 건드릴 일이 없다
            const cards = list.children;
            if (window.matchMedia('(min-width: 1100px)').matches || cards.length <= POLICY_FIT) {
                body.style.maxHeight = '';
                return;
            }

            const cs = getComputedStyle(body);
            const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
            let h = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
            for (let i = 0; i < POLICY_FIT; i++) h += cards[i].offsetHeight;
            // 간격을 하나 더 둬서 다음 카드의 윗단이 살짝 걸쳐 보이게 한다 — 더 있다는 표시다
            h += gap * POLICY_FIT;

            const want = Math.round(h);
            if (!(Math.abs(parseFloat(body.style.maxHeight) - want) <= 2)) {
                body.style.maxHeight = want + 'px';
            }
        }

        /**
         * 정책을 여럿 둘 수 있는 건 DB 장비뿐이다. DB 의 target 은 ${정책 ID} 자리를 가진 SQL 이라
         * 정책 하나가 자리 하나를 채운다. 다른 프로토콜은 target 하나에 값 하나를 쓰므로
         * 정책을 더 달아 봐야 같은 자리를 번갈아 덮어쓸 뿐이다
         * (서버도 같은 규칙을 본다 — SimulationTargetValidator).
         */
        function allowsManyPolicies() {
            return device && device.protocol === 'DB';
        }

        // scrollTo 는 버튼으로 눌렀을 때만 true 다. 저장된 것을 불러오는 루프에서는 막지 않는다 —
        // 예전에 들어간 자료가 있어도 열리기는 해야 하고, 저장할 때 서버가 막는다
        function addPolicy(scrollTo) {
            let pnum_input = $('#policies-count');
            let pnum = parseInt(pnum_input.val());
            if (scrollTo && pnum > 0 && !allowsManyPolicies()) {
                alert('Only a DB device can have more than one policy.');
                return;
            }

            // 이름표와 입력칸을 한 장의 카드로 묶는다. 그래야 카드 단위로 지울 수 있다
            let policy_card_html =
                '<div class="ed-policy" id="policies-'+pnum+'-card">\n' +
                '    <div class="ed-policy-head" id="policies-'+pnum+'-label">Policy-'+pnum+'</div>\n' +
                '    <div class="ed-policy-body" id="policies-'+pnum+'">\n' +
                '        <div class="row g-2 mb-3">\n' +
                '            <div class="col-6">\n' +
                '                <label class="form-label" for="policies-'+pnum+'-id">ID</label>\n' +
                '                <input type="text" class="form-control"\n' +
                '                       id="policies-'+pnum+'-id" placeholder="Policy ID">\n' +
                '            </div>\n' +
                '            <div class="col-6">\n' +
                '                <label class="form-label" for="policies-'+pnum+'-policy">Policy</label>\n' +
                '                <select class="form-select"\n' +
                '                        id="policies-'+pnum+'-policy" onchange="changePolicy(this)">\n' +
                '                    <option value="STATIC" selected>STATIC</option>\n' +
                '                    <option value="RANDOM">RANDOM</option>\n' +
                '                    <option value="ACCUMULATE">ACCUMULATE</option>\n' +
                '                    <option value="SEQUENCE">SEQUENCE</option>\n' +
                '                </select>\n' +
                '            </div>\n' +
                '            <div class="col-12">\n' +
                '                <label class="form-label">Datatype</label>\n' +
                '                <div id="policies-'+pnum+'-dtp"></div>\n' +
                // 값은 여기 담긴다. 나머지 코드는 예전처럼 이 select 만 보면 된다
                '                <select id="policies-'+pnum+'-datatype" class="d-none"></select>\n' +
                '            </div>\n' +
                '        </div>\n' +
                '        <div class="mb-3" id="policies-'+pnum+'-value-wrapper">\n' +
                '            <label class="form-label" for="policies-'+pnum+'-value">Value</label>\n' +
                '            <input type="text" class="form-control"\n' +
                '                   id="policies-'+pnum+'-value" placeholder="Simulation designated value" onbeforeinput="numeric_filter(this, event)">\n' +
                '        </div>\n' +
                '        <div class="mb-3" id="policies-'+pnum+'-range-wrapper" style="display: none">\n' +
                '            <label class="form-label" for="policies-'+pnum+'-range">Range</label>\n' +
                '            <div class="row g-2" id="policies-'+pnum+'-range">\n' +
                '                <div class="col-md-6">\n' +
                '                    <input type="text" class="form-control" id="policy-'+pnum+'-range-min" placeholder="Minimum for simulation value" onbeforeinput="numeric_filter(this, event)" oninput="renderDistributionChart('+pnum+')">\n' +
                '                </div>\n' +
                '                <div class="col-md-6">\n' +
                '                    <input type="text" class="form-control" id="policy-'+pnum+'-range-max" placeholder="Maximum for simulation value" onbeforeinput="numeric_filter(this, event)" oninput="renderDistributionChart('+pnum+')">\n' +
                '                </div>\n' +
                '            </div>\n' +
                '        </div>\n' +
                '        <div class="mb-3" id="policies-'+pnum+'-sequence-wrapper" style="display: none">\n' +
                '            <label class="form-label" for="policy-'+pnum+'-seq-input">Sequence values</label>\n' +
                '            <div class="input-group">\n' +
                '                <input type="text" class="form-control" id="policy-'+pnum+'-seq-input" placeholder="Number to append" onbeforeinput="numeric_filter(this, event)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addSequenceValue('+pnum+');}">\n' +
                '                <button class="btn btn-outline-secondary" type="button" onclick="addSequenceValue('+pnum+')"><i class="fas fa-plus"></i> Add</button>\n' +
                '            </div>\n' +
                '            <small class="form-hint">Applied in order, one value per interval, then wraps to the first.</small>\n' +
                '            <div id="policy-'+pnum+'-seq-list" class="mt-2"></div>\n' +
                '        </div>\n' +
                '        <div class="mb-3" id="policies-'+pnum+'-distribution-wrapper" style="display: none">\n' +
                '            <label class="form-check form-switch mb-2">\n' +
                '                <input type="checkbox" class="form-check-input" id="policy-'+pnum+'-dist-enabled" onchange="toggleDistribution('+pnum+')">\n' +
                '                <span class="form-check-label">Use weighted distribution</span>\n' +
                '            </label>\n' +
                '            <div id="policies-'+pnum+'-distribution-body" style="display: none">\n' +
                '                <div id="policy-'+pnum+'-dist-editor"></div>\n' +
                '            </div>\n' +
                '        </div>\n' +
                '    </div>\n' +
                '</div>'

            $('#policies').append(policy_card_html);

            applyDataTypeOptions(pnum);

            pnum_input.val(pnum+1);
            fitPolicies();
            // 카드가 쌓여 스크롤이 생기면 새로 넣은 게 화면 밖이다. 불러올 때는 맨 위에 둔다
            if (scrollTo) {
                const card = document.getElementById('policies-'+pnum+'-card');
                if (card) card.scrollIntoView({ block: 'nearest' });
            }
        }

        function removePolicy() {
            let pnum_input = $('#policies-count');
            let pnum = parseInt(pnum_input.val()) - 1;

            if(pnum > 0) {
                if (distEditors[pnum]) {
                    distEditors[pnum].destroy();
                    delete distEditors[pnum];
                }
                delete sequenceValues[pnum];
                $('#policies-' + pnum + '-card').remove();
                pnum_input.val(pnum);
                fitPolicies();
            } else {
                alert('There must be at least one policy.')
            }
        }
        /*]]>*/
    </script>
</head>
<body>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('simulations')}"></th:block>
    <th:block th:replace="~{fragments/tabler :: navbar('', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list">
            <button type="button" class="btn btn-outline-secondary" onclick="cancelEdit()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="doSubmit()">Save</button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <form class="container-fluid ed-body" onsubmit="return false">
                <div class="ed-left">
                    <div class="card cts-card ed-head">
                        <div class="card-body">
                            <div class="row g-2">
                                <div class="col-12">
                                    <label class="form-label" for="name">Name</label>
                                    <input type="text" class="form-control" id="name"
                                           placeholder="Displayed name for simulation">
                                </div>
                                <div class="col-6">
                                    <label class="form-label" for="enabled">Initial state</label>
                                    <select class="form-select" id="enabled">
                                        <option value="1">Enabled</option>
                                        <option value="0">Disabled</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label" for="interval">Interval</label>
                                    <input type="text" class="form-control" id="interval" placeholder="Seconds"
                                           onbeforeinput="numeric_filter(this, event)">
                                    <small class="form-hint">Seconds between executions (1–3600).</small>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="stopOnControl">Stop on control</label>
                                    <input type="number" class="form-control" id="stopOnControl" value="0">
                                    <small class="form-hint">
                                        Seconds to pause after a client write.
                                        0 never pauses, -1 disables the simulation.
                                    </small>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="target">Target</label>
                                    <div id="target-aid"></div>
                                    <div id="target-wrapper">
                                        <div id="target-placeholder"></div>
                                        <div id="target" contenteditable="true" class="form-control"></div>
                                    </div>
                                    <div id="target-status" class="ta-status"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card cts-card ed-policies">
                        <div class="card-header">
                            <h3 class="card-title">Policies</h3>
                            <input type="hidden" id="policies-count" value="0">
                            <!-- 정책을 여럿 두는 건 DB 뿐이다. 아닌 장비에서는 숨긴다 -->
                            <div class="card-actions" id="policy-tools" style="display:none">
                                <button type="button" class="btn btn-icon btn-outline-danger btn-sm"
                                        onclick="removePolicy()" title="Remove the last policy">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <button type="button" class="btn btn-icon btn-outline-success btn-sm"
                                        onclick="addPolicy(true)" title="Add a policy">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="policies"></div>
                        </div>
                    </div>
                </div>

                <div class="card cts-card">
                    <div class="card-header">
                        <h3 class="card-title">Registered targets</h3>
                    </div>
                    <div class="card-body">
                        <div id="reg-map"></div>
                    </div>
                </div>
            </form>
        </div>
        <!-- /.page-body -->
    </div>
    <!-- /.page-wrapper -->
</div>
<!-- /.page -->

<th:block th:replace="~{fragments/tabler :: scripts}"></th:block>
<script src="/js/cts-datatypes.js"></script>
<script src="/js/cts-datatype-picker.js"></script>
<script src="/js/dist-editor.js"></script>
<script src="/js/cts-target-aid.js"></script>
<script src="/js/cts-reg-map.js"></script>
<script src="/plugins/chart.js/Chart.min.js"></script>
</body>
</html>
