<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="../../css/adminlte.min.css">
    <!-- JSON Editor -->
    <link href="../../plugins/jsoneditor/css/jsoneditor.min.css" rel="stylesheet">
    <!-- BS Stepper -->
    <link rel="stylesheet" href="../../plugins/bs-stepper/css/bs-stepper.min.css">
    <link rel="stylesheet" href="../../css/bootstrap-select.min.css">

    <style>
        #target-wrapper {
            position: relative;
            width: 100%;
        }

        #target, #target-placeholder {
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            box-sizing: border-box;
            padding: 12px; /* 텍스트 시작 위치를 동일하게 */
        }

        #target {
            position: relative;
            z-index: 1;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: white;
            width: 100%;
            overflow: hidden;
            min-height: 48px; /* 기본 높이 - JS에서 조정 */
        }

        #target-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            color: #aaa;
            font-style: italic;
            pointer-events: none;
            width: 100%;
        }

        .form-group.rounded-outline {
            border: 1px solid #ccc;        /* 더 얇은 테두리 */
            border-radius: 0.5rem;         /* 더 둥글게 */
            box-shadow: none;              /* 기본 포커스 그림자 제거 */
            padding: 0.375rem 0.75rem;
        }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        let simulation;

        let simulationsNames = [];

        const targetExample = {
            'GENERIC': 'TXField.field_id in PGD<br><i>e.g. <b>register1</b></i>',
            'MODBUS': '{function_code}_{register|coil}<br><i>e.g. <b>3_100</b></i>',
            'XGT_PLC': '{block_code}{length}{register}<br><i>e.g. <b>%MW1000</b></i>',
            'DAEYUN_RCU': '@RCUDI_{channel},@RCUAI_{channel},TXField.field_id in PGD<br><i>e.g. <b>@RCUDI_2</b></i>',
            'SNMP': '{oid}<br><i>e.g. <b>.1.3.6.1.4.1.27732.1.1.0.1.1</b></i>',
            'BACNET': '{type} {instance_number}<br><i>e.g. <b>analog_input 10</b></i>',
            'OPC_AGENT': '{taglist_index}<br><i>e.g. <b>30</b></i>',
            'DB': '{query with id in policy}<br><i>e.g. <b>UPDATE ubms_voltage_curr SET voltage1={v1},voltage2={v2} WHERE uid={id}</b></i>',
            'ETHERNET_IP': '{type}@{tag}[{element}]<br><i>e.g. <b>DINT@sys_runtime_acc[0]</b></i>',
        };

        document.addEventListener('DOMContentLoaded', function () {
            let stepperEl = document.getElementById('stepper');
            window.stepper = new Stepper(stepperEl)

            stepperEl.addEventListener('shown.bs-stepper', function (event) {
                if (event.detail.indexStep === 1) {
                    adjustHeight();
                }
            })

            device = [[${device}]];
            simulation = [[${simulation}]] == null ? undefined : [[${simulation}]];

            let $target = $('#target');
            let $placeholder = $('#target-placeholder');

            if (simulation) {
                $('#name').val(simulation.name);
                $('#enabled').val(simulation.enabled);
                $target.html(simulation.target)
                $('#interval').val(simulation.interval)
                $('#stopOnControl').val(simulation.stopOnControl ? 1 : 0);
                for (let i = 0; i < simulation.policies.length; i++) {
                    $('#policies-'+i+'-id').val(simulation.policies[i].id);

                    let $policy = $('#policies-'+i+'-policy');
                    $policy.val(simulation.policies[i].policy);
                    $policy.change()

                    $('#policies-'+i+'-datatype').selectpicker('val', simulation.policies[i].data_type);
                    if(simulation.policies[i].policy === 'STATIC') {
                        $('#policies-'+i+'-value').val(simulation.policies[i].value)
                    } else {
                        $('#policy-'+i+'-range-min').val(simulation.policies[i].range[0]);
                        $('#policy-'+i+'-range-max').val(simulation.policies[i].range[1]);
                    }

                    if(i < simulation.policies.length - 1) {
                        addPolicy()
                    }
                }
            }

            $placeholder.html(targetExample[device.protocol])
            updatePlaceholderVisibility();
            adjustHeight();
            // input 감지
            $target.on('input', function () {
                updatePlaceholderVisibility();
                adjustHeight();
            });

            // 클릭하면 커서를 맨 앞에
            $target.on('focus', function () {
                setTimeout(() => {
                    const el = $target.get(0);
                    if (el.childNodes.length === 0) {
                        el.innerHTML = '';
                        el.appendChild(document.createTextNode(''));
                    }
                    setCaretToStart(el);
                }, 0);
            });

            // 클릭이나 포커스 외에도 텍스트 삭제 시에도 감지
            $target.on('keyup', function () {
                updatePlaceholderVisibility();
            });

            $('#menuText').text(simulation ? 'Edit simulation' : 'Add simulation')
        });

        function updatePlaceholderVisibility() {
            let $target = $('#target');
            let $placeholder = $('#target-placeholder');

            if ($.trim($target.text()) === '') {
                $placeholder.show();
            } else {
                $placeholder.hide();
            }
        }

        function setCaretToStart(el) {
            const range = document.createRange();
            const sel = window.getSelection();
            range.setStart(el, 0);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function adjustHeight() {
            const $target = $('#target');
            const $placeholder = $('#target-placeholder');

            // placeholder 높이 측정
            const phHeight = $placeholder[0].scrollHeight;

            // placeholder보다 최소 높이를 확보 (여유 padding 포함)
            $target.css('min-height', (phHeight + 2) + 'px');

            // 실제 내용 기반 자동 높이 조정
            $target[0].style.height = 'auto';
            $target[0].style.height = $target[0].scrollHeight + 'px';
        }

        function doSubmit() {
            let policies_count = $('#policies-count').val();
            let policies = [];
            for (let i = 0; i < policies_count; i++) {
                let p = {};
                p.id = $('#policies-' + i + '-id').val();
                if(p.id === '') {
                    alert('ID of policy ' + i + ' is empty.')
                    return;
                }
                p.policy = $('#policies-' + i + '-policy').val();
                p.data_type = $('#policies-' + i + '-datatype').val();
                if (p.policy === 'STATIC') {
                    p.value = $('#policies-'+i+'-value').val();
                    if(p.value === '') {
                        alert('Value of policy ' + i + ' is empty.')
                        return;
                    }
                    p.range = null;
                } else {
                    p.range = [];
                    p.range.push($('#policy-'+i+'-range-min').val());
                    p.range.push($('#policy-'+i+'-range-max').val());
                    if(p.range[0] === '' || p.range[1] === ''){
                        alert('Range of policy ' + i + ' is empty.')
                        return
                    }
                }
                policies.push(p);
            }

            let sim = {};
            sim.target = $('#target').html().trim();
            sim.policies = policies;
            sim.interval = $('#interval').val();
            sim.enabled = $('#enabled').val();
            sim.device = device;
            sim.name = $('#name').val();
            sim.stopOnControl = parseInt($('#stopOnControl').val()) === 1;

            if(simulation) {
                sim.id = simulation.id;
            }

            $.ajax({
                url: simulation == null ? '/api/simulation/addSimulation' : '/api/simulation/updateSimulation',
                type: simulation == null ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(sim),
                success: function () {
                    location.href = '/simulations';
                },
                error: function (request) {
                    alert(request.status + request.responseText);
                }
            });
        }

        function validatePanel1() {
            let name = $('#name').val();
            if (name === '') {
                alert('Name cannot be empty.');
                return;
            }
            if (!simulation && simulationsNames.indexOf(name) > -1 || (simulation && simulation.name !== name && simulationsNames.indexOf(name) > -1)) {
                alert('Entered name is duplicated in selected device.')
            } else {
                stepper.next();
            }
        }

        function validatePanel2() {
            let interval = $('#interval').val();
            if (interval === '' || isNaN(interval) || interval === '0') {
                alert('Simulation interval must be a natural number.');
                return;
            }
            let target = $('#target').html().trim();
            if (target === '') {
                alert('Target cannot be empty.');
            } else {
                stepper.next();
            }
        }

        function numeric_filter(input, e) {
            // 입력 타입이 텍스트가 아니면 무시
            if (e.inputType !== "insertText") return;

            const char = e.data;
            const { selectionStart, selectionEnd, value } = input;

            // 입력 후 결과 예측값
            const nextValue =
                value.slice(0, selectionStart) + char + value.slice(selectionEnd);

            // 조건:
            // 1. 숫자/마침표/하이픈만 포함
            // 2. 하이픈은 0~1회만, 맨 앞에만
            // 3. 마침표는 0~1회만
            const dashCount = (nextValue.match(/-/g) || []).length;
            const dotCount = (nextValue.match(/\./g) || []).length;

            const isValid =
                /^-?\d*(\.\d*)?$/.test(nextValue) &&
                dashCount <= 1 &&
                (nextValue.indexOf('-') <= 0) &&
                dotCount <= 1;

            if (!isValid) {
                e.preventDefault(); // 입력 차단
            }
        }

        function changePolicy(el) {
            let pnum = el.id.split("-")[1];
            let val = el.value;

            let value = $('#policies-' + pnum + '-value-wrapper')
            let range = $('#policies-' + pnum + '-range-wrapper');

            if(val === 'STATIC'){
                value.show();
                range.hide();
            } else {
                value.hide();
                range.show();

                let range_min = $('#policy-'+pnum+'-range-min');
                let range_max = $('#policy-'+pnum+'-range-max');
                if(val === 2){
                    range_min.prop('placeholder', 'Minimum for simulation value');
                    range_max.prop('placeholder', 'Maximum for simulation value');
                }
                if(val === 3) {
                    range_min.prop('placeholder', 'Initial simulation value');
                    range_max.prop('placeholder', 'Accumulate per interval');
                }
            }
        }

        function addPolicy() {
            let pnum_input = $('#policies-count');
            let pnum = parseInt(pnum_input.val());

            let policy_label_html = '<label id="policies-'+pnum+'-label" for="policies-' + pnum + '">Policy-' + pnum + '</label>';
            let policy_editor_html =
                '<div id="policies-'+pnum+'" class="form-group rounded-outline">\n' +
                '    <div class="form-group">\n' +
                '        <label for="policies-'+pnum+'-id">ID</label>\n' +
                '        <input type="text" class="form-control form-control-border"\n' +
                '               id="policies-'+pnum+'-id" placeholder="ID of simulation policy '+pnum+'">\n' +
                '    </div>\n' +
                '    <div class="form-group">\n' +
                '        <label for="policies-'+pnum+'-policy">Policy</label>\n' +
                '        <select class="custom-select form-control-border"\n' +
                '                id="policies-'+pnum+'-policy" onchange="changePolicy(this)">\n' +
                '            <option value="STATIC" selected>STATIC</option>\n' +
                '            <option value="RANDOM">RANDOM</option>\n' +
                '            <option value="ACCUMULATE">ACCUMULATE</option>\n' +
                '        </select>\n' +
                '    </div>\n' +
                '    <div class="form-group">\n' +
                '        <label for="policies-'+pnum+'-datatype">Datatype</label>\n' +
                '        <select class="selectpicker form-control" data-live-search="true"\n' +
                '                id="policies-'+pnum+'-datatype">\n' +
                '            <option value="UI8">UI8</option>\n' +
                '            <option value="SI8">SI8</option>\n' +
                '            <option value="UI16AB" selected>UI16AB</option>\n' +
                '            <option value="UI16BA">UI16BA</option>\n' +
                '            <option value="SI16AB">SI16AB</option>\n' +
                '            <option value="SI16BA">SI16BA</option>\n' +
                '            <option value="UI32AD">UI32AD</option>\n' +
                '            <option value="UI32CB">UI32CB</option>\n' +
                '            <option value="UI32BC">UI32BC</option>\n' +
                '            <option value="UI32DA">UI32DA</option>\n' +
                '            <option value="SI32AD">SI32AD</option>\n' +
                '            <option value="SI32CB">SI32CB</option>\n' +
                '            <option value="SI32BC">SI32BC</option>\n' +
                '            <option value="SI32DA">SI32DA</option>\n' +
                '            <option value="SI64AH">SI64AH</option>\n' +
                '            <option value="SI64GB">SI64GB</option>\n' +
                '            <option value="SI64BG">SI64BG</option>\n' +
                '            <option value="SI64HA">SI64HA</option>\n' +
                '            <option value="FP32AD">FP32AD</option>\n' +
                '            <option value="FP32CB">FP32CB</option>\n' +
                '            <option value="FP32BC">FP32BC</option>\n' +
                '            <option value="FP32DA">FP32DA</option>\n' +
                '            <option value="FP64AH">FP64AH</option>\n' +
                '            <option value="FP64GB">FP64GB</option>\n' +
                '            <option value="FP64BG">FP64BG</option>\n' +
                '            <option value="FP64HA">FP64HA</option>\n' +
                '        </select>\n' +
                '    </div>\n' +
                '    <div class="form-group" id="policies-'+pnum+'-value-wrapper">\n' +
                '        <label for="policies-'+pnum+'-value">Value</label>\n' +
                '        <input type="text" class="form-control form-control-border"\n' +
                '               id="policies-'+pnum+'-value" placeholder="Simulation designated value" onbeforeinput="numeric_filter(this, event)">\n' +
                '    </div>\n' +
                '    <div id="policies-'+pnum+'-range-wrapper" style="display: none">\n' +
                '        <label for="policies-'+pnum+'-range">Range</label>\n' +
                '        <div class="form-row" id="policies-'+pnum+'-range">\n' +
                '            <div class="form-group col-md-6">\n' +
                '                <input type="text" class="form-control" id="policy-'+pnum+'-range-min" placeholder="Minimum for simulation value" onbeforeinput="numeric_filter(this, event)">\n' +
                '            </div>\n' +
                '            <div class="form-group col-md-6">\n' +
                '                <input type="text" class="form-control" id="policy-'+pnum+'-range-max" placeholder="Maximum for simulation value" onbeforeinput="numeric_filter(this, event)">\n' +
                '            </div>\n' +
                '        </div>\n' +
                '    </div>\n' +
                '</div>'

            let target = $('#policies');
            target.append(policy_label_html)
            target.append(policy_editor_html)

            $('#policies-'+pnum+'-datatype').selectpicker();

            pnum_input.val(pnum+1);
        }

        function removePolicy() {
            let pnum_input = $('#policies-count');
            let pnum = parseInt(pnum_input.val()) - 1;

            if(pnum > 0) {
                $('#policies-' + pnum).remove();
                $('#policies-' + pnum + '-label').remove()
                pnum_input.val(pnum);
            } else {
                alert('There must be at least one policy.')
            }
        }
        /*]]>*/
    </script>
</head>
