<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="/css/adminlte.min.css">
    <!-- JSON Editor -->
    <link href="/plugins/jsoneditor/css/jsoneditor.min.css" rel="stylesheet">

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        let simulation;
        let policyEditor;

        const policyExample = [{
            "id":"value1",
            "policy": "STATIC",
            "data_type": "SI16AB",
            "value":30.0,
            "range":null,
            "accept_control":false
        }];

        function onload() {
            device = [[${device}]];
            simulation = [[${simulation}]];

            policyEditor = new JSONEditor(document.getElementById("policyEditor"), {});
            if(simulation == null) {
                policyEditor.set(policyExample);
                $('#title').text("Add simulation to '" + device.name + "'");
                $('#menuText').text('Add simulation');
            } else {
                $('#title').text("Edit simulation of '" + device.name + "'");
                $('#menuText').text('Edit simulation');

                $('#target').val(simulation.target);
                policyEditor.set(JSON.parse(simulation.strPolicy));
                $('#interval').val(simulation.interval);
                $('#enabled').val(simulation.enabled);
            }
        }

        function doSubmit(){
            let sim = {};
            sim.target = $('#target').val();
            sim.strPolicy = JSON.stringify(policyEditor.get());
            sim.interval = $('#interval').val();
            sim.enabled = $('#enabled').val();
            sim.device_id = device.id;

            if(sim.interval === '' || isNaN(sim.interval) || sim.interval === '0'){
                alert('Simulation interval must be a natural number.');
                return;
            }

            if(simulation != null){
                sim.id = simulation.id;
            }

            $.ajax({
                url: simulation == null ? '/api/simulation/addSimulation' : '/api/simulation/updateSimulation',
                type: simulation == null ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(sim),
                success: function (data) {
                    location.href = '/simulations';
                },
                error: function (request, status, error) {

                }
            });
        }
        /*]]>*/
    </script>
</head>

                                <div class="form-group">

                                </div>
                                <div class="form-group">

                                    <select class="custom-select form-control-border" id="enabled">
                                        <option value="1">Enabled</option>
                                        <option value="0">Disabled</option>
                                    </select>
                                </div>
                                <button class="btn btn-primary" onclick="doSubmit()">
