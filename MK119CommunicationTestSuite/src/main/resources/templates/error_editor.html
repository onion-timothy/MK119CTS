<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="../../css/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/bootstrap-slider/css/bootstrap-slider.min.css">


    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        let error;
        let frequency;
        let timeout;
        let garbageLength;
        let modes = ['DISCARD', 'TIMEOUT', 'GARBAGE', 'DISCONNECT', 'SIMULATION'];
        let simulation_stop;
        let error_duration;

        let system_frequency_occupied = 0;
        let simulation_frequency_occupied = 0;

        function onload() {
            device = [[${ device }]];
            error = [[${ simulation }]] == null ? undefined : [[${ simulation }]];
            frequency = $('#frequency').bootstrapSlider();
            timeout = $('#timeout').bootstrapSlider();
            garbageLength = $('#garbage-length').bootstrapSlider();
            simulation_stop = $('#simulation-stop').bootstrapSlider();
            error_duration = $('#error-duration').bootstrapSlider();

            if (!error) {
                $('#title').text("Add simulation to '" + device.name + "'");
                $('#menuText').text('Add simulation');
                displayForms('0');
            } else {
                let modeSelector = $('#errorMode');
                modeSelector.prop('disabled', true)
                $('#title').text("Edit simulation of '" + device.name + "'");
                $('#menuText').text('Edit simulation');

                let modeIndex = modes.indexOf(error.mode)
                displayForms(modeIndex);

                modeSelector.val(modeIndex)
                $('#enabled').val(error.enabled)
                frequency.bootstrapSlider('setValue', error.frequency)
                $('#error-interval').val(error.interval || 10)
                if (modeIndex === 1) {
                    timeout.bootstrapSlider('setValue', error.timeout)
                } else if (modeIndex === 2) {
                    garbageLength.bootstrapSlider('setValue', error.garbageLength)
                } else if (modeIndex === 4) {
                    $('#simulation').val(error.simulation.id).change()
                    $('#value').val(error.errorValue)
                    simulation_stop.bootstrapSlider('setValue', error.simulation_stop)
                }
                if (modeIndex !== 4) {
                    error_duration.bootstrapSlider('setValue', error.errorDuration || 30)
                }
            }

            $.ajax({
                url: '/api/error/errors/' + device.id,
                type: 'GET',
                contentType: 'application/json',
                success: function (data) {
                    let system_errors = data.filter(e => e.mode !== 'SIMULATION')
                    let simulation_errors = data.filter(e => e.mode === 'SIMULATION')

                    system_errors.forEach(function (error) {
                        system_frequency_occupied += error.frequency;
                    })
                    simulation_errors.forEach(function (error) {
                        simulation_frequency_occupied += error.frequency;
                    })

                    frequency.on('change', function () {
                        let errorMode = $('#errorMode').val()
                        let frequency_remain = 100 - (errorMode === '4' ? simulation_frequency_occupied : system_frequency_occupied)

                        if (error) {
                            frequency_remain += error.frequency;
                        }

                        if (frequency.bootstrapSlider('getValue') >= frequency_remain) {
                            frequency.bootstrapSlider('setValue', frequency_remain)
                        }
                    })
                },
                error: function (request) {
                    alert(request.status + request.responseText);
                }
            });
        }

        function doSubmit() {
            let _error = {};
            _error.device = device;
            _error.frequency = frequency.bootstrapSlider('getValue');
            _error.mode = parseInt($('#errorMode').val())
            _error.enabled = $('#enabled').val();

            if (_error.mode === 1) {
                _error.timeout = timeout.bootstrapSlider('getValue');
            } else if (_error.mode === 2) {
                _error.garbageLength = garbageLength.bootstrapSlider('getValue');
            } else if (_error.mode === 4) {
                let simulation = {};
                simulation.id = parseInt($('#simulation').val())
                _error.simulation = simulation;
                _error.errorValue = parseFloat($('#value').val())
                _error.simulation_stop = simulation_stop.bootstrapSlider('getValue');
            }

            // 1초 미만이면 ErrorService.startErrorSchedule 이 스케줄을 걸지 않고 조용히 넘어간다
            _error.interval = Math.max(1, parseInt($('#error-interval').val(), 10) || 1);
            if (_error.mode !== 4) {
                _error.errorDuration = error_duration.bootstrapSlider('getValue');
            }

            _error.id = error ? error.id : null;
            let api = error ? '/api/error/updateError' : '/api/error/addError';
            let method = error ? 'POST' : 'PUT';

            $.ajax({
                url: api,
                type: method,
                contentType: 'application/json',
                data: JSON.stringify(_error),
                success: function () {
                    location.href = '/errors?device=' + device.id;
                },
                error: function (request) {
                    alert(request.status + request.responseText);
                }
            });
        }

        function displayForms(value) {
            let formTimeout = $('#timeout-from-group');
            let formGarbageLength = $('#garbage-length-from-group');
            let formSimulation = $('#simulation-from-group');
            let simulationSelect = $('#simulation');

            let mode = parseInt(value);

            let frequency_remain = 100 - (mode === 4 ? simulation_frequency_occupied : system_frequency_occupied)
            if (frequency.bootstrapSlider('getValue') >= frequency_remain) {
                frequency.bootstrapSlider('setValue', frequency_remain)
            }

            if (mode === 0 || mode === 3) {
                formTimeout.hide();
                formGarbageLength.hide();
                formSimulation.hide();
                $('#duration-from-group').show();
                $('#interval-form-group').show();
            } else if (mode === 1) {
                formTimeout.show();
                formGarbageLength.hide();
                formSimulation.hide();
                $('#duration-from-group').show();
                $('#interval-form-group').show();
            } else if (mode === 2) {
                formTimeout.hide();
                formGarbageLength.show();
                formSimulation.hide();
                $('#duration-from-group').show();
                $('#interval-form-group').show();
            } else if (mode === 4) {
                formTimeout.hide();
                formGarbageLength.hide();
                formSimulation.show();
                $('#duration-from-group').hide();
                // Simulation stop 은 target 을 쓰기 보호해서 멈춘다. DB 장비는 ServerData 없이
                // SQL 로 바로 쓰므로 걸 대상이 없다 — 입력칸을 보여 주지 않는다.
                $('#simulation-stop-group').toggle(device.protocol !== 'DB');
                // SIMULATION 모드도 자기 자신의 interval로 독립 스케줄링됨. interval은 확률 판정 주기.
                $('#interval-form-group').show();
                simulationSelect.empty();

                $.ajax({
                    url: '/api/simulation/simulations/' + device.id,
                    async: false,
                    type: 'GET',
                    success: function (data) {
                        data.forEach(function (simulation) {
                            simulationSelect.append('<option value="' + simulation.id + '">' + simulation.name + '(' + simulation.target + ')</option>');
                        });
                    }
                });
            }
        }

        /*]]>*/
    </script>
</head>

            <a href="#" class="brand-link">

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Content Header (Page header) -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0" id="title"></h1>
                        </div><!-- /.col -->
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="#">Home</a></li>
                                <li class="breadcrumb-item active" id="menuText"></li>
                            </ol>
                        </div><!-- /.col -->
                    </div><!-- /.row -->
                </div><!-- /.container-fluid -->
            </div>
            <!-- /.content-header -->

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <!-- Small boxes (Stat box) -->
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card card-default">
                                <div class="card-header">
                                    <h3 class="card-title">Information of simulation</h3>
                                </div>
                                <div class="card-body p-2">
                                    <div class="form-group">
                                        <label for="errorMode">Error mode</label>
                                        <select class="custom-select form-control-border" id="errorMode"
                                            onchange="displayForms(this.value)">
                                            <option value="0">Discard</option>
                                            <option value="1">Timeout</option>
                                            <option value="2">Garbage</option>
                                            <option value="3">Disconnect</option>
                                            <option value="4">Simulation</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="frequency">Frequency(%)</label>
                                        <div class="slider-green">
                                            <input id="frequency" data-slider-id='frequency' type="range"
                                                data-slider-min="0" data-slider-max="100" data-slider-step="1"
                                                data-slider-value="10" onchange="" />
                                        </div>
                                    </div>
                                    <div class="form-group" id="timeout-from-group">
                                        <label for="timeout">Timeout(s)</label>
                                        <div class="slider-red">
                                            <input id="timeout" data-slider-id='timeout' type="range"
                                                data-slider-min="0" data-slider-max="10" data-slider-step="1"
                                                data-slider-value="4" />
                                        </div>
                                    </div>
                                    <div class="form-group" id="garbage-length-from-group">
                                        <label for="garbage-length">Length of garbage packet</label>
                                        <div class="slider-blue">
                                            <input id="garbage-length" data-slider-id='garbage-length' type="range"
                                                data-slider-min="1" data-slider-max="1024" data-slider-step="1"
                                                data-slider-value="36" />
                                        </div>
                                    </div>
                                    <div class="form-group" id="simulation-from-group">
                                        <label for="simulation">Value simulation to make error</label>

                                        <select class="custom-select form-control-border" id="simulation">

                                        </select>

                                        <label for="value">Error value</label>
                                        <input id="value" type="text" class="form-control form-control-border" />

                                        <div id="simulation-stop-group">
                                            <label for="simulation-stop">Simulation stop(s)</label>
                                            <div class="slider-blue">
                                                <input id="simulation-stop" data-slider-id='simulation-stop' type="range"
                                                    data-slider-min="0" data-slider-max="60" data-slider-step="1"
                                                    data-slider-value="10" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group" id="interval-form-group">
                                        <label for="error-interval">Interval(s) - probability check period</label>
                                        <input type="number" class="form-control form-control-border"
                                               id="error-interval" min="1" step="1" value="10"
                                               placeholder="How often the error rolls the dice, in seconds"
                                               oninput="this.value|=0" />
                                    </div>
                                    <div class="form-group" id="duration-from-group">
                                        <label for="error-duration">Duration(s) - how long the error lasts</label>
                                        <div class="slider-red">
                                            <input id="error-duration" data-slider-id='error-duration' type="range"
                                                data-slider-min="1" data-slider-max="300" data-slider-step="1"
                                                data-slider-value="30" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="enabled">Initial state</label>

                                            <option value="1">Enabled</option>
                                            <option value="0">Disabled</option>
                                        </select>
                                    </div>
                                    <button class="btn btn-primary" onclick="doSubmit()">

                                    </button>
                                </div>
                                <!-- /.card-body -->
