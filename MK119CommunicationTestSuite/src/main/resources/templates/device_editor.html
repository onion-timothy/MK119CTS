<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <th:block th:replace="~{fragments/tabler :: tree-assets}"></th:block>
    <title>MK119 CTS — Device</title>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/css/cts-device-form.css">

    <style>
        /*
         * 세로 화면(또는 좁은 창): 카드를 위아래로 쌓는다. 늘어나는 카드(그룹 트리·프로토콜 정의)가
         * 남는 높이를 나눠 가져 페이지 영역을 다 쓰고, 최소 높이를 합쳐도 모자라면 칸 전체가 세로로 스크롤한다.
         * 가로 화면: 좌(장비·그룹·연결) / 우(프로토콜 설정·패킷 기술자).
         */
        .ed-body { flex: 1 1 auto; min-height: 0; overflow-y: auto;
                   display: flex; flex-direction: column; gap: var(--cts-page-gap); }
        /* 쌓을 때는 칸 구분 없이 카드가 바로 줄을 선다 */
        .ed-col { display: contents; }
        .ed-body .card { flex: 0 0 auto; }
        .ed-body .ed-grow { flex: 1 1 0; min-height: 14rem; }
        @media (min-width: 1100px) and (orientation: landscape) {
            .ed-body { overflow: hidden; display: grid;
                       grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
            /* 낮은 화면에서 최소 높이를 합쳐도 모자라면 그 칸만 세로로 스크롤한다 */
            .ed-col { display: flex; flex-direction: column; gap: var(--cts-page-gap); min-height: 0; min-width: 0;
                      overflow-y: auto; }
            .ed-body .ed-grow { flex: 1 1 0; min-height: 0; }
            /* 트리는 몇 줄은 보여야 고를 수 있다 */
            .ed-body #group-card { min-height: 12rem; }
            /* 프로토콜 정의를 쓰지 않는 프로토콜은 설정 카드가 오른쪽 칸을 채운다 */
            .ed-body:not(.has-definition) #settings-card { flex: 1 1 0; min-height: 0; }
        }
        /*
         * 장비·연결 카드의 칸 배치. 화면 폭이 아니라 카드 폭을 본다 — 같은 카드가
         * 가로 화면에선 좁은 칸에, 세로 화면에선 넓은 줄에 들어가기 때문이다.
         */
        .ed-cq { container-type: inline-size; }
        .ed-grid { display: grid; gap: .75rem .5rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .ed-grid > .ed-wide { grid-column: 1 / -1; }
        .ed-conn-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
        /* 한 줄로 펴는 기준은 가장 좁은 칸(select)이 글을 자르지 않는 폭이다 */
        @container (min-width: 29rem) {
            .ed-dev-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); }
            .ed-dev-grid > .ed-name { grid-column: auto; }
        }
        @container (min-width: 33rem) {
            .ed-conn-grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) minmax(0, 3fr) minmax(0, 2fr); }
        }
        .ed-grid .form-label { margin-bottom: .35rem; }

        /* 입력칸 아래 한 줄 상태. 비어 있으면 자리를 차지하지 않는다 */
        .ed-status { font-size: .78rem; margin-top: .3rem; color: var(--tblr-secondary); }
        .ed-grid > .ed-status { margin-top: -.4rem; }
        .ed-status:empty { display: none; }
        .ed-status.is-bad { color: var(--tblr-red); }
        .ed-status.is-ok { color: var(--tblr-green); }

        /* 프로토콜이 하는 일 */
        .ed-note { font-size: .8rem; color: var(--tblr-secondary); margin-bottom: 1rem; }
        .ed-note:empty { display: none; }

        .ed-sub { font-weight: normal; color: var(--tblr-secondary); font-size: .8rem; margin-left: .35rem; }

        /* 그룹 트리 카드. 트리가 본문을 꽉 채우고 그 안에서 스크롤한다 */
        #group-tree { height: 100%; }
        .ed-search { width: 180px; min-width: 0; }

    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;              // 고치는 장비. 새로 만들 때는 undefined
        let registered = null;   // 등록된 장비 전부. 못 받아 오면 null 로 두고 겹침 검사를 건너뛴다
        const groupPaths = {};   // group id → 'ROOT / test1'
        let groupTree;           // 그룹 트리 (static/js/cts-tree.js)
        let selectedGroup = null;
        let startGroup = 1;      // 들어온 그룹. Cancel 하면 여기로 돌아간다

        // 프로토콜·설정 칸 정의는 js/cts-device-form.js 에 있다. 스크립트가 body 끝에서 올라오므로 시작할 때 받는다
        let PROTOCOLS, PROTOCOL_ORDER, SETTINGS;
        let definition;          // 프로토콜 정의 카드 (js/cts-definition-card.js)

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, m =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        }

        function protocol() { return $('#protocol').val(); }

        // ── 연결: 겹침 판정 ─────────────────────────────────────
        // ApiController.findEndpointConflict 와 같은 규칙이다. DB·BACnet 은 장비마다 여는 포트가 없어 빠진다.

        function bindsEndpoint(p) { return p !== 'DB' && p !== 'BACNET'; }

        function isWildcard(h) {
            h = String(h == null ? '' : h).trim();
            return h === '0.0.0.0' || h === '::' || h === '[::]' || h === '*';
        }

        /** 지금 입력의 엔드포인트. 판정할 수 없으면 null. */
        function currentEndpoint() {
            const p = protocol();
            const port = parseInt($('#port').val(), 10);
            if (!bindsEndpoint(p) || isNaN(port)) return null;
            return { host: String($('#host').val() || '').trim(), port: port, transport: $('#transport').val() };
        }

        function clashes(ep, d) {
            if (!ep || !bindsEndpoint(d.protocol) || d.transport !== ep.transport || Number(d.port) !== ep.port) return false;
            const h = String(d.host == null ? '' : d.host).trim();
            return isWildcard(ep.host) || isWildcard(h) || ep.host === h;
        }

        function others() {
            return (registered || []).filter(d => !device || d.id !== device.id);
        }

        function nameOwner() {
            const name = $('#name').val();
            if (!name) return null;
            return others().filter(d => d.name === name)[0] || null;
        }

        function endpointText(d) {
            return d.host + ':' + d.port + '/' + d.transport;
        }

        // ── 화면 맞추기 ─────────────────────────────────────────

        /** 이름·엔드포인트 아래 상태 줄을 지금 입력에 맞춘다. */
        function refreshChecks() {
            const owner = nameOwner();
            $('#name-status').attr('class', 'ed-status' + (owner ? ' is-bad' : ''))
                .text(owner ? 'Already used by a device in ' + (groupPaths[owner.group && owner.group.id] || 'another group') + '.' : '');

            const p = protocol();
            const $ep = $('#endpoint-status');
            const ep = currentEndpoint();
            if (p === 'DB') {
                $ep.attr('class', 'ed-status ed-wide').text('A DB device connects out over JDBC. It has no host or port to bind.');
            } else if (p === 'BACNET') {
                $ep.attr('class', 'ed-status ed-wide').text('Every BACnet device shares 0.0.0.0:47808/UDP.');
            } else if (!ep || registered == null) {
                $ep.attr('class', 'ed-status ed-wide').text('');
            } else {
                const hit = others().filter(d => clashes(ep, d));
                if (hit.length) {
                    $ep.attr('class', 'ed-status ed-wide is-bad').html('Already used by <b>' + esc(hit[0].name) + '</b> ('
                        + esc(endpointText(hit[0])) + ')' + (hit.length > 1 ? ' and ' + (hit.length - 1) + ' more' : '') + '.');
                } else {
                    $ep.attr('class', 'ed-status ed-wide is-ok').text('No other device uses this endpoint.');
                }
            }
        }

        /** 프로토콜을 바꿨을 때 — 전송 계층, 설정 칸, 패킷 기술자를 그 프로토콜 것으로 바꾼다. */
        function applyProtocol() {
            const p = protocol();
            const info = PROTOCOLS[p];

            const $t = $('#transport');
            const was = $t.val();
            $t.empty();
            info.transports.forEach(t => $t.append(new Option(t, t)));
            $t.val(info.transports.indexOf(was) >= 0 ? was : info.transports[0]);
            // 하나뿐이면 고를 게 없다는 걸 보여 준다
            $t.prop('disabled', info.transports.length === 1);

            $('.ed-proto').hide();
            $('.ed-proto[data-protocol="' + p + '"]').show();
            $('#settings-card').toggle(!!SETTINGS[p]);
            $('#proto-title').text(info.text + ' settings');
            $('#proto-note').text(info.note || '');

            $('.ed-body').toggleClass('has-definition', !!info.definition);
            $('#definition-card').toggle(!!info.definition);
            if (info.definition) definition.setProtocol(p);

            applyEndpoint();
        }

        // BACnet 이 채워 넣은 host/port 인지. 다른 프로토콜로 옮기면 지운다
        let endpointForced = false;

        function applyEndpoint() {
            const p = protocol();
            const $host = $('#host'), $port = $('#port');

            const fixed = p === 'BACNET';
            if (fixed) {
                $host.val('0.0.0.0');
                $port.val(47808);
                endpointForced = true;
            } else if (endpointForced) {
                $host.val('0.0.0.0');
                $port.val('');
                endpointForced = false;
            }
            $host.prop('readonly', fixed);
            $port.prop('readonly', fixed);

            // DB 는 나가서 붙는 쪽이라 열 포트가 없다
            $('#host-cell, #port-cell').toggle(p !== 'DB');

            const info = PROTOCOLS[p];
            const def = info.port && info.port[$('#transport').val()];
            $port.attr('placeholder', def ? 'Default ' + def : 'Port');
            refreshChecks();
        }

        // ── 그룹 ────────────────────────────────────────────────

        function showGroupPath() {
            $('#group-path').text(selectedGroup == null ? '' : (groupPaths[selectedGroup] || ''));
        }

        /** 그룹만 보이는 트리. 장비 줄은 걸러 낸다 */
        function mountGroupTree() {
            groupTree = CtsTree.create(document.getElementById('group-tree'), {
                url: '/api/device/devices/treeData',
                filter: row => row.type === 'group',
                expandAll: true,
                initialSelect: 'g_' + startGroup,
                onSelect: function (node) {
                    selectedGroup = parseInt(node.id.split('_')[1], 10);
                    showGroupPath();
                },
                // 들어온 그룹이 없어졌으면 맨 위 그룹을 고른다
                onReady: function (t) {
                    if (!t.selected() && t.roots.length) t.select(t.roots[0]);
                },
            });

            const input = document.getElementById('group-search');
            let timer;
            input.addEventListener('input', function () {
                clearTimeout(timer);
                timer = setTimeout(function () { groupTree.search(input.value); }, 200);
            });
        }

        /** 'ROOT / test1' 꼴의 경로. 이름 겹침 안내와 카드 머리에 쓴다 */
        function loadGroupPaths() {
            return $.getJSON('/api/group/groups/treeData').done(function (rows) {
                const byId = {};
                rows.forEach(r => { byId[r.id] = r; });
                rows.forEach(r => {
                    const names = [];
                    for (let n = r, guard = 0; n && guard < 64; n = byId[n.parent], guard++) names.unshift(n.text);
                    groupPaths[parseInt(r.id.split('_')[1], 10)] = names.join(' / ');
                });
                showGroupPath();
            });
        }

        // ── 저장 ────────────────────────────────────────────────

        /** 알리고 그 칸으로 데려간다. 단계가 없으니 첫 문제에서 멈춘다. */
        function complain(message, el) {
            alert(message);
            if (typeof el === 'string') el = document.querySelector(el);
            if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
            return null;
        }

        /** 프로토콜 설정 칸을 읽는다. 문제가 있으면 알리고 null. */
        function readSettings(p) {
            const cs = CtsDeviceForm.read(p);
            const bad = CtsDeviceForm.problems(p, cs)[0];
            return bad ? complain(bad.message, '#' + bad.id) : cs;
        }

        function fillSettings(p, cs) {
            CtsDeviceForm.fill(p, cs);
        }

        function backTo(group) {
            location.href = '/?group=' + (group || 1);
        }

        function cancelEdit() {
            backTo(device ? device.group.id : startGroup);
        }

        function doSubmit() {
            const p = protocol();
            const name = $('#name').val();
            if (name.trim() === '') return complain('Name cannot be empty.', '#name');
            const owner = nameOwner();
            if (owner) {
                return complain('Device name “' + name + '” is already used in '
                    + (groupPaths[owner.group && owner.group.id] || 'another group') + '. Names must be unique.', '#name');
            }
            if (selectedGroup == null) return complain('Select a group.', '#group-tree');

            const dev = {
                name: name,
                enabled: $('#enabled').val(),
                log: $('#log').val(),
                group: { id: selectedGroup, name: null, parentId: null },
                protocol: p,
                transport: $('#transport').val(),
                host: '',
                port: null,
            };
            if (device) dev.id = device.id;

            if (p !== 'DB') {
                dev.host = String($('#host').val() || '').trim();
                if (dev.host === '') return complain('Host cannot be empty.', '#host');
                const port = $('#port').val().trim();
                if (!/^\d+$/.test(port) || +port > 65535) return complain('Port must be a whole number from 0 to 65535.', '#port');
                dev.port = parseInt(port, 10);
            }

            const cs = readSettings(p);
            if (!cs) return;
            if (PROTOCOLS[p].definition) {
                const list = definition.problems(p);
                definition.mark(list);
                if (list.length) return complain(list[0].message, '#' + list[0].id);
                Object.assign(cs, definition.read());
            }
            dev.communicationSettings = cs;

            // 단건 저장은 서버가 엔드포인트 겹침을 보지 않는다(일괄 등록만 막는다). 열리지 않을 장비가 되므로 여기서 묻는다
            const ep = currentEndpoint();
            const hit = ep ? others().filter(d => clashes(ep, d)) : [];
            if (hit.length && !confirm('Endpoint ' + ep.host + ':' + ep.port + '/' + ep.transport + ' is already used by '
                    + hit.map(d => d.name).join(', ') + '.\nThis device will fail to open it.\n\nSave anyway?')) {
                return;
            }

            $.ajax({
                url: device ? '/api/device/updateDevice' : '/api/device/addDevice',
                type: device ? 'POST' : 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(dev),
                success: function () { backTo(dev.group.id); },
                error: function (request) {
                    if (String(request.responseText).indexOf('UNIQUE') >= 0) {
                        alert('Device name “' + dev.name + '” is already used. Names must be unique.');
                    } else {
                        alert(request.status + ' ' + request.responseText);
                    }
                }
            });
        }

        // ── 시작 ────────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', function () {
            device = [[${device}]];
            if (device == null) device = undefined;
            ({ PROTOCOLS, PROTOCOL_ORDER, SETTINGS } = CtsDeviceForm);
            CtsDeviceForm.mount();
            definition = CtsDefinitionCard.mount(document.getElementById('definition-card'));

            const $p = $('#protocol');
            PROTOCOL_ORDER.forEach(p => $p.append(new Option(PROTOCOLS[p].text, p)));

            const queryGroup = parseInt(new URLSearchParams(location.search).get('group'), 10);
            startGroup = device ? device.group.id : (isNaN(queryGroup) ? 1 : queryGroup);

            if (device) {
                $('#pageTitle').text('Edit device');
                $('#pageSubtitle').text(device.name + ' · ' + (PROTOCOLS[device.protocol] || { text: device.protocol }).text);
                $('#name').val(device.name);
                $('#enabled').val(device.enabled);
                $('#log').val(device.log);
                // 프로토콜은 저장 뒤에 바꿀 수 없다. 딸린 설정과 시뮬레이션 target 형식이 통째로 달라진다
                $p.val(device.protocol).prop('disabled', true);
                $('#protocol-hint').text('Protocol is fixed after saving');
                fillSettings(device.protocol, device.communicationSettings);
                definition.load().then(() => definition.set(device.protocol, device.communicationSettings));
                applyProtocol();
                $('#transport').val(device.transport);
                if (device.protocol !== 'BACNET') {
                    $('#host').val(device.host);
                    $('#port').val(device.port);
                }
                applyEndpoint();
            } else {
                $('#pageTitle').text('Add device');
                $('#host').val('0.0.0.0');
                definition.load().then(() => definition.set(protocol(), {}));
                applyProtocol();
            }

            mountGroupTree();
            loadGroupPaths();
            // 겹침 검사용. 못 받아 와도 입력은 멀쩡해야 하고, 저장 때 서버가 이름 중복을 다시 막는다
            $.getJSON('/api/device/devices').done(function (list) {
                registered = list;
                refreshChecks();
            });

            $p.on('change', applyProtocol);
            $('#transport').on('change', applyEndpoint);
            $('#name, #host, #port').on('input', refreshChecks);
        });
        /*]]>*/
    </script>
</head>
<body>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('devices')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list">
            <button type="button" class="btn btn-outline-secondary" onclick="cancelEdit()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="doSubmit()">Save</button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <div class="container-fluid cts-root">
                <form class="ed-body" onsubmit="return false" autocomplete="off">
                    <!-- 무엇이고 어디에 두는가 -->
                    <div class="ed-col">
                        <div class="card cts-card">
                            <div class="card-header">
                                <h3 class="card-title">Device</h3>
                            </div>
                            <div class="card-body ed-cq">
                                <div class="ed-grid ed-dev-grid">
                                    <div class="ed-wide ed-name">
                                        <label class="form-label" for="name">Name</label>
                                        <input type="text" class="form-control" id="name"
                                               placeholder="Displayed name for device">
                                        <div class="ed-status" id="name-status"></div>
                                    </div>
                                    <div>
                                        <label class="form-label" for="enabled">Initial state</label>
                                        <select class="form-select" id="enabled">
                                            <option value="1">Enabled</option>
                                            <option value="0">Disabled</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="form-label" for="log">Packet log</label>
                                        <select class="form-select" id="log">
                                            <option value="1">Enabled</option>
                                            <option value="0" selected>Disabled</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card cts-card ed-grow" id="group-card">
                            <div class="card-header">
                                <h3 class="card-title">Group<span class="ed-sub" id="group-path"></span></h3>
                                <div class="card-actions">
                                    <input id="group-search" type="search" class="form-control form-control-sm ed-search"
                                           placeholder="Search groups...">
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <div id="group-tree"></div>
                            </div>
                        </div>

                        <div class="card cts-card">
                            <div class="card-header">
                                <h3 class="card-title">Connection<span class="ed-sub" id="protocol-hint"></span></h3>
                            </div>
                            <div class="card-body ed-cq">
                                <div class="ed-grid ed-conn-grid">
                                    <div>
                                        <label class="form-label" for="protocol">Protocol</label>
                                        <select class="form-select" id="protocol"></select>
                                    </div>
                                    <div>
                                        <label class="form-label" for="transport">Transport</label>
                                        <select class="form-select" id="transport"></select>
                                    </div>
                                    <div id="host-cell">
                                        <label class="form-label" for="host">Host</label>
                                        <input type="text" class="form-control" id="host"
                                               placeholder="Binding host for device">
                                    </div>
                                    <div id="port-cell">
                                        <label class="form-label" for="port">Port</label>
                                        <input type="text" class="form-control" id="port" inputmode="numeric"
                                               placeholder="Port">
                                    </div>
                                    <div class="ed-status ed-wide" id="endpoint-status"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 어떻게 말하는가 -->
                    <div class="ed-col">
                        <div class="card cts-card" id="settings-card">
                            <div class="card-header">
                                <h3 class="card-title" id="proto-title"></h3>
                            </div>
                            <div class="card-body">
                                <div class="ed-note" id="proto-note"></div>

                                <th:block th:replace="~{fragments/device-form :: settings}"></th:block>
                            </div>
                        </div>

                        <th:block th:replace="~{fragments/device-form :: definition-card}"></th:block>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
