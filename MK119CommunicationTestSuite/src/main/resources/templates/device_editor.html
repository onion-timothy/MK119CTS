<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="/css/adminlte.min.css">
    <!-- jTree -->
    <link rel="stylesheet" href="/css/style.min.css"/>
    <!-- BS Stepper -->
    <link rel="stylesheet" href="/plugins/bs-stepper/css/bs-stepper.min.css">
    <!-- JSON Editor -->
    <link href="/plugins/jsoneditor/css/jsoneditor.min.css" rel="stylesheet">
    <!-- bootstrap slider -->
    <link rel="stylesheet" href="/plugins/bootstrap-slider/css/bootstrap-slider.min.css">

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        let communicationSettings;

        document.addEventListener('DOMContentLoaded', function () {
            window.stepper = new Stepper(document.querySelector('.bs-stepper'))
        });
        let tree;

        let diCount;
        let doCount;
        let aiCount;
        let rsCount;

        function onload() {
            $('#tree-container').jstree({
                'core': {
                    'themes': {
                        'responsive': true,
                        "variant": "large"
                    },
                    'check_callback': true,
                    'data': {
                        "url": "/api/group/groups/treeData"
                    }
                },
                "types": {
                    "group": {
                        "icon": "fas fa-folder",
                    }
                },
                "plugins": [
                    "types", "wholerow", "sort"
                ],
            }).on("select_node.jstree", function (e, data) {
                if (data.node.type === 'group') {
                    $.jstree.reference('#tree-container').open_node(data.node.id);
                }
            }).on("ready.jstree", function (e, data) {
                // 시작할 때 루트 노드를 열어준다.
                if (device != null) {
                    $.jstree.reference('#tree-container').open_node('g_' + device.group_id);
                    $.jstree.reference('#tree-container').select_node('g_' + device.group_id);
                }
            });
            diCount = $('#diCount').bootstrapSlider();
            doCount = $('#doCount').bootstrapSlider();
            aiCount = $('#aiCount').bootstrapSlider();
            rsCount = $('#rsCount').bootstrapSlider();

            device = [[${device}]];
            if (device != null) {
                communicationSettings = JSON.parse(device.strCommunicationSettings);
                loadEditDevice(device);
            }
        }

        function loadEditDevice(device) {
            $('#title').text("Edit device '" + device.name + "'");
            $('#menuText').text('Edit device');
            $('#name').val(device.name);
            $('#enabled').val(device.enabled);
            $('#log').val(device.log);
            $.jstree.reference('#tree-container').open_node('g_1');
            $('#transport').val(device.intTransport);
            $('#protocol').val(device.intProtocol);
            $('#host').val(device.host);
            $('#port').val(device.port);
            $('#protocol').prop('disabled', true);
            $('#devId').val(device.id);
        }

        function validatePanel1() {
            let name = $('#name').val();
            if (name === '') {
                alert('Name cannot be empty.');
            } else {
                stepper.next();
            }
        }

        function validatePanel2() {
            let groupselected = typeof($.jstree.reference('#tree-container').get_selected()[0]);
            if (groupselected === 'undefined') {
                alert('Group not selected.');
            } else {
                stepper.next();
            }
        }

        let rxJsonEditor;
        let txJsonEditor;
        let rxJsonRCUEditor;
        let txJsonRCUEditor;

        const rxExample = [{"rx_id":"modbus-rtu-uid-1-fc-3","length":8,"fields":[{"field_id":"unit_id","data_type":"UI8","required_value":1},{"field_id":"fc","data_type":"UI8","required_value":3},{"field_id":"register","data_type":"UI16AB","required_value":null},{"field_id":"count","data_type":"UI16AB","required_value":null},{"field_id":"crc16","data_type":"SI16AB","required_value":null}]}];
        const txExample = [{"tx_id":"modbus-rtu-uid-1-fc-3","fields":[{"field_id":"unit_id","field_type":"REFERENCE","data_type":"UI8","value":"@unit_id"},{"field_id":"fc","field_type":"REFERENCE","data_type":"UI8","value":"@fc"},{"field_id":"byte_count","field_type":"REFERENCE","data_type":"UI8","value":"@count*2"},{"field_id":"registers","field_type":"ITERATION","data_type":"SI16AB","value":null,"iteration_count":"@count"},{"field_id":"crc","field_type":"CRC16","data_type":"SI16AB","value":0}]}];

        function validatePanel3() {
            let host = $('#host').val();
            let port = $('#port').val();
            let protocol = $('#protocol').val();
            if (host === '' || port === '') {
                alert('Host and port is cannot be empty.');
            } else {
                stepper.next();

                if (protocol == 1) {
                    showForm('formGeneric');
                    if (rxJsonEditor)
                        rxJsonEditor.destroy();
                    if (txJsonEditor)
                        txJsonEditor.destroy();
                    rxJsonEditor = new JSONEditor(document.getElementById("rxJson"), {});
                    txJsonEditor = new JSONEditor(document.getElementById("txJson"), {});
                    rxJsonEditor.set(device == null ? rxExample : communicationSettings.rx);
                    txJsonEditor.set(device == null ? txExample : communicationSettings.tx);
                } else if (protocol == 2) {
                    showForm('formModbus');
                    if (device != null) {
                        $('#uid').val(communicationSettings.unitId);
                        $('#packetType').val(communicationSettings.packetType);
                    }
                } else if (protocol == 3) {
                    showForm('formLSISXGT');
                    if (device != null) {
                        $('#cpuid').val(communicationSettings.cpuId);
                        $('#blocksize').val((communicationSettings.maxBlockSize))
                    }
                } else if (protocol == 4) {
                    showForm('formMKRCU');
                    if (rxJsonRCUEditor)
                        rxJsonRCUEditor.destroy();
                    if (txJsonRCUEditor)
                        txJsonRCUEditor.destroy();
                    rxJsonRCUEditor = new JSONEditor(document.getElementById("rxJsonRCU"), {});
                    txJsonRCUEditor = new JSONEditor(document.getElementById("txJsonRCU"), {});
                    rxJsonRCUEditor.set(rxExample);
                    txJsonRCUEditor.set(txExample);

                    if (device != null) {
                        rxJsonRCUEditor.set(communicationSettings.rx);
                        txJsonRCUEditor.set(communicationSettings.tx);
                        $('#cpuAddr').val(communicationSettings.cpuAddr);
                        diCount.bootstrapSlider('setValue', communicationSettings.diCount);
                        doCount.bootstrapSlider('setValue', communicationSettings.doCount);
                        aiCount.bootstrapSlider('setValue', communicationSettings.aiCount);
                        rsCount.bootstrapSlider('setValue', communicationSettings.rsCount);
                    }
                } else if (protocol == 5) {
                    showForm('formSNMP');
                    if (device != null) {
                        $('#snmpVersion').val(communicationSettings.snmpVersion);
                        $('#getCommunity').val(communicationSettings.getCommunity);
                        $('#setCommunity').val(communicationSettings.setCommunity);
                    }
                } else if (protocol == 6) {
                    showForm('formBACnet');
                    if (device != null) {
                        $('#deviceInstanceId').val(communicationSettings.deviceInstanceId);
                        $('#broadcast').val(communicationSettings.broadcast);
                    }
                } else if (protocol == 7) {
                    showForm('formMKOPCAgent');
                    $('#agentTagsCount').val(communicationSettings.agentTagsCount);
                } else if (protocol == 8) {
                    showForm('formDB');
                    if (device != null) {
                        $('#dbDriver').val(communicationSettings.dbdriver);
                        $('#dbUrl').val(communicationSettings.dbUrl);
                        $('#dbUsername').val(communicationSettings.dbUsername);
                        document.getElementById("dbPassword").value = communicationSettings.dbPassword;
                        $('#dbDatabase').val(communicationSettings.dbDatabase);
                    }
                }
            }
        }

        let formIds = ['formGeneric', 'formModbus', 'formLSISXGT', 'formMKRCU', 'formSNMP', 'formBACnet', 'formMKOPCAgent', 'formDB'];

        function showForm(formId) {
            for (let i = 0; i < formIds.length; i++) {
                $('#' + formIds[i]).hide();
            }
            $('#' + formId).show();
        }

        function addDevice() {
            let dev = {};
            dev.intTransport = $('#transport').val();
            dev.intProtocol = $('#protocol').val();
            dev.host = $('#host').val();
            dev.port = $('#port').val();
            dev.name = $('#name').val();
            dev.enabled = $('#enabled').val();
            dev.log = $('#log').val();
            dev.group_id = $.jstree.reference('#tree-container').get_selected()[0].split("_")[1];

            if (device != null) {
                dev.id = $('#devId').val();
            }

            let communicationSettings = {};
            if (dev.intProtocol == 1) {
                communicationSettings.rx = rxJsonEditor.get();
                communicationSettings.tx = txJsonEditor.get();
            } else if (dev.intProtocol == 2) {
                communicationSettings.unitId = $('#uid').val();
                communicationSettings.packetType = $('#packetType').val();

                if(communicationSettings.unitId === '' || isNaN(communicationSettings.unitId)){
                    alert('Unit ID must assigned to number.');
                    return;
                }
                if (communicationSettings.unitId < 0 || communicationSettings.unitId > 255) {
                    alert('Invalid Unit ID. Modbus Unit ID must in 0~255.');
                    return;
                }
            } else if (dev.intProtocol == 3) {
                communicationSettings.cpuId = $('#cpuid').val();
                communicationSettings.maxBlockSize = $('#blocksize').val();

                if(communicationSettings.cpuId === '' || isNaN(communicationSettings.cpuId)) {
                    alert('CPU ID must assigned to number.')
                    return
                }
                if (communicationSettings.cpuId < 0 || communicationSettings.cpuId > 255) {
                    alert('Invalid CPU ID. XGT CPU ID must in 0~255.')
                    return
                }

                if(communicationSettings.maxBlockSize === '' || isNaN(communicationSettings.maxBlockSize)) {
                    alert('Block size must assigned to number.')
                    return
                }
                if (communicationSettings.maxBlockSize < 1 || communicationSettings.cpuId > 1400) {
                    alert('Invalid Block size. Block size must in 1~1400.')
                    return
                }
            } else if (dev.intProtocol == 4) {
                communicationSettings.rx = rxJsonRCUEditor.get();
                communicationSettings.tx = txJsonRCUEditor.get();
                communicationSettings.cpuAddr = $('#cpuAddr').val();
                communicationSettings.diCount = diCount.bootstrapSlider('getValue');
                communicationSettings.doCount = doCount.bootstrapSlider('getValue');
                communicationSettings.aiCount = aiCount.bootstrapSlider('getValue');
                communicationSettings.rsCount = rsCount.bootstrapSlider('getValue');

                if(communicationSettings.cpuAddr === '' || isNaN(communicationSettings.cpuAddr)) {
                    alert('CPU ID must assigned to number.')
                    return
                }
                if (communicationSettings.cpuAddr < 0 || communicationSettings.cpuAddr > 255) {
                    alert('Invalid CPU Address. MK RCU CPU Address must in 0~255.')
                    return
                }
            } else if (dev.intProtocol == 5) {
                communicationSettings.snmpVersion = $('#snmpVersion').val();
                communicationSettings.getCommunity = $('#getCommunity').val();
                communicationSettings.setCommunity = $('#setCommunity').val();
                if(communicationSettings.snmpVersion === '' || isNaN(communicationSettings.snmpVersion)) {
                    alert('SNMP Version must assigned to number.')
                    return
                }
                if (communicationSettings.snmpVersion < 0 || communicationSettings.snmpVersion > 1) {
                    alert('Invalid SNMP Version. SNMP Version must in 1 or 2.')
                    return
                }
            } else if (dev.intProtocol == 6) {
                communicationSettings.deviceInstanceId = $('#deviceInstanceId').val();
                communicationSettings.broadcast = $('#broadcast').val();

                if(communicationSettings.deviceInstanceId === '' || isNaN(communicationSettings.deviceInstanceId)) {
                    alert('BACnet device instance number must assigned to number.')
                    return
                }
                if (communicationSettings.deviceInstanceId < 1 || communicationSettings.deviceInstanceId > 65536) {
                    alert('Invalid BACnet device instance number. BACnet device instance number must in 1~65536.')
                    return
                }
                if(communicationSettings.broadcast === ''){
                    alert('BACnet broadcast address cannot be empty.')
                }
            } else if (dev.intProtocol == 7) {
                communicationSettings.agentTagsCount = $('#agentTagsCount').val();
                if(communicationSettings.agentTagsCount === '' || isNaN(communicationSettings.agentTagsCount)) {
                    alert('OPC Agent tags count must assigned to number.')
                    return
                }
            } else if (dev.intProtocol == 8) {
                communicationSettings.dbdriver = $('#dbDriver').val();
                communicationSettings.dbUrl = $('#dbUrl').val();
                communicationSettings.dbUsername = $('#dbUsername').val();
                communicationSettings.dbPassword = document.getElementById("dbPassword").value;
                communicationSettings.dbDatabase = $('#dbDatabase').val();

                if(communicationSettings.dbdriver === ''){
                    alert('DB Driver cannot be empty.')
                }
                if(communicationSettings.dbUrl === ''){
                    alert('DB URL cannot be empty.')
                }
                if(communicationSettings.dbUsername === ''){
                    alert('DB Username cannot be empty.')
                }
                if(communicationSettings.dbPassword === ''){
                    alert('DB Password cannot be empty.')
                }
                if(communicationSettings.dbDatabase === ''){
                    alert('DB name cannot be empty.')
                }
            }

            dev.strCommunicationSettings = JSON.stringify(communicationSettings);
            $.ajax({
                url: device == null ? '/api/device/addDevice' : '/api/device/updateDevice',
                type: device == null ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(dev),
                success: function (data) {
                    location.href = '/';
                },
                error: function (request, status, error) {
                    if (request.responseText.includes('UNIQUE')) {
                        alert("Cannot create with the same name within a group.");
                    } else
                        alert(request.status + request.responseText);
                }
            });
        }

        /*]]>*/
    </script>
</head>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <!-- Small boxes (Stat box) -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="card card-default">
                            <div class="card-header">
                                <h3 class="card-title">Information of device</h3>
                            </div>
                            <div class="card-body p-2">
                                <div class="bs-stepper linear">
                                    <div class="bs-stepper-header" role="tablist">
                                        <div class="step active" data-target="#test-l-1">
                                            <button type="button" class="step-trigger" role="tab" id="stepper1trigger1"
                                                    aria-controls="test-l-1" aria-selected="true">
                                                <span class="bs-stepper-circle">1</span>
                                                <span class="bs-stepper-label">Management information</span>
                                            </button>
                                        </div>
                                        <div class="bs-stepper-line"></div>
                                        <div class="step" data-target="#test-l-2">
                                            <button type="button" class="step-trigger" role="tab" id="stepper1trigger2"

                                                <span class="bs-stepper-circle">2</span>
                                                <span class="bs-stepper-label">Group location</span>
                                            </button>
                                        </div>
                                        <div class="bs-stepper-line"></div>

                                            <button type="button" class="step-trigger" role="tab" id="stepper1trigger3"

                                        </div>

                                            </button>

                                    </div>

                                                 aria-labelledby="stepper1trigger1">

                                                <div class="form-group">

                                                </div>

                                                    <select class="custom-select form-control-border" id="enabled">
                                                        <option value="1">Enabled</option>
                                                        <option value="0">Disabled</option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label for="log">Packet log</label>
                                                    <select class="custom-select form-control-border" id="log">
                                                        <option value="1">Enabled</option>
                                                        <option value="0" selected="selected">Disabled</option>
                                                    </select>
                                                </div>
                                                <button class="btn btn-primary" onclick="validatePanel1()">Next</button>
                                            </div>
                                            <div id="test-l-2" role="tabpanel" class="bs-stepper-pane"
                                                 aria-labelledby="stepper1trigger2">

                                                </button>

                                            <div id="test-l-3" role="tabpanel" class="bs-stepper-pane"

                                            <div id="test-l-4" role="tabpanel" class="bs-stepper-pane"
                                                 aria-labelledby="stepper1trigger4">
                                                <div id="formGeneric" style="display: none">
                                                    <div class="form-group">
                                                        <label for="rxJson">Packet parser descriptor(RX for device)</label>

                                                        <div id="txJson"></div>
                                                    </div>

                                                </div>
                                                <div id="formModbus" style="display: none">
                                                    <div class="form-group">
                                                        <label for="uid">Unit ID</label>
                                                        <input type="number" class="form-control form-control-border"
                                                               id="uid" placeholder="Unit ID for modbus device" oninput="this.value|=0">
                                                    </div>
                                                    <div class="form-group">
                                                        <label for="packetType">Packet Type</label>
                                                        <select class="custom-select form-control-border"
                                                                id="packetType">
                                                            <option value="0">Modbus-RTU</option>
                                                            <option value="1">Modbus-TCP</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div id="formLSISXGT" style="display: none">
                                                    <div class="form-group">
