<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS — Batch Add Errors</title>

    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../../css/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/tabulator/css/tabulator_bootstrap4.min.css">
    <link rel="stylesheet" href="../../plugins/bootstrap-slider/css/bootstrap-slider.min.css">

    <style>
        html, body { overflow: hidden; height: 100vh; margin: 0; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; min-height: 100vh; overflow: hidden; }
        .main-header, .main-footer { flex-shrink: 0; }
        .content-wrapper { flex: 1 1 auto; min-height: 0 !important; overflow: hidden; display: flex; flex-direction: column; }
        .content-wrapper > section.content { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0; }
        .batch-root { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; min-height: 0; }
        .batch-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .batch-panes {
            flex: 1 1 auto; min-height: 0; display: grid; gap: 10px;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }
        @media (orientation: landscape) {
            .batch-panes {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
                grid-template-rows: 1fr;
            }
        }
        .batch-pane { background:#fff; border:1px solid #dee2e6; border-radius:4px; display:flex; flex-direction:column; overflow:hidden; min-height:0; min-width:0; }
        .batch-pane-header { padding:8px 12px; border-bottom:1px solid #dee2e6; background:#f8f9fa; font-weight:600; display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
        .batch-pane-body { flex:1 1 auto; min-height:0; overflow:auto; padding:10px; }
        .batch-pane-body.no-pad { padding: 0; }
        .cts-tabulator { height: 100%; }
        .detail-form .form-group { margin-bottom: .65rem; }
        .detail-form label { font-weight: 600; margin-bottom: .15rem; font-size: .85rem; color:#495057; }
        .detail-form input, .detail-form select, .detail-form textarea { font-size: .9rem; }
        .detail-form .slider-row { display: flex; align-items: baseline; justify-content: space-between; }
        .detail-form .slider-val { font-weight: 600; font-size: .85rem; color: #007bff; }
        .detail-form .slider-wrap { padding: 2px 6px 0 6px; }
        .detail-form .slider-wrap .slider { width: 100% !important; }
        .detail-form .hint { font-size: .75rem; color: #6c757d; }
        .error-chip { color:#dc3545; font-size:.8rem; white-space: normal; word-break: break-word; }
        .ok-chip { color:#28a745; font-size:.8rem; }
        .row-error { background-color: #fdecea !important; }
        .status-bar { font-size: .85rem; color:#6c757d; }
        .tabulator .tabulator-cell.status-cell { padding-left:2px; padding-right:2px; text-overflow:clip; overflow:visible; }

        #busyOverlay { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
        #busyOverlay.show { display:flex; }
        #busyOverlay .busy-box { background:#fff; border-radius:6px; padding:24px 32px; display:flex; flex-direction:column; align-items:center; gap:12px; box-shadow:0 4px 24px rgba(0,0,0,.3); min-width:260px; }
        #busyOverlay .spinner { width:42px; height:42px; border-radius:50%; border:4px solid #e9ecef; border-top-color:#007bff; animation: busySpin .8s linear infinite; }
        @keyframes busySpin { to { transform: rotate(360deg); } }
        #busyOverlay .busy-text { font-weight:600; color:#495057; }
        #busyOverlay .busy-sub { font-size:.8rem; color:#6c757d; }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const DEVICE_ID   = /*[[${device.id}]]*/ 0;
        const DEVICE_NAME = /*[[${device.name}]]*/ '';
        const DEVICE_PROTOCOL = /*[[${device.protocol}]]*/ '';
        const SESSION_KEY = 'batchAddErrors';

        const MODES = ['DISCARD', 'TIMEOUT', 'GARBAGE', 'DISCONNECT', 'SIMULATION'];

        const FREQ_MIN = 0, FREQ_MAX = 100;
        const INTERVAL_MIN = 1, INTERVAL_MAX = 3600;
        const DURATION_MIN = 1, DURATION_MAX = 300;
        const TIMEOUT_MIN = 0, TIMEOUT_MAX = 10;
        const GARBAGE_MIN = 1, GARBAGE_MAX = 1024;
        const STOP_MIN = 0, STOP_MAX = 60;

        let errsTable;
        // 각 행: {mode, frequency, interval, errorDuration, enabled,
        //        timeout, garbageLength, simulationName, errorValue, simulation_stop, _rid, error}
        let errors = [];
        let simulations = [];        // 이 device 의 Value Simulation 목록 (SIMULATION mode 참조)
        let selectedRid = null;
        let ridSeq = 1;

        function newRid() { return 'r' + (ridSeq++); }
        function errByRid(rid) { return rid ? errors.find(e => e._rid === rid) : null; }
        function selectedErr() { return errByRid(selectedRid); }

        // ── 검증 ───────────────────────────────────────────────
        function blank(v) { return v === null || v === undefined || String(v).trim() === ''; }
        function num(v) {
            if (typeof v === 'number') return isFinite(v) ? v : null;
            if (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v))) return Number(v);
            return null;
        }

        function clamp(v, lo, hi, fallback) {
            if (v === null || v === undefined) return fallback;
            return Math.min(hi, Math.max(lo, Math.round(v)));
        }

        /** 모드별 required 필드. 서버 검증(/api/error/batchValidate)과 같은 규칙.
         *  에러마다 독립 스케줄로 자기 interval 마다 Bernoulli 시행 — 합계 100 캡은 두지 않는다. */
        function validateRow(e) {
            if (blank(e.mode)) return 'Missing mode.';
            let mode = String(e.mode).toUpperCase();
            if (MODES.indexOf(mode) < 0) return 'Invalid mode: ' + e.mode;

            let f = num(e.frequency);
            if (f === null) return 'frequency must be a number.';
            if (f < 0 || f > 100) return 'frequency must be 0~100.';

            let interval = num(e.interval);
            if (interval === null) return 'interval must be a number.';
            if (interval < INTERVAL_MIN) return 'interval must be >= ' + INTERVAL_MIN + '.';

            // SIMULATION 모드는 자체 target 쓰기 제어로 동작 — errorDuration 미사용.
            if (mode !== 'SIMULATION') {
                let d = num(e.errorDuration);
                if (d === null) return 'errorDuration must be a number.';
                if (d < DURATION_MIN) return 'errorDuration must be >= ' + DURATION_MIN + '.';
            }

            if (mode === 'TIMEOUT') {
                let t = num(e.timeout);
                if (t === null) return 'TIMEOUT requires numeric timeout.';
                if (t < TIMEOUT_MIN || t > TIMEOUT_MAX) {
                    return 'timeout must be ' + TIMEOUT_MIN + '~' + TIMEOUT_MAX + '.';
                }
            } else if (mode === 'GARBAGE') {
                let g = num(e.garbageLength);
                if (g === null) return 'GARBAGE requires numeric garbageLength.';
                if (g < GARBAGE_MIN || g > GARBAGE_MAX) {
                    return 'garbageLength must be ' + GARBAGE_MIN + '~' + GARBAGE_MAX + '.';
                }
            } else if (mode === 'SIMULATION') {
                if (blank(e.simulationName)) return 'SIMULATION requires simulationName.';
                let sim = simulations.find(s => s.name === String(e.simulationName));
                if (!sim) return "SIMULATION target '" + e.simulationName + "' not found on this device.";
                if (num(e.errorValue) === null) return 'SIMULATION requires numeric errorValue.';
                // simulation_stop 은 DB protocol 에선 쓰이지 않지만 그 외엔 숫자여야 한다
                if (DEVICE_PROTOCOL !== 'DB') {
                    let st = num(e.simulation_stop);
                    if (st === null) return 'SIMULATION requires numeric simulation_stop.';
                    if (st < STOP_MIN || st > STOP_MAX) {
                        return 'simulation_stop must be ' + STOP_MIN + '~' + STOP_MAX + '.';
                    }
                }
            }

            return null;
        }

        function validateAll() {
            errors.forEach(function (e) { e.error = validateRow(e); });
        }

        function errorCount() {
            let n = 0;
            errors.forEach(e => { if (e.error) n++; });
            return n;
        }

        function updateStatus() {
            let ok = errors.filter(e => !e.error).length;
            let errs = errorCount();
            let txt = 'Errors: ' + ok + '/' + errors.length + '   (device: ' + DEVICE_NAME + ')';
            if (errs > 0) {
                $('#statusLine').html('<span class="text-danger font-weight-bold">' + errs + ' error(s)</span> &nbsp; ' + txt);
            } else {
                $('#statusLine').text(txt);
            }
            $('#registerBtn').prop('disabled', errs > 0 || errors.length === 0);
        }

        function revalidate() {
            validateAll();
            if (errsTable) errsTable.replaceData(errors);
            updateDetailAlert();
            updateStatus();
        }

        function stripRow(e) {
            let o = { ...e };
            delete o._rid;
            delete o.error;
            return o;
        }

        // ── 테이블 / 상세 ─────────────────────────────────────────
        function initErrsTable() {
            if (errsTable) { errsTable.destroy(); }
            errsTable = new Tabulator('#errsTable', {
                data: errors,
                layout: 'fitColumns',
                height: '100%',
                index: '_rid',
                selectableRows: 1,
                columnDefaults: { resizable: false },
                rowFormatter: function (row) {
                    if (row.getData().error) row.getElement().classList.add('row-error');
                    else row.getElement().classList.remove('row-error');
                },
                columns: [
                    { title:'Mode', field:'mode', minWidth: 110,
                      tooltip: function (e, cell) { return cell.getRow().getData().error || cell.getValue(); } },
                    { title:'Freq(%)', field:'frequency', width: 90, hozAlign:'center' },
                    { title:'Interval', field:'interval', width: 90, hozAlign:'center' },
                    { title:'', field:'error', width: 56, hozAlign:'center', headerSort:false,
                      cssClass:'status-cell',
                      tooltip: function (e, cell) { return cell.getValue() || 'ok'; },
                      formatter: function (cell) {
                        return cell.getValue()
                            ? '<i class="fas fa-exclamation-triangle text-danger"></i>'
                            : '<i class="fas fa-check text-success"></i>';
                      } }
                ]
            });
            errsTable.on('rowClick', function (e, row) {
                selectedRid = row.getData()._rid;
                renderDetail();
            });
        }

        function renderDetail() {
            let e = selectedErr();
            let $f = $('#detailForm');
            if (!e) { $f.html('<div class="text-muted">Select an error from the list.</div>'); return; }

            let mode = String(e.mode || 'DISCARD').toUpperCase();
            if (MODES.indexOf(mode) < 0) mode = 'DISCARD';
            let frequency = clamp(num(e.frequency), FREQ_MIN, FREQ_MAX, 10);
            let interval = clamp(num(e.interval), INTERVAL_MIN, INTERVAL_MAX, 10);
            let errorDuration = clamp(num(e.errorDuration), DURATION_MIN, DURATION_MAX, 30);
            let timeout = clamp(num(e.timeout), TIMEOUT_MIN, TIMEOUT_MAX, 4);
            let garbageLength = clamp(num(e.garbageLength), GARBAGE_MIN, GARBAGE_MAX, 36);
            let simulation_stop = clamp(num(e.simulation_stop), STOP_MIN, STOP_MAX, 10);

            let simOpts = [{v:'', t:'(select)'}].concat(simulations.map(s => ({v:s.name, t:s.name + ' (' + s.target + ')'})));

            $f.html(''
                + '<div id="detailAlert">' + detailAlertHtml(e) + '</div>'
                + fieldSelect('Error mode', 'd_mode', MODES.map(x => ({v:x, t:x})), mode)
                + fieldSelect('Initial state', 'd_enabled',
                        [{v:'1', t:'Enabled'}, {v:'0', t:'Disabled'}], String(e.enabled === 1 ? 1 : 0))
                + fieldSlider('Frequency', 'd_freq', FREQ_MIN, FREQ_MAX, 1, frequency, '%')
                + fieldSlider('Interval', 'd_interval', INTERVAL_MIN, INTERVAL_MAX, 1, interval, 's',
                        'Probability check period')
                + '<div class="form-group" id="d_duration_wrap">'
                +   fieldSliderInline('Error duration', 'd_duration', DURATION_MIN, DURATION_MAX, 1, errorDuration, 's',
                        'How long the error lasts')
                + '</div>'
                + '<div class="form-group" id="d_timeout_wrap">'
                +   fieldSliderInline('Timeout', 'd_timeout', TIMEOUT_MIN, TIMEOUT_MAX, 1, timeout, 's')
                + '</div>'
                + '<div class="form-group" id="d_garbage_wrap">'
                +   fieldSliderInline('Garbage length', 'd_garbage', GARBAGE_MIN, GARBAGE_MAX, 1, garbageLength, 'B')
                + '</div>'
                + '<div class="form-group" id="d_simulation_wrap">'
                +   fieldSelectInline('Value simulation', 'd_simname', simOpts, e.simulationName || '')
                + '</div>'
                + '<div class="form-group" id="d_errorvalue_wrap">'
                +   '<label>Error value</label>'
                +   '<input id="d_errorvalue" class="form-control" type="number" step="any" value="' + escapeAttr(e.errorValue) + '"/>'
                + '</div>'
                + '<div class="form-group" id="d_stop_wrap">'
                +   fieldSliderInline('Simulation stop', 'd_stop', STOP_MIN, STOP_MAX, 1, simulation_stop, 's')
                + '</div>'
            );
            $f.data('rid', e._rid);

            bindSlider('d_freq', applyDetail);
            bindSlider('d_interval', applyDetail);
            bindSlider('d_duration', applyDetail);
            bindSlider('d_timeout', applyDetail);
            bindSlider('d_garbage', applyDetail);
            bindSlider('d_stop', applyDetail);

            applyModeVisibility();
            $f.find('input, select').on('input change', applyDetail);
            $('#d_mode').on('change', applyModeVisibility);
        }

        function bindSlider(id, onChange) {
            let $el = $('#' + id);
            if ($el.length === 0) return;
            $el.bootstrapSlider({ tooltip: 'hide' });
            let paint = function (v) { $('#' + id + '_val').text(v); };
            paint($el.bootstrapSlider('getValue'));
            $el.on('slide change', function (ev) {
                let v = (ev.value && ev.value.newValue !== undefined) ? ev.value.newValue : ev.value;
                if (v === undefined) v = $el.bootstrapSlider('getValue');
                paint(v);
                onChange();
            });
        }

        function sliderValue(id, fallback) {
            let $el = $('#' + id);
            if ($el.length === 0) return fallback;
            let v;
            try { v = $el.bootstrapSlider('getValue'); }
            catch (ex) { v = num($el.val()); }
            if (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) return fallback;
            return Math.round(v);
        }

        function applyModeVisibility() {
            let mode = $('#d_mode').val();
            let isSimulation = mode === 'SIMULATION';
            let isTimeout = mode === 'TIMEOUT';
            let isGarbage = mode === 'GARBAGE';

            $('#d_duration_wrap').toggle(!isSimulation);
            $('#d_timeout_wrap').toggle(isTimeout);
            $('#d_garbage_wrap').toggle(isGarbage);
            $('#d_simulation_wrap').toggle(isSimulation);
            $('#d_errorvalue_wrap').toggle(isSimulation);
            $('#d_stop_wrap').toggle(isSimulation && DEVICE_PROTOCOL !== 'DB');
        }

        function detailAlertHtml(e) {
            return e.error
                ? '<div class="alert alert-danger py-2 px-3 mb-2" style="font-size:.85rem;">'
                    + '<i class="fas fa-exclamation-triangle mr-1"></i>' + escapeHtml(e.error) + '</div>'
                : '<div class="alert alert-success py-2 px-3 mb-2" style="font-size:.85rem;">'
                    + '<i class="fas fa-check mr-1"></i>Valid</div>';
        }

        function updateDetailAlert() {
            let e = selectedErr();
            let $a = $('#detailAlert');
            if (!e || $a.length === 0) return;
            $a.html(detailAlertHtml(e));
        }

        function applyDetail() {
            let e = errByRid($('#detailForm').data('rid'));
            if (!e) return;
            e.mode = $('#d_mode').val();
            e.enabled = parseInt($('#d_enabled').val(), 10);
            e.frequency = sliderValue('d_freq', e.frequency);
            e.interval = sliderValue('d_interval', e.interval);

            // Mode 에 해당하는 필드만 남긴다 (숨겨진 쪽 값이 payload 에 섞이지 않게)
            let mode = e.mode;
            if (mode === 'SIMULATION') {
                delete e.errorDuration;
                delete e.timeout;
                delete e.garbageLength;
                e.simulationName = $('#d_simname').val();
                let v = $('#d_errorvalue').val();
                e.errorValue = v === '' ? null : Number(v);
                e.simulation_stop = sliderValue('d_stop', e.simulation_stop);
            } else {
                e.errorDuration = sliderValue('d_duration', e.errorDuration);
                delete e.simulationName;
                delete e.errorValue;
                delete e.simulation_stop;
                if (mode === 'TIMEOUT') {
                    e.timeout = sliderValue('d_timeout', e.timeout);
                    delete e.garbageLength;
                } else if (mode === 'GARBAGE') {
                    e.garbageLength = sliderValue('d_garbage', e.garbageLength);
                    delete e.timeout;
                } else {
                    delete e.timeout;
                    delete e.garbageLength;
                }
            }
            revalidate();
        }

        function fieldSelect(label, id, options, selected) {
            let opts = options.map(o =>
                '<option value="' + escapeAttr(o.v) + '"'
                + (String(o.v) === String(selected === undefined || selected === null ? '' : selected) ? ' selected' : '')
                + '>' + escapeHtml(o.t) + '</option>').join('');
            return '<div class="form-group"><label>' + label + '</label>'
                + '<select id="' + id + '" class="custom-select form-control">' + opts + '</select></div>';
        }
        function fieldSelectInline(label, id, options, selected) {
            // form-group wrapper 를 바깥에서 걸어 주는 경우용 (visibility toggle 과 결합)
            let opts = options.map(o =>
                '<option value="' + escapeAttr(o.v) + '"'
                + (String(o.v) === String(selected === undefined || selected === null ? '' : selected) ? ' selected' : '')
                + '>' + escapeHtml(o.t) + '</option>').join('');
            return '<label>' + label + '</label>'
                + '<select id="' + id + '" class="custom-select form-control">' + opts + '</select>';
        }

        function fieldSlider(label, id, min, max, step, value, unit, hint) {
            return '<div class="form-group">' + sliderBody(label, id, min, max, step, value, unit, hint) + '</div>';
        }
        function fieldSliderInline(label, id, min, max, step, value, unit, hint) {
            return sliderBody(label, id, min, max, step, value, unit, hint);
        }
        function sliderBody(label, id, min, max, step, value, unit, hint) {
            return '<div class="slider-row">'
                +   '<label>' + label + '</label>'
                +   '<span class="slider-val"><span id="' + id + '_val">' + value + '</span>' + (unit || '') + '</span>'
                + '</div>'
                + (hint ? '<div class="hint mb-1">' + hint + '</div>' : '')
                + '<div class="slider-wrap slider-green">'
                +   '<input id="' + id + '" type="text" data-slider-id="' + id + '_ui"'
                +   ' data-slider-min="' + min + '" data-slider-max="' + max + '"'
                +   ' data-slider-step="' + step + '" data-slider-value="' + value + '"/>'
                + '</div>';
        }
        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }
        function escapeAttr(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/"/g, '&quot;');
        }

        // ── 로드 / 업로드 / 등록 ─────────────────────────────────
        function load() {
            let raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return;
            try {
                let parsed = JSON.parse(raw);
                errors = (parsed.errors || []).map(r => ({ ...normalizeSheetRow(r), _rid: newRid(), error: null }));
            } catch (ex) {
                console.error(ex);
                alert('Failed to load batch data.');
            }
        }

        /** 템플릿 열 이름을 Error 모델 필드명으로 정규화한다. 숫자 열은 숫자로 캐스팅한다. */
        function normalizeSheetRow(r) {
            let out = {
                mode: r.mode !== undefined ? String(r.mode).toUpperCase() : null,
                frequency: num(r.frequency),
                interval: num(r.interval),
                errorDuration: num(r.errorDuration),
                enabled: num(r.enabled),
                timeout: num(r.timeout),
                garbageLength: num(r.garbageLength),
                simulationName: r.simulationName !== undefined && r.simulationName !== null
                        && String(r.simulationName).trim() !== ''
                        ? String(r.simulationName) : null,
                errorValue: num(r.errorValue),
                simulation_stop: num(r.simulation_stop)
            };
            // enabled 가 비어 있으면 Enabled(1) 를 기본으로 — Simulation 쪽과 동일 UX
            if (out.enabled === null) out.enabled = 1;
            return out;
        }

        function fetchSimulations() {
            return $.ajax({ url: '/api/simulation/simulations/' + DEVICE_ID, type: 'GET' })
                .done(function (res) { simulations = res || []; })
                .fail(function (xhr) {
                    alert('Failed to load simulations (' + xhr.status + '). '
                        + 'SIMULATION mode checks will not work.');
                });
        }

        function onLoadFile(ev) {
            let file = ev.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function () {
                let wb = XLSX.read(reader.result, { type: 'binary' });
                let sheet = wb.SheetNames[0];
                let rows = sheet ? XLSX.utils.sheet_to_json(wb.Sheets[sheet]) : [];
                errors = rows.map(r => ({ ...normalizeSheetRow(r), _rid: newRid(), error: null }));
                validateAll();
                selectedRid = errors.length ? errors[0]._rid : null;
                initErrsTable();
                renderDetail();
                updateStatus();
            };
            reader.readAsBinaryString(file);
            $('#excelFile').val('');
        }

        let inserting = false;
        function setBusy(on, text) {
            inserting = on;
            if (text) $('#busyText').text(text);
            $('#busyOverlay').toggleClass('show', on);
        }
        window.addEventListener('beforeunload', function (ev) {
            if (!inserting) return;
            ev.preventDefault();
            ev.returnValue = '';
            return '';
        });

        function doRegister() {
            validateAll();
            if (errorCount() > 0) {
                revalidate();
                alert('Resolve errors first.');
                return;
            }
            if (!confirm('Register ' + errors.length + ' error(s) to ' + DEVICE_NAME + '?')) return;
            $('#registerBtn').prop('disabled', true);
            setBusy(true, 'Registering ' + errors.length + ' error(s)…');
            $.ajax({
                url: '/api/error/batchInsert',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ deviceId: DEVICE_ID, errors: errors.map(stripRow) }),
                success: function (res) {
                    let failures = res.failures || [];
                    setBusy(false);
                    if (failures.length > 0) {
                        alert('Completed with ' + failures.length + ' failure(s):\n\n' + failures.slice(0, 30).join('\n'));
                    }
                    sessionStorage.removeItem(SESSION_KEY);
                    location.href = '/errors?device=' + DEVICE_ID;
                },
                error: function (xhr) {
                    setBusy(false);
                    alert('Insert failed: ' + xhr.status + ' ' + xhr.responseText);
                    $('#registerBtn').prop('disabled', false);
                }
            });
        }

        function doCancel() {
            if (errors.length === 0 || confirm('Discard uploaded data and go back?')) {
                sessionStorage.removeItem(SESSION_KEY);
                location.href = '/errors?device=' + DEVICE_ID;
            }
        }

        function batchInit() {
            load();
            $('#excelFile').on('change', onLoadFile);
            $('#chooseBtn').on('click', function () { $('#excelFile').click(); });
            $('#registerBtn').on('click', doRegister);
            $('#cancelBtn').on('click', doCancel);

            $('#statusLine').text('Loading existing data…');
            fetchSimulations().always(function () {
                if (errors.length === 0) {
                    $('#detailForm').html('<div class="text-muted">No data loaded. Choose an Excel file to begin.</div>');
                    updateStatus();
                    return;
                }
                validateAll();
                selectedRid = errors[0]._rid;
                initErrsTable();
                renderDetail();
                updateStatus();
            });
        }
        /*]]>*/
    </script>
</head>
