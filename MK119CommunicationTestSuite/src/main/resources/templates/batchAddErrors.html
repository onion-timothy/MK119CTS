<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <title>MK119 CTS — Batch Add Errors</title>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/plugins/tabulator/css/tabulator_bootstrap5.min.css">
    <link rel="stylesheet" href="/css/cts-table.css">
    <link rel="stylesheet" href="/css/cts-batch.css">
    <style>
        /* 가로로 길면 좌(목록) · 우(상세), 세로로 길면 위아래 */
        .cts-batch-panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); }
        @media (orientation: landscape) {
            .cts-batch-panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: minmax(0, 1fr); }
        }
        /* 설정이 없는 모드(Discard·Disconnect)에서는 그렇다고 적는다 (error_editor 와 같다) */
        .ed-mode-none { color: var(--tblr-secondary); font-size: .8rem; font-style: italic; }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const DEVICE_ID   = /*[[${device.id}]]*/ 0;
        const DEVICE_NAME = /*[[${device.name}]]*/ '';
        const DEVICE_PROTOCOL = /*[[${device.protocol}]]*/ '';
        const SESSION_KEY = 'batchAddErrors';

        const MODES = ['DISCARD', 'TIMEOUT', 'GARBAGE', 'DISCONNECT', 'SIMULATION'];

        /** 각 모드가 실제로 하는 일. error_editor 의 MODE_INFO 와 같은 글이다 */
        const MODE_INFO = {
            DISCARD:    { name: 'Discard',
                          text: 'Drops the reply. The client gets no response, and the connection stays open.' },
            TIMEOUT:    { name: 'Timeout',
                          text: 'Holds the reply for the timeout below, then sends it as usual.' },
            GARBAGE:    { name: 'Garbage',
                          text: 'Replaces the reply with random bytes.' },
            DISCONNECT: { name: 'Disconnect',
                          text: 'Drops the reply and closes the connection.' },
            SIMULATION: { name: 'Simulation',
                          text: 'Overwrites one value simulation with the error value while the error is active.' },
        };

        const FREQ_MIN = 0, FREQ_MAX = 100;
        const INTERVAL_MIN = 1;
        const DURATION_MIN = 1, DURATION_MAX = 300;
        const TIMEOUT_MIN = 0, TIMEOUT_MAX = 10;
        const GARBAGE_MIN = 1, GARBAGE_MAX = 1024;
        const STOP_MIN = 0, STOP_MAX = 60;

        let errsTable;
        // 각 행: {mode, frequency, interval, errorDuration, enabled,
        //        timeout, garbageLength, simulationName, errorValue, simulation_stop, _rid, error}
        let errors = [];
        let simulations = [];        // 이 device 의 Value Simulation 목록 (SIMULATION mode 참조)
        let selectedRid = null;
        let ridSeq = 1;

        function newRid() { return 'r' + (ridSeq++); }
        function errByRid(rid) { return rid ? errors.find(e => e._rid === rid) : null; }
        function selectedErr() { return errByRid(selectedRid); }

        // ── 검증 ───────────────────────────────────────────────
        function blank(v) { return v === null || v === undefined || String(v).trim() === ''; }
        function num(v) {
            if (typeof v === 'number') return isFinite(v) ? v : null;
            if (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v))) return Number(v);
            return null;
        }

        function clamp(v, lo, hi, fallback) {
            if (v === null || v === undefined) return fallback;
            return Math.min(hi, Math.max(lo, Math.round(v)));
        }

        /** 모드별 required 필드. 서버 검증(/api/error/batchValidate)과 같은 규칙.
         *  에러마다 독립 스케줄로 자기 interval 마다 Bernoulli 시행 — 합계 100 캡은 두지 않는다. */
        function validateRow(e) {
            if (blank(e.mode)) return 'Missing mode.';
            let mode = String(e.mode).toUpperCase();
            if (MODES.indexOf(mode) < 0) return 'Invalid mode: ' + e.mode;

            let f = num(e.frequency);
            if (f === null) return 'frequency must be a number.';
            if (f < 0 || f > 100) return 'frequency must be 0~100.';

            let interval = num(e.interval);
            if (interval === null) return 'interval must be a number.';
            if (interval < INTERVAL_MIN) return 'interval must be >= ' + INTERVAL_MIN + '.';

            // SIMULATION 모드는 자체 target 쓰기 제어로 동작 — errorDuration 미사용.
            if (mode !== 'SIMULATION') {
                let d = num(e.errorDuration);
                if (d === null) return 'errorDuration must be a number.';
                if (d < DURATION_MIN) return 'errorDuration must be >= ' + DURATION_MIN + '.';
            }

            if (mode === 'TIMEOUT') {
                let t = num(e.timeout);
                if (t === null) return 'TIMEOUT requires numeric timeout.';
                if (t < TIMEOUT_MIN || t > TIMEOUT_MAX) {
                    return 'timeout must be ' + TIMEOUT_MIN + '~' + TIMEOUT_MAX + '.';
                }
            } else if (mode === 'GARBAGE') {
                let g = num(e.garbageLength);
                if (g === null) return 'GARBAGE requires numeric garbageLength.';
                if (g < GARBAGE_MIN || g > GARBAGE_MAX) {
                    return 'garbageLength must be ' + GARBAGE_MIN + '~' + GARBAGE_MAX + '.';
                }
            } else if (mode === 'SIMULATION') {
                if (blank(e.simulationName)) return 'SIMULATION requires simulationName.';
                let sim = simulations.find(s => s.name === String(e.simulationName));
                if (!sim) return "SIMULATION target '" + e.simulationName + "' not found on this device.";
                if (num(e.errorValue) === null) return 'SIMULATION requires numeric errorValue.';
                // simulation_stop 은 DB protocol 에선 쓰이지 않지만 그 외엔 숫자여야 한다
                if (DEVICE_PROTOCOL !== 'DB') {
                    let st = num(e.simulation_stop);
                    if (st === null) return 'SIMULATION requires numeric simulation_stop.';
                    if (st < STOP_MIN || st > STOP_MAX) {
                        return 'simulation_stop must be ' + STOP_MIN + '~' + STOP_MAX + '.';
                    }
                }
            }

            return null;
        }

        function validateAll() {
            errors.forEach(function (e) { e.error = validateRow(e); });
        }

        function errorCount() {
            let n = 0;
            errors.forEach(e => { if (e.error) n++; });
            return n;
        }

        function updateStatus() {
            let ok = errors.filter(e => !e.error).length;
            let errs = errorCount();
            $('#statusLine').attr('class', 'cts-batch-status' + (errs > 0 ? ' bad' : ''))
                .text((errs > 0 ? errs + ' error(s) · ' : '') + 'Errors: ' + ok + '/' + errors.length);
            $('#registerBtn').prop('disabled', errs > 0 || errors.length === 0);
        }

        function revalidate() {
            validateAll();
            if (errsTable) errsTable.replaceData(errors);
            updateDetailAlert();
            updateStatus();
        }

        function stripRow(e) {
            let o = { ...e };
            delete o._rid;
            delete o.error;
            return o;
        }

        // ── 테이블 / 상세 ─────────────────────────────────────────
        // 기준 행 높이. 실제 높이는 CtsTable 이 표 높이를 나눠떨어지게 조금 늘린다
        const ROW_H = 36;

        function initErrsTable() {
            if (errsTable) { errsTable.destroy(); }
            errsTable = new Tabulator('#errsTable', {
                data: errors,
                layout: 'fitData',
                height: '100%',
                renderVertical: 'basic',
                pagination: true,
                paginationSize: 10,
                paginationButtonCount: 3,
                index: '_rid',
                selectableRows: 1,
                rowFormatter: function (row) {
                    if (row.getData().error) row.getElement().classList.add('row-error');
                    else row.getElement().classList.remove('row-error');
                },
                columns: CtsTable.columns([
                    { title:'Mode', field:'mode', kind: 'text',
                      tooltip: function (e, cell) { return cell.getRow().getData().error || cell.getValue(); } },
                    { title:'Freq(%)', field:'frequency', kind: 'number' },
                    { title:'Interval', field:'interval', kind: 'number' },
                    { title:'', field:'error', kind: 'action', width: 56, resizable: false, headerSort:false,
                      cssClass:'status-cell',
                      tooltip: function (e, cell) { return cell.getValue() || 'ok'; },
                      formatter: function (cell) {
                        return cell.getValue()
                            ? '<i class="fas fa-exclamation-triangle text-danger"></i>'
                            : '<i class="fas fa-check text-success"></i>';
                      } }
                ])
            });
            errsTable.on('rowClick', function (e, row) {
                selectedRid = row.getData()._rid;
                renderDetail();
            });
            CtsTable.attach(errsTable, { rowH: ROW_H });
        }

        /** 슬라이더 id → 값 옆에 붙는 단위 (error_editor 와 같다) */
        const SLIDERS = { d_freq: '%', d_duration: 's', d_timeout: 's', d_garbage: ' bytes', d_stop: 's' };

        function renderDetail() {
            let e = selectedErr();
            let $f = $('#detailForm');
            if (!e) { $f.html('<div class="cts-empty">Select an error from the list.</div>'); return; }

            let mode = String(e.mode || 'DISCARD').toUpperCase();
            if (MODES.indexOf(mode) < 0) mode = 'DISCARD';
            let frequency = clamp(num(e.frequency), FREQ_MIN, FREQ_MAX, 10);
            let errorDuration = clamp(num(e.errorDuration), DURATION_MIN, DURATION_MAX, 30);
            let timeout = clamp(num(e.timeout), TIMEOUT_MIN, TIMEOUT_MAX, 4);
            let garbageLength = clamp(num(e.garbageLength), GARBAGE_MIN, GARBAGE_MAX, 36);
            let simulation_stop = clamp(num(e.simulation_stop), STOP_MIN, STOP_MAX, 10);

            let simOpts = [{v: '', t: simulations.length ? 'Select a simulation' : 'No value simulation on this device'}]
                .concat(simulations.map(s => ({v: s.name, t: s.name + ' (' + s.target + ')'})));
            // 파일에 적힌 이름이 이 장비에 없으면 그대로 보여 준다 — 고르기 전까지 오류로 남는다
            if (e.simulationName && !simulations.some(s => s.name === e.simulationName)) {
                simOpts.push({v: e.simulationName, t: e.simulationName + ' (not on this device)'});
            }

            $f.html(''
                + '<div id="detailAlert">' + detailAlertHtml(e) + '</div>'
                + '<div class="row g-2 mb-3">'
                +   '<div class="col-7">' + selectHtml('Error mode', 'd_mode',
                        MODES.map(x => ({v: x, t: MODE_INFO[x].name})), mode) + '</div>'
                +   '<div class="col-5">' + selectHtml('Initial state', 'd_enabled',
                        [{v: '1', t: 'Enabled'}, {v: '0', t: 'Disabled'}], String(e.enabled === 1 ? 1 : 0)) + '</div>'
                + '</div>'
                + sliderHtml('Frequency', 'd_freq', FREQ_MIN, FREQ_MAX, frequency, 'var(--tblr-green)',
                        'Chance the error fires on each check.', 'mb-3')
                + '<div class="mb-3">'
                +   '<label class="form-label" for="d_interval">Interval</label>'
                +   '<input type="number" class="form-control" id="d_interval" min="1" step="1" placeholder="Seconds"'
                +   ' value="' + escapeAttr(e.interval) + '">'
                +   '<small class="form-hint">Seconds between chance checks.</small>'
                + '</div>'
                + sliderHtml('Duration', 'd_duration', DURATION_MIN, DURATION_MAX, errorDuration, 'var(--tblr-red)',
                        'Seconds the error lasts once it fires.', 'mb-1', 'd_duration_wrap')

                // 고른 모드에만 딸린 것
                + '<div class="detail-section" id="d_mode_name"></div>'
                + '<div class="alert alert-secondary detail-alert" id="d_mode_note"></div>'
                + '<div class="ed-mode-none" id="d_mode_empty">This mode has no settings of its own.</div>'
                + sliderHtml('Timeout', 'd_timeout', TIMEOUT_MIN, TIMEOUT_MAX, timeout, 'var(--tblr-red)',
                        'Seconds to hold the reply before sending it.', 'mb-1', 'd_timeout_wrap')
                + sliderHtml('Garbage length', 'd_garbage', GARBAGE_MIN, GARBAGE_MAX, garbageLength, 'var(--tblr-blue)',
                        'Random bytes sent in place of the reply.', 'mb-1', 'd_garbage_wrap')
                + '<div id="d_simulation_wrap">'
                +   '<div class="mb-3">' + selectHtml('Value simulation', 'd_simname', simOpts, e.simulationName || '')
                +     '<small class="form-hint">The simulation whose value gets overwritten.</small></div>'
                +   '<div class="mb-3">'
                +     '<label class="form-label" for="d_errorvalue">Error value</label>'
                +     '<input id="d_errorvalue" type="text" class="form-control" value="' + escapeAttr(e.errorValue) + '"'
                +     ' placeholder="Value written instead of the simulated one">'
                +   '</div>'
                +   sliderHtml('Stop simulation', 'd_stop', STOP_MIN, STOP_MAX, simulation_stop, 'var(--tblr-blue)',
                        'Seconds the simulation stays frozen. 0 never stops it.', 'mb-1', 'd_stop_wrap')
                + '</div>'
            );
            $f.data('rid', e._rid);

            CtsRange.bindAll(SLIDERS);
            applyModeVisibility();
            $f.find('input, select').on('input change', applyDetail);
            $('#d_mode').on('change', applyModeVisibility);
        }

        function applyModeVisibility() {
            let mode = $('#d_mode').val();
            let isSimulation = mode === 'SIMULATION';

            $('#d_mode_name').text(MODE_INFO[mode].name);
            $('#d_mode_note').text(MODE_INFO[mode].text);
            // SIMULATION 은 값을 덮어쓰는 동안이 곧 지속 시간이라 Duration 이 따로 없다
            $('#d_duration_wrap').toggle(!isSimulation);
            $('#d_mode_empty').toggle(mode === 'DISCARD' || mode === 'DISCONNECT');
            $('#d_timeout_wrap').toggle(mode === 'TIMEOUT');
            $('#d_garbage_wrap').toggle(mode === 'GARBAGE');
            $('#d_simulation_wrap').toggle(isSimulation);
            // DB 장비는 ServerData 없이 SQL 로 바로 쓰므로 멈춰 둘 대상이 없다
            $('#d_stop_wrap').toggle(isSimulation && DEVICE_PROTOCOL !== 'DB');
        }

        function detailAlertHtml(e) {
            return e.error
                ? '<div class="alert alert-danger detail-alert">'
                    + '<i class="fas fa-exclamation-triangle me-1"></i>' + escapeHtml(e.error) + '</div>'
                : '<div class="alert alert-success detail-alert">'
                    + '<i class="fas fa-check me-1"></i>Valid</div>';
        }

        function updateDetailAlert() {
            let e = selectedErr();
            let $a = $('#detailAlert');
            if (!e || $a.length === 0) return;
            $a.html(detailAlertHtml(e));
        }

        function applyDetail() {
            let e = errByRid($('#detailForm').data('rid'));
            if (!e) return;
            e.mode = $('#d_mode').val();
            e.enabled = parseInt($('#d_enabled').val(), 10);
            e.frequency = CtsRange.get('d_freq');
            // 비우거나 숫자가 아니면 그대로 두어 검증이 잡게 한다
            let iv = $('#d_interval').val();
            e.interval = iv === '' ? null : Number(iv);

            // Mode 에 해당하는 필드만 남긴다 (숨겨진 쪽 값이 payload 에 섞이지 않게)
            let mode = e.mode;
            if (mode === 'SIMULATION') {
                delete e.errorDuration;
                delete e.timeout;
                delete e.garbageLength;
                e.simulationName = $('#d_simname').val() || null;
                let v = $.trim($('#d_errorvalue').val());
                e.errorValue = v === '' ? null : Number(v);
                e.simulation_stop = CtsRange.get('d_stop');
            } else {
                e.errorDuration = CtsRange.get('d_duration');
                delete e.simulationName;
                delete e.errorValue;
                delete e.simulation_stop;
                if (mode === 'TIMEOUT') {
                    e.timeout = CtsRange.get('d_timeout');
                    delete e.garbageLength;
                } else if (mode === 'GARBAGE') {
                    e.garbageLength = CtsRange.get('d_garbage');
                    delete e.timeout;
                } else {
                    delete e.timeout;
                    delete e.garbageLength;
                }
            }
            revalidate();
        }

        /** options: [{v, t}] */
        function selectHtml(label, id, options, selected) {
            let opts = options.map(o =>
                '<option value="' + escapeAttr(o.v) + '"'
                + (String(o.v) === String(selected === undefined || selected === null ? '' : selected) ? ' selected' : '')
                + '>' + escapeHtml(o.t) + '</option>').join('');
            return '<label class="form-label" for="' + id + '">' + label + '</label>'
                + '<select id="' + id + '" class="form-select">' + opts + '</select>';
        }

        /** css/cts-tabler.css 의 .cts-range 슬라이더. 값 표시는 CtsRange 가 id + '-val' 에 채운다 */
        function sliderHtml(label, id, min, max, value, color, hint, cls, wrapId) {
            return '<div class="' + cls + '"' + (wrapId ? ' id="' + wrapId + '"' : '') + '>'
                + '<div class="cts-slider-row">'
                +   '<label class="form-label" for="' + id + '">' + label + '</label>'
                +   '<span class="cts-slider-val" id="' + id + '-val" style="--c: ' + color + '"></span>'
                + '</div>'
                + '<input type="range" class="cts-range" id="' + id + '" min="' + min + '" max="' + max + '"'
                + ' step="1" value="' + value + '" style="--c: ' + color + '">'
                + (hint ? '<small class="form-hint">' + hint + '</small>' : '')
                + '</div>';
        }
        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }
        function escapeAttr(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/"/g, '&quot;');
        }

        // ── 로드 / 업로드 / 등록 ─────────────────────────────────
        function load() {
            let raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return;
            try {
                let parsed = JSON.parse(raw);
                errors = (parsed.errors || []).map(r => ({ ...normalizeSheetRow(r), _rid: newRid(), error: null }));
            } catch (ex) {
                console.error(ex);
                alert('Failed to load batch data.');
            }
        }

        /** 템플릿 열 이름을 Error 모델 필드명으로 정규화한다. 숫자 열은 숫자로 캐스팅한다. */
        function normalizeSheetRow(r) {
            let out = {
                mode: r.mode !== undefined ? String(r.mode).toUpperCase() : null,
                frequency: num(r.frequency),
                interval: num(r.interval),
                errorDuration: num(r.errorDuration),
                enabled: num(r.enabled),
                timeout: num(r.timeout),
                garbageLength: num(r.garbageLength),
                simulationName: r.simulationName !== undefined && r.simulationName !== null
                        && String(r.simulationName).trim() !== ''
                        ? String(r.simulationName) : null,
                errorValue: num(r.errorValue),
                simulation_stop: num(r.simulation_stop)
            };
            // enabled 가 비어 있으면 Enabled(1) 를 기본으로 — Simulation 쪽과 동일 UX
            if (out.enabled === null) out.enabled = 1;
            return out;
        }

        function fetchSimulations() {
            return $.ajax({ url: '/api/simulation/simulations/' + DEVICE_ID, type: 'GET' })
                .done(function (res) { simulations = res || []; })
                .fail(function (xhr) {
                    alert('Failed to load simulations (' + xhr.status + '). '
                        + 'SIMULATION mode checks will not work.');
                });
        }

        function onLoadFile(ev) {
            let file = ev.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function () {
                let wb = XLSX.read(reader.result, { type: 'binary' });
                let sheet = wb.SheetNames[0];
                let rows = sheet ? XLSX.utils.sheet_to_json(wb.Sheets[sheet]) : [];
                errors = rows.map(r => ({ ...normalizeSheetRow(r), _rid: newRid(), error: null }));
                validateAll();
                selectedRid = errors.length ? errors[0]._rid : null;
                initErrsTable();
                renderDetail();
                updateStatus();
            };
            reader.readAsBinaryString(file);
            $('#excelFile').val('');
        }

        let inserting = false;
        function setBusy(on, text) {
            inserting = on;
            if (text) $('#busyText').text(text);
            $('#busyOverlay').toggleClass('show', on);
        }
        window.addEventListener('beforeunload', function (ev) {
            if (!inserting) return;
            ev.preventDefault();
            ev.returnValue = '';
            return '';
        });

        function doRegister() {
            validateAll();
            if (errorCount() > 0) {
                revalidate();
                alert('Resolve errors first.');
                return;
            }
            if (!confirm('Register ' + errors.length + ' error(s) to ' + DEVICE_NAME + '?')) return;
            $('#registerBtn').prop('disabled', true);
            setBusy(true, 'Registering ' + errors.length + ' error(s)…');
            $.ajax({
                url: '/api/error/batchInsert',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ deviceId: DEVICE_ID, errors: errors.map(stripRow) }),
                success: function (res) {
                    let failures = res.failures || [];
                    setBusy(false);
                    if (failures.length > 0) {
                        alert('Completed with ' + failures.length + ' failure(s):\n\n' + failures.slice(0, 30).join('\n'));
                    }
                    sessionStorage.removeItem(SESSION_KEY);
                    location.href = '/errors?device=' + DEVICE_ID;
                },
                error: function (xhr) {
                    setBusy(false);
                    alert('Insert failed: ' + xhr.status + ' ' + xhr.responseText);
                    $('#registerBtn').prop('disabled', false);
                }
            });
        }

        function doCancel() {
            if (errors.length === 0 || confirm('Discard uploaded data and go back?')) {
                sessionStorage.removeItem(SESSION_KEY);
                location.href = '/errors?device=' + DEVICE_ID;
            }
        }

        function batchInit() {
            $('#pageSubtitle').text(DEVICE_NAME + ' · ' + DEVICE_PROTOCOL);
            load();
            $('#excelFile').on('change', onLoadFile);
            $('#chooseBtn').on('click', function () { $('#excelFile').click(); });
            $('#registerBtn').on('click', doRegister);
            $('#cancelBtn').on('click', doCancel);

            $('#statusLine').text('Loading existing data…');
            fetchSimulations().always(function () {
                if (errors.length === 0) {
                    $('#detailForm').html('<div class="cts-empty">No data loaded. Choose an Excel file to begin.</div>');
                    updateStatus();
                    return;
                }
                validateAll();
                selectedRid = errors[0]._rid;
                initErrsTable();
                renderDetail();
                updateStatus();
            });
        }
        /*]]>*/
    </script>
</head>
<body>
<th:block th:replace="~{fragments/tabler :: busy-overlay}"></th:block>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('errors')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('Batch Add Errors', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list align-items-center">
            <span class="cts-batch-status" id="statusLine">No data loaded.</span>
            <button type="button" id="chooseBtn" class="btn btn-outline-secondary"><i class="fas fa-file-excel"></i> Choose Excel</button>
