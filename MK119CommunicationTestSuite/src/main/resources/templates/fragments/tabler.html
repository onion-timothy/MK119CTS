<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Tabler 화면이 공유하는 조각. 사이드바·제목줄·트리를 화면마다 복붙하던 것을 여기 하나로 모은다.

      <html lang="en" class="cts-fixed" data-bs-navbar-position="combined"
            xmlns:th="http://www.thymeleaf.org">
      <head>
          <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
          <title>...</title>
          <link rel="stylesheet" href="/css/cts-tabler.css">
      </head>
      <body>
      <div class="page">
          <th:block th:replace="~{fragments/tabler :: sidebar('errors')}"></th:block>
          <div class="page-wrapper">
              <th:block th:replace="~{fragments/tabler :: page-header('Error Simulations', ~{})}"></th:block>
              <div class="page-body"> ... </div>
          </div>
      </div>
      <th:block th:replace="~{fragments/tabler :: scripts}"></th:block>
      </body>

  조각 이름은 HTML 태그 이름과 겹치면 안 된다. `::head` 라고 쓰면 Thymeleaf 가
  th:fragment 가 아니라 <head> 태그에 걸려 <head> 가 통째로 중첩된다. 그래서 assets 다.

  html 의 data-bs-navbar-position="combined" 는 **빼면 안 된다**. Tabler 는 상단 바와 세로
  사이드바 중 하나만 쓰는 걸 기본으로 보고, 둘 다 있으면 사이드바를 지운다:
      html:not([data-bs-navbar-position=vertical]):not([data-bs-navbar-position=combined])
        .page:has(> [class*=navbar-expand]:not(.navbar-vertical)) > .navbar-vertical { display: none }
  combined 이 "둘 다 쓴다"는 선언이다.

  html 의 cts-fixed 는 선택이다 — 걸면 페이지가 스크롤하지 않고 칸 안에서만 스크롤한다.
  AdminLTE 화면과는 섞이지 않는다. Bootstrap 4 와 5 는 한 페이지에 같이 못 올라간다.
-->
<body>

<!-- 모든 Tabler 화면 -->
<th:block th:fragment="assets">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/plugins/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/css/cts-empty.css">
    <!-- 큰 화면 배율과 JS 좌표를 맞춘다 (cts-tabler.css 0절). 다른 스크립트보다 먼저 읽는다 -->
    <script src="/js/cts-zoom.js"></script>
</th:block>

<!-- 검색되는 select 가 필요한 화면만. 모양은 Tabler, 동작은 Tom Select 가 맡는다 -->
<th:block th:fragment="select-assets">
    <!-- 순서가 중요하다: 골격(tom-select) → Tabler 덮어쓰기 → 프로젝트 규칙 -->
    <link rel="stylesheet" href="/plugins/tom-select/css/tom-select.bootstrap5.min.css">
    <link rel="stylesheet" href="/plugins/tabler/css/tabler-vendors.min.css">
    <link rel="stylesheet" href="/css/cts-select.css">
</th:block>

<!-- 사이드바. position:fixed 라 뒤에 오는 형제(page-wrapper)가 폭만큼 밀린다.
     current 는 지금 보고 있는 메뉴 — devices / protocols / simulations / errors / testplans / settings -->
<aside th:fragment="sidebar(current)" class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
                aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle sidebar navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- 로고와 글자를 같이 두므로 navbar-brand 를 <a> 에 바로 건다.
             div 에 걸고 안쪽 a 에 내용을 두면 정렬 규칙이 a 를 통째로 한 덩어리로만 본다 -->
        <a class="navbar-brand navbar-brand-autodark" href="/">
            <img src="/img/icon_logo_1.png" alt="Onion Logo" class="navbar-brand-image">
            <span>MK119 CTS</span>
        </a>
        <div class="collapse navbar-collapse" id="sidebar-menu">
            <ul class="navbar-nav pt-lg-3">
                <li class="nav-item" th:classappend="${current == 'devices'} ? 'active'">
                    <a class="nav-link" href="/">
                        <span class="nav-link-icon"><i class="fas fa-table"></i></span>
                        <span class="nav-link-title">Devices</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${current == 'protocols'} ? 'active'">
                    <a class="nav-link" href="/protocols">
                        <span class="nav-link-icon"><i class="fas fa-file-code"></i></span>
                        <span class="nav-link-title">Protocol Definitions</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${current == 'simulations'} ? 'active'">
                    <a class="nav-link" href="/simulations">
                        <span class="nav-link-icon"><i class="fas fa-chart-area"></i></span>
                        <span class="nav-link-title">Value Simulations</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${current == 'errors'} ? 'active'">
                    <a class="nav-link" href="/errors">
                        <span class="nav-link-icon"><i class="fas fa-bomb"></i></span>
                        <span class="nav-link-title">Error Simulations</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${current == 'testplans'} ? 'active'">
                    <a class="nav-link" href="/testplans">
                        <span class="nav-link-icon"><i class="fas fa-tasks"></i></span>
                        <span class="nav-link-title">Test Plans</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${current == 'settings'} ? 'active'">
                    <a class="nav-link" href="/settings">
                        <span class="nav-link-icon"><i class="fas fa-sliders-h"></i></span>
                        <span class="nav-link-title">Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</aside>

<!--
  상단 바. 제목과 동작을 한 줄에 같이 둔다 — 제목만 있는 줄을 따로 두면 세로를 두 번 먹는다.
  사이드바 바로 뒤에 둬야 한다. Tabler 가 `.navbar-vertical ~ .navbar` 로 사이드바 폭만큼
  밀어 주기 때문이다.

  title 이 고정된 화면은 글자를 그대로 넘기고, 데이터에 따라 달라지는 화면은 '' 을 넘긴 뒤
  #pageTitle / #pageSubtitle 을 JS 로 채운다.

  actions 에는 그 화면의 페이지 단위 동작(내보내기, 저장 같은 것)을 담은 조각을 넘긴다.
  표의 행을 건드리는 동작은 여기가 아니라 표 툴바에 둔다.

  버튼 모양은 편집기(device/simulation/error/testplan_editor)를 따른다.
      취소      btn btn-outline-secondary   글자만
      확정      btn btn-primary             글자만 (Save, Register, Deploy) — 화면·모달마다 하나
      실행      btn btn-success             아이콘 + 글자 (Run)
      그 밖     btn btn-outline-secondary   아이콘 + 글자 (Template, Choose Excel, 입력칸 옆 Add)
  표 툴바·카드 안의 추가 버튼·필터·토글은 채우지 않는다 — 여럿이라 주 동작이 흐려진다.
  Tabler 가 채운 버튼에 넣는 그라디언트·하이라이트 그림자는 cts-tabler.css(1-1b)가 꺼서 플랫하게 보인다.
-->
<header th:fragment="navbar(title, actions)" class="navbar navbar-expand-md d-print-none">
    <div class="container-fluid">
        <h2 class="page-title mb-0 me-2" id="pageTitle" th:text="${title}">Title</h2>
        <div class="text-secondary" id="pageSubtitle"></div>
        <!--/* 기동 시 스키마 확인·마이그레이션에 문제가 있으면 모든 화면에 한 줄로 알린다(StartupReport).
               화면 높이가 고정이라 줄을 새로 만들지 않고 제목 줄 안에 둔다. 누르면 단계별 결과(JSON)를 연다 */-->
        <th:block th:with="startupProblems=${@startupReport.problems}">
            <a th:unless="${#lists.isEmpty(startupProblems)}" id="startupAlert" href="/api/system/startup" target="_blank"
               class="badge bg-red text-red-fg ms-3 text-truncate" style="max-width: 45vw;"
               th:title="${#strings.listJoin(startupProblems, ' | ')}"
               th:text="${'Startup check: ' + startupProblems[0] + (startupProblems.size() > 1 ? ' (+' + (startupProblems.size() - 1) + ' more)' : '')}">Startup check failed</a>
        </th:block>
        <!-- ms-auto 가 없으면 제목 바로 옆에 붙는다. 오른쪽 끝으로 민다 -->
        <div class="navbar-nav flex-row order-md-last align-items-center ms-auto">
            <div class="nav-item" th:replace="${actions}"></div>
        </div>
    </div>
</header>

<!--
  좌측 "Groups and devices" 트리. devices / simulations / errors 가 같은 것을 쓴다.
  트리는 #tree-container 에, 검색은 #treeSearchInput 에 붙는다.
  쓰는 화면은 tree-assets / tree-scripts 도 같이 넣는다.
-->
<th:block th:fragment="tree-assets">
    <link rel="stylesheet" href="/css/cts-tree.css">
</th:block>

<th:block th:fragment="tree-scripts">
    <script src="/js/cts-tree.js"></script>
</th:block>

<div th:fragment="tree-card" class="card cts-card mb-0 flex-grow-1" style="min-height: 0; width: 100%;">
    <div class="card-header flex-shrink-0">
        <h3 class="card-title mb-0">Groups and devices</h3>
        <!-- card-actions 로 감싸야 다른 카드 머리와 높이가 같아진다 (Tabler 가 음수 마진으로 조인다) -->
        <div class="card-actions">
            <input id="treeSearchInput" type="search" class="form-control form-control-sm"
                   placeholder="Search by name..." style="width:180px; min-width:0;">
        </div>
    </div>
    <div class="card-body p-0">
        <div id="tree-container" class="h-100"></div>
    </div>
</div>

<!--
  일괄 등록 화면이 등록하는 동안 입력을 막는 덮개. 모양은 css/cts-batch.css 에 있다.
  .page 밖(body 바로 아래)에 둔다. 켜고 끄는 건 화면이 #busyOverlay 에 show 를 붙였다 뗀다.
-->
<div th:fragment="busy-overlay" id="busyOverlay" class="cts-busy">
    <div class="cts-busy-box">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="cts-busy-text" id="busyText">Registering…</div>
        <div class="cts-busy-sub">Please do not close or refresh this page.</div>
    </div>
</div>

<!-- tabler.min.js 가 Bootstrap 5 JS 를 품고 있다. bootstrap.bundle 을 따로 걸면 안 된다 -->
<th:block th:fragment="scripts">
    <script src="/plugins/jquery/jquery.min.js"></script>
    <script src="/plugins/tabler/js/tabler.min.js"></script>
    <script src="/js/cts-modal.js"></script>
</th:block>

<th:block th:fragment="select-scripts">
    <script src="/plugins/tom-select/js/tom-select.complete.min.js"></script>
    <script src="/js/cts-select.js"></script>
</th:block>

</body>
</html>
