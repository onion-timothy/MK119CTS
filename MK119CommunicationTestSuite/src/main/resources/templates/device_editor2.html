<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <!-- Google Font: Source Sans Pro -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="../../css/adminlte.min.css">
    <!-- jTree -->
    <link rel="stylesheet" href="../../css/style.min.css"/>
    <!-- BS Stepper -->
    <link rel="stylesheet" href="../../plugins/bs-stepper/css/bs-stepper.min.css">
    <!-- bootstrap slider -->
    <link rel="stylesheet" href="../../plugins/bootstrap-slider/css/bootstrap-slider.min.css">
    <link rel="stylesheet" href="../../css/bootstrap-select.min.css">

    <style>
        .form-group.rounded-outline {
            border: 1px solid #ccc;        /* 더 얇은 테두리 */
            border-radius: 0.5rem;         /* 더 둥글게 */
            box-shadow: none;              /* 기본 포커스 그림자 제거 */
            padding: 0.375rem 0.75rem;
        }

    <script th:inline="javascript">
        /*<![CDATA[*/
        let device;
        //let communicationSettings;

        document.addEventListener('DOMContentLoaded', function () {
            window.stepper = new Stepper(document.querySelector('.bs-stepper'))
        });
        let tree;

        let diCount;
        let doCount;
        let aiCount;
        let rsCount;

        function onload() {
            $('#tree-container').jstree({
                'core': {
                    'themes': {
                        'responsive': true,
                        "variant": "large"
                    },
                    'check_callback': true,
                    'data': {
                        "url": "/api/group/groups/treeData"
                    }
                },
                "types": {
                    "group": {
                        "icon": "fas fa-folder",
                    }
                },
                "plugins": [
                    "types", "wholerow", "sort"
                ],
            }).on("select_node.jstree", function (e, data) {
                if (data.node.type === 'group') {
                    $.jstree.reference('#tree-container').open_node(data.node.id);
                }
            }).on("ready.jstree", function () {
                // 시작할 때 루트 노드를 열어준다.
                if (device != null) {
                    $.jstree.reference('#tree-container').open_node('g_' + device.group.id);
                    $.jstree.reference('#tree-container').select_node('g_' + device.group.id);
                }
            });
            diCount = $('#diCount').bootstrapSlider();
            doCount = $('#doCount').bootstrapSlider();
            aiCount = $('#aiCount').bootstrapSlider();
            rsCount = $('#rsCount').bootstrapSlider();

            device = [[${device}]];
            if (device) {
                loadEditDevice(device);
            } else {
                onTransportChange(1)
            }
        }

        function loadEditDevice(device) {
            $('#title').text("Edit device '" + device.name + "'");
            $('#menuText').text('Edit device');
            $('#name').val(device.name);
            $('#enabled').val(device.enabled);
            $('#log').val(device.log);
            $.jstree.reference('#tree-container').open_node('g_1');
            $('#transport').val(device.transport);
            onTransportChange(device.transport);
            $('#host').val(device.host);
            $('#port').val(device.port);
            let protocolSelector = $('#protocol');
            protocolSelector.val(device.protocol);
            protocolSelector.prop('disabled', true);
            $('#devId').val(device.id);
        }

        function validatePanel1() {
            let name = $('#name').val();
            if (name === '') {
                alert('Name cannot be empty.');
            } else {
                stepper.next();
            }
        }

        function validatePanel2() {
            let group = $.jstree.reference('#tree-container').get_selected()[0];
            if (typeof(group) === 'undefined') {
                alert('Group not selected.');
            } else {
                $.ajax({
                    url: '/api/device/devices/' + group.replace('g_', ''),
                    type: 'GET',
                    success: function (data) {
                        let deviceNames = data.map(item => item.name);
                        let name = $('#name');

                        if(device && device.name === name.val()){
                            stepper.next();
                        } else {
                            if (deviceNames.indexOf(name.val()) > -1) {
                                alert('Entered name is duplicated in selected group.')
                            } else {
                                stepper.next();
                            }
                        }
                    }
                });
            }
        }

        function loadPPDPGD(commSettings, form) {
            if(parseInt($(`#${form}-ppd-count`).val())===0) {
                commSettings.rx.forEach((rx, i) => {
                    addPPD(form)
                    $(`#${form}-ppd-${i}-id`).val(rx.rx_id)
                    $(`#${form}-ppd-${i}-length`).val(parseInt(rx.length))
                    rx.fields.forEach((field, j) => {
                        addPPDField(form, i)
                        $(`#${form}-ppd-${i}-field-${j}-id`).val(field.field_id)
                        $(`#${form}-ppd-${i}-field-${j}-datatype`).selectpicker('val', field.data_type)
                        if (field.required_value) $(`#${form}-ppd-${i}-field-${j}-required_value`).val(field.required_value)
                    })
                })
            }

            if(parseInt($(`#${form}-pgd-count`).val())===0){
                commSettings.tx.forEach((tx, i) => {
                    addPGD(form)
                    $(`#${form}-pgd-${i}-id`).val(tx.tx_id)
                    tx.fields.forEach((field, j) => {
                        addPGDField(form, i)
                        $(`#${form}-pgd-${i}-field-${j}-id`).val(field.field_id)
                        $(`#${form}-pgd-${i}-field-${j}-fieldtype`).val(field.field_type)
                        $(`#${form}-pgd-${i}-field-${j}-datatype`).selectpicker('val', field.data_type)
                        changeFieldType(`${form}-pgd-${i}-field-${j}-fieldtype`)

                        if(field.field_type === 'STATIC' || field.field_type === 'REFERENCE' || field.field_type === 'CRC16' || field.field_type === 'CHECKSUM8') {
                            $(`#${form}-pgd-${i}-field-${j}-value`).val(field.value)
                        } else if (field.field_type === 'ITERATION') {
                            $(`#${form}-pgd-${i}-field-${j}-iteration_count`).val(field.iteration_count)
                        }
                    })
                })
            }
        }

        function validatePanel3() {
            let host = $('#host').val();
            let port = $('#port').val();
            let protocol = $('#protocol').val();
            if (host === '' || port === '') {
                alert('Host and port is cannot be empty.');
            } else {
                stepper.next();

                if (protocol === 'GENERIC') {
                    showForm('formGeneric');
                    if(device) {
                        loadPPDPGD(device.communicationSettings, 'generic')
                    } else {
                        if(parseInt($(`#generic-ppd-count`).val())===0)
                            addPPD('generic', true);
                        if(parseInt($(`#generic-pgd-count`).val())===0)
                            addPGD('generic', true);
                    }
                } else if (protocol === 'MODBUS') {
                    showForm('formModbus');
                    if (device != null) {
                        $('#uid').val(device.communicationSettings.unitId);
                        $('#packetType').val(device.communicationSettings.packetType);
                        $('#registers1').val(device.communicationSettings.registers);
                    }
                } else if (protocol === 'XGT_PLC') {
                    showForm('formLSISXGT');
                    if (device != null) {
                        $('#cpuid').val(device.communicationSettings.cpuId);
                        $('#blocksize').val((device.communicationSettings.maxBlockSize))
                        $('#registers2').val(device.communicationSettings.registers);
                    }
                } else if (protocol === 'DAEYUN_RCU') {
                    showForm('formMKRCU');
                    if(!device) {
                        if(parseInt($(`#rcu-ppd-count`).val())===0)
                            addPPD('rcu', true);
                        if(parseInt($(`#rcu-pgd-count`).val())===0)
                            addPGD('rcu', true);
                    } else {
                        loadPPDPGD(device.communicationSettings, 'rcu')
                        $('#cpuAddr').val(device.communicationSettings.cpuAddr);
                        diCount.bootstrapSlider('setValue', device.communicationSettings.diCount);
                        doCount.bootstrapSlider('setValue', device.communicationSettings.doCount);
                        aiCount.bootstrapSlider('setValue', device.communicationSettings.aiCount);
                    }
                } else if (protocol === 'SNMP') {
                    showForm('formSNMP');
                    if (device != null) {
                        $('#snmpVersion').val(device.communicationSettings.snmpVersion);
                        $('#getCommunity').val(device.communicationSettings.getCommunity);
                        $('#setCommunity').val(device.communicationSettings.setCommunity);
                    }
                } else if (protocol === 'BACNET') {
                    showForm('formBACnet');
                    if (device != null) {
                        $('#deviceInstanceId').val(device.communicationSettings.deviceInstanceId);
                        $('#broadcast').val(device.communicationSettings.broadcast);
                    }
                } else if (protocol === 'OPC_AGENT') {
                    showForm('formMKOPCAgent');
                    $('#agentTagsCount').val(device.communicationSettings.registers);
                } else if (protocol === 'DB') {
                    showForm('formDB');
                    if (device != null) {
                        $('#dbDriver').val(device.communicationSettings.dbdriver);
                        $('#dbUrl').val(device.communicationSettings.dbUrl);
                        $('#dbUsername').val(device.communicationSettings.dbUsername);
                        document.getElementById("dbPassword").value = device.communicationSettings.dbPassword;
                        $('#dbDatabase').val(device.communicationSettings.dbDatabase);
                    }
                } else if (protocol === 'ETHERNET_IP') {
                    showForm('formEthernetIP');
                    if (device != null) {
                        $('#cpuSlot').val(device.communicationSettings.cpuSlot);
                        $('#syn_port').val(device.communicationSettings.syn_port);
                        $('#implicit_t2o_addr').val(device.communicationSettings.implicit_t2o_addr);
                        $('#implicit_t2o_assy_size').val(device.communicationSettings.implicit_t2o_assy_size);
                        $('#implicit_o2t_assy_size').val(device.communicationSettings.implicit_o2t_assy_size);
                    }
                }
            }
        }

        let formIds = ['formGeneric', 'formModbus', 'formLSISXGT', 'formMKRCU', 'formSNMP', 'formBACnet', 'formMKOPCAgent', 'formDB', 'formEthernetIP'];

        function showForm(formId) {
            for (let i = 0; i < formIds.length; i++) {
                $('#' + formIds[i]).hide();
            }
            $('#' + formId).show();
        }

        function makeTXObj(form) {
            let txs = [];
            for(let i=0;i<parseInt($(`#${form}-pgd-count`).val());i++){
                let tx = {};
                tx.tx_id = $(`#${form}-pgd-${i}-id`).val();
                if(tx.tx_id === ''){
                    alert(`ID of PGD-${i} is empty.`);
                    return;
                }
                tx.fields = [];
                for(let j=0;j<parseInt($(`#${form}-pgd-${i}-field-count`).val());j++) {
                    let field = {};
                    field.field_id = $(`#${form}-pgd-${i}-field-${j}-id`).val()
                    if(field.field_id === '') {
                        alert(`Field ID of PGD-${i} Field-${j} is empty.`);
                        return;
                    }
                    field.field_type = $(`#${form}-pgd-${i}-field-${j}-fieldtype`).val()
                    field.data_type = $(`#${form}-pgd-${i}-field-${j}-datatype`).val()

                    if(field.field_type === 'STATIC' || field.field_type === 'REFERENCE' || field.field_type === 'CRC16' || field.field_type === 'CHECKSUM8') {
                        field.value = $(`#${form}-pgd-${i}-field-${j}-value`).val()
                        field.iteration_count = null;
                        if(field.value === '') {
                            alert(`Value of ${field.field_type} Field ${field.field_id} is empty.`);
                            return;
                        }
                    } else if (field.field_type === 'ITERATION') {
                        field.iteration_count = $(`#${form}-pgd-${i}-field-${j}-iteration_count`).val()
                        field.value = $(`#${form}-pgd-${i}-field-${j}-value`).val();
                        if(field.iteration_count === '') {
                            alert(`Count of ITERATION Field ${field.field_id} is empty.`);
                            return;
                        }

                        if(field.value === '') {
                            field.value = null
                        }
                    } else {
                        field.iteration_count = null;
                        field.value = null;
                    }
                    tx.fields.push(field);
                }
                txs.push(tx)
            }
            return txs;
        }

        function makeRXObj(form) {
            let rxs = [];
            for(let i=0;i<parseInt($(`#${form}-ppd-count`).val());i++) {
                let rx = {};
                rx.rx_id = $(`#${form}-ppd-${i}-id`).val();
                if(rx.rx_id === '') {
                    alert(`ID of PPD-${i} is empty.`);
                    return;
                }
                let $length = $(`#${form}-ppd-${i}-length`).val();
                rx.length = $length === '' ? null : parseInt($length);
                rx.fields = [];
                for(let j=0;j<parseInt($(`#${form}-ppd-${i}-field-count`).val());j++) {
                    let field = {};
                    field.field_id = $(`#${form}-ppd-${i}-field-${j}-id`).val();
                    if(field.field_id === '') {
                        alert(`Field ID of PPD-${i} Field-${j} is empty.`);
                        return;
                    }
                    field.data_type = $(`#${form}-ppd-${i}-field-${j}-datatype`).val();
                    let $required_value = $(`#${form}-ppd-${i}-field-${j}-required_value`).val();
                    field.required_value = $required_value === '' ? null : $required_value;
                    rx.fields.push(field);
                }
                rxs.push(rx);
            }
            return rxs;
        }

        function addDevice() {
            let dev = {};
            dev.transport = $('#transport').val();
            dev.protocol = $('#protocol').val();
            dev.host = $('#host').val();
            dev.port = $('#port').val();
            dev.name = $('#name').val();
            dev.enabled = $('#enabled').val();
            dev.log = $('#log').val();
            let group = {};
            group.id = $.jstree.reference('#tree-container').get_selected()[0].split("_")[1];
            group.name = null;
            group.parentId = null;
            dev.group = group;

            if (device != null) {
                dev.id = $('#devId').val();
            }

            let communicationSettings = {};
            if (dev.protocol === 'GENERIC') {
                communicationSettings.rx = makeRXObj('generic');
                if(!communicationSettings.rx) return;
                communicationSettings.tx = makeTXObj('generic');
                if(!communicationSettings.tx) return;
            } else if (dev.protocol === 'MODBUS') {
                communicationSettings.unitId = $('#uid').val();
                communicationSettings.packetType = $('#packetType').val();
                communicationSettings.registers = $('#registers1').val();

                if(communicationSettings.unitId === '' || isNaN(communicationSettings.unitId)){
                    alert('Unit ID must assigned to number.');
                    return;
                }
                if (communicationSettings.unitId < 0 || communicationSettings.unitId > 255) {
                    alert('Invalid Unit ID. Modbus Unit ID must in 0~255.');
                    return;
                }
                if(communicationSettings.registers === '' || isNaN(communicationSettings.registers)){
                    alert('Registers count must assigned to number.');
                    return;
                }
            } else if (dev.protocol === 'XGT_PLC') {
                communicationSettings.cpuId = $('#cpuid').val();
                communicationSettings.maxBlockSize = $('#blocksize').val();
                communicationSettings.registers = $('#registers2').val();

                if(communicationSettings.cpuId === '' || isNaN(communicationSettings.cpuId)) {
                    alert('CPU ID must assigned to number.')
                    return
                }
                if (communicationSettings.cpuId < 0 || communicationSettings.cpuId > 255) {
                    alert('Invalid CPU ID. XGT CPU ID must in 0~255.')
                    return
                }

                if(communicationSettings.maxBlockSize === '' || isNaN(communicationSettings.maxBlockSize)) {
                    alert('Block size must assigned to number.')
                    return
                }
                if (communicationSettings.maxBlockSize < 1 || communicationSettings.cpuId > 1400) {
                    alert('Invalid Block size. Block size must in 1~1400.')
                    return
                }

                if(communicationSettings.registers === '' || isNaN(communicationSettings.registers)){
                    alert('Registers count must assigned to number.');
                    return;
                }
            } else if (dev.protocol === 'DAEYUN_RCU') {
                communicationSettings.rx = makeRXObj('rcu');
                if(!communicationSettings.rx) return;
                communicationSettings.tx = makeTXObj('rcu');
                if(!communicationSettings.tx) return;
                communicationSettings.cpuAddr = $('#cpuAddr').val();
                communicationSettings.diCount = diCount.bootstrapSlider('getValue');
                communicationSettings.doCount = doCount.bootstrapSlider('getValue');
                communicationSettings.aiCount = aiCount.bootstrapSlider('getValue');
                //communicationSettings.rsCount = rsCount.bootstrapSlider('getValue');

                if(communicationSettings.cpuAddr === '' || isNaN(communicationSettings.cpuAddr)) {
                    alert('CPU ID must assigned to number.')
                    return
                }
                if (communicationSettings.cpuAddr < 0 || communicationSettings.cpuAddr > 255) {
                    alert('Invalid CPU Address. MK RCU CPU Address must in 0~255.')
                    return
                }
            } else if (dev.protocol === 'SNMP') {
                communicationSettings.snmpVersion = $('#snmpVersion').val();
                communicationSettings.getCommunity = $('#getCommunity').val();
                communicationSettings.setCommunity = $('#setCommunity').val();
                if(communicationSettings.snmpVersion === '' || isNaN(communicationSettings.snmpVersion)) {
                    alert('SNMP Version must assigned to number.')
                    return
                }
                if (communicationSettings.snmpVersion < 0 || communicationSettings.snmpVersion > 1) {
                    alert('Invalid SNMP Version. SNMP Version must in 1 or 2.')
                    return
                }
            } else if (dev.protocol === 'BACNET') {
                communicationSettings.deviceInstanceId = $('#deviceInstanceId').val();
                communicationSettings.broadcast = $('#broadcast').val();

                if(communicationSettings.deviceInstanceId === '' || isNaN(communicationSettings.deviceInstanceId)) {
                    alert('BACnet device instance number must assigned to number.')
                    return
                }
                if (communicationSettings.deviceInstanceId < 1 || communicationSettings.deviceInstanceId > 65536) {
                    alert('Invalid BACnet device instance number. BACnet device instance number must in 1~65536.')
                    return
                }
                if(communicationSettings.broadcast === ''){
                    alert('BACnet broadcast address cannot be empty.')
                    return
                }
            } else if (dev.protocol === 'OPC_AGENT') {
                communicationSettings.registers = $('#agentTagsCount').val();
                if(communicationSettings.registers === '' || isNaN(communicationSettings.registers)) {
                    alert('OPC Agent tags count must assigned to number.')
                    return
                }
            } else if (dev.protocol === 'DB') {
                communicationSettings.dbdriver = $('#dbDriver').val();
                communicationSettings.dbUrl = $('#dbUrl').val();
                communicationSettings.dbUsername = $('#dbUsername').val();
                communicationSettings.dbPassword = document.getElementById("dbPassword").value;
                communicationSettings.dbDatabase = $('#dbDatabase').val();

                if(communicationSettings.dbdriver === ''){
                    alert('DB Driver cannot be empty.')
                    return
                }
                if(communicationSettings.dbUrl === ''){
                    alert('DB URL cannot be empty.')
                    return
                }
                if(communicationSettings.dbUsername === ''){
                    alert('DB Username cannot be empty.')
                    return
                }
                if(communicationSettings.dbPassword === ''){
                    alert('DB Password cannot be empty.')
                    return
                }
                if(communicationSettings.dbDatabase === ''){
                    alert('DB name cannot be empty.')
                    return
                }
            } else if (dev.protocol === 'ETHERNET_IP') {
                communicationSettings.cpuSlot = $('#cpuSlot').val();
                communicationSettings.syn_port = $('#syn_port').val();
                communicationSettings.implicit_t2o_addr = $('#implicit_t2o_addr').val();
                communicationSettings.implicit_t2o_assy_size = $('#implicit_t2o_assy_size').val();
                communicationSettings.implicit_o2t_assy_size = $('#implicit_o2t_assy_size').val();

                if(communicationSettings.cpuSlot === ''){
                    alert('CPU slot number cannot be empty.')
                    return
                }
            }

            dev.communicationSettings = communicationSettings;
            $.ajax({
                url: device == null ? '/api/device/addDevice' : '/api/device/updateDevice',
                type: device == null ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(dev),
                success: function () {
                    location.href = '/';
                },
                error: function (request) {
                    if (request.responseText.includes('UNIQUE')) {
                        alert("Cannot create with the same name within a group.");
                    } else
                        alert(request.status + request.responseText);
                }
            });
        }

        const tcp_protocols = [
            {value: 'GENERIC', text: 'Generic'},
            {value: 'MODBUS', text: 'Modbus'},
            {value: 'XGT_PLC', text: 'LSIS-XGT'},
            {value: 'DAEYUN_RCU', text: 'MK RCU'},
            {value: 'DB', text: 'DB'},
            {value: 'ETHERNET_IP', text: 'Ethernet/IP'}
        ]

        const udp_protocols = [
            {value: 'GENERIC', text: 'Generic'},
            {value: 'MODBUS', text: 'Modbus'},
            {value: 'XGT_PLC', text: 'LSIS-XGT'},
            {value: 'SNMP', text: 'SNMP'},
            {value: 'BACNET', text: 'BACnet'},
            {value: 'OPC_AGENT', text: 'MK OPC Agent'},
            {value: 'DB', text: 'DB'}
        ]

        function onTransportChange() {
            let transport = $('#transport').val()
            let protocol = $('#protocol');
            protocol.empty()
            let p = transport === 'TCP' ? tcp_protocols : udp_protocols;
            p.forEach(option => {
                protocol.append($('<option>', {
                    value: option.value,
                    text: option.text
                }))
            })
            onProtocolChange(1)
        }

        function onProtocolChange() {
            let host = $('#host')
            let port = $('#port')
            let transport = $('#transport').val()
            let protocol = $('#protocol').val()

            host.attr('readonly', false)
            host.attr('placeholder', 'Binding host for device')
            host.val('')
            port.attr('readonly', false)
            port.attr('placeholder', 'Binding port for device')
            port.val('')

            let hostForm = $('#hostFormGroup')
            let portForm = $('#portFormGroup')
            hostForm.show()
            portForm.show()

            if (protocol === 'MODBUS') {
                port.attr('placeholder', 502)
            } else if (protocol === 'XGT_PLC') {
                port.attr('placeholder', transport === 'TCP' ? 2004 : 2005)
            } else if (protocol === 'DAEYUN_RCU') {
                port.attr('placeholder', 1470)
            } else if (protocol === 'SNMP') {
                port.attr('placeholder', 161)
            } else if (protocol === 'BACNET') {
                host.attr('readonly', true)
                host.val('0.0.0.0')
                port.attr('readonly', true)
                port.val(47808)
            } else if (protocol === 'OPC_AGENT') {
                port.attr('placeholder', 9999)
            } else if (protocol === 'ETHERNET_IP') {
                port.attr('placeholder', 44818)
            } else if (protocol === 'DB') {
                hostForm.hide()
                portForm.hide()
            }
        }

        function addPPD(form, addDefaultField=false) {
            let $pnum_input = $('#'+form+'-ppd-count');
            let pnum = parseInt($pnum_input.val());

            let html =
                '<label for="'+form+'-ppd-'+pnum+'" id="'+form+'-ppd-'+pnum+'-label">PPD-'+pnum+'</label>\n' +
                '<div id="'+form+'-ppd-'+pnum+'" class="form-group rounded-outline">\n' +
                '    <div class="form-group">\n' +
                '        <label for="'+form+'-ppd-'+pnum+'-id">ID</label>\n' +
                '        <input type="text" class="form-control form-control-border"\n' +
                '               id="'+form+'-ppd-'+pnum+'-id" placeholder="ID of PPD.">\n' +
                '    </div>\n' +
                '    <div class="form-group">\n' +
                '        <label for="'+form+'-ppd-'+pnum+'-length">Length</label>\n' +
                '        <input type="text" class="form-control form-control-border"\n' +
                '               id="'+form+'-ppd-'+pnum+'-length" placeholder="Length of packet. Set as 0 if length not fixed." onbeforeinput="numeric_filter(this, event)">\n' +
                '    </div>\n' +
                '    <div class="form-group">\n' +
                '        <label for="'+form+'-ppd-'+pnum+'-fields-header">Fields</label>\n' +
                '        <div class="form-group" id="'+form+'-ppd-'+pnum+'-fields-header">\n' +
                '            <button class="btn btn-danger" id="'+form+'-ppd-'+pnum+'-decrease-field" onclick="removePPDField(\''+form+'\', '+pnum+')">\n' +
                '                <i class="fas fa-minus"></i>\n' +
                '            </button>\n' +
                '            <button class="btn btn-success" id="'+form+'-ppd-'+pnum+'-increase-field" onclick="addPPDField(\''+form+'\', '+pnum+')">\n' +
                '                <i class="fas fa-plus"></i>\n' +
                '            </button>\n' +
                '        </div>\n' +
                '        <div id="'+form+'-ppd-'+pnum+'-fields">\n' +
                '            <input type="hidden" id="'+form+'-ppd-'+pnum+'-field-count" value="0">\n' +
                '        </div>\n' +

        function numeric_filter(input, e) {
            // 입력 타입이 텍스트가 아니면 무시
            if (e.inputType !== "insertText") return;

            const char = e.data;
            const { selectionStart, selectionEnd, value } = input;

            // 입력 후 결과 예측값
            const nextValue =
                value.slice(0, selectionStart) + char + value.slice(selectionEnd);

            // 조건:
            // 1. 숫자/마침표/하이픈만 포함
            // 2. 하이픈은 0~1회만, 맨 앞에만
            // 3. 마침표는 0~1회만
            const dashCount = (nextValue.match(/-/g) || []).length;
            const dotCount = (nextValue.match(/\./g) || []).length;

            const isValid =
                /^-?\d*(\.\d*)?$/.test(nextValue) &&
                dashCount <= 1 &&
                (nextValue.indexOf('-') <= 0) &&
                dotCount <= 1;

            if (!isValid) {
                e.preventDefault(); // 입력 차단
            }
        }

        function hex_filter(input) {
            input.innerText = input.innerText.toUpperCase().replace(/[^0-9A-F]/g, "");
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(input);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);

            accept_test(input)
        }

        function accept_test(input) {
            let $result = $('#' + input.id + '-result');
            let test_input = input.innerText
            if(test_input === '') {
                $result.text('')
                $result.hide()
                return
            }

            try {
                let tokens = input.id.split('-');
                let form = tokens[0];
                let pnum = tokens[2];

                let length = parseInt($('#' + form + '-ppd-' + pnum + '-length').val())
                if(isNaN(length)) {
                    $result.show();
                    $result.text('Packet length is not a number.')
                    return
                }

                let buffer = new TypedBuffer('hexstring', test_input);
                if(length !== buffer.size()) {
                    $result.show();
                    $result.text('Buffer length is not matched with packet length.')
                    return
                }

                let fcount = parseInt($('#' + form + '-ppd-' + pnum + '-field-count').val());
                let fields = [];
                let byte_count = 0;

                for(let i=0;i<fcount;i++) {
                    let field = {};
                    field.id = $(`#${form}-ppd-${pnum}-field-${i}-id`).val();
                    field.datatype = $('#' + form + '-ppd-' + pnum + '-field-' + i + '-datatype').val()
                    let rval = $('#' + form + '-ppd-' + pnum + '-field-' + i + '-required_value').val();
                    field.required_value = Number(rval === '' ? NaN : rval)
                    field.byte_length = parseInt(field.datatype.replace(/[^0-9]/g, "")) / 8;
                    byte_count += field.byte_length
                    if(field.id === '') {
                        $result.show();
                        $result.text(`ID of Field ${i} is empty.`)
                        return;
                    }

                    field.value = buffer.read(field.datatype)

                    if(!isNaN(field.required_value)) {
                        if(!isRoundedEqual(field.required_value, field.value)){
                            $result.show();
                            $result.text(`Value of Field '${field.id}' is not macthed.`)
                            return;
                        }
                    }

                    if(field.id==='crc16' && i === fcount - 1 && field.datatype.includes('UI16')) {
                        if(buffer.getCRC16() !== field.value) {
                            $result.show();
                            $result.text('CRC16 test fail.')
                            return;
                        }
                    }
                    fields.push(field)
                }

                if(byte_count !== buffer.size()) {
                    $result.show();
                    $result.text('Sum of field byte count is not matched with buffer length.')
                    return
                }

                $result.text('')
                fields.forEach(e=>{
                    $result.show();
                    $result.append(`Field <b>${e.id}</b> → ${e.value}<br>`)
                })
                $result.append('Accepted.')
            } catch(e) {
                $result.show();
                $result.text(e.message)
            }
        }

        function isRoundedEqual(a, b, digits = 2) {
            const factor = Math.pow(10, digits);
            const ra = Math.round(a * factor) / factor;
            const rb = Math.round(b * factor) / factor;
            return ra === rb;
        }

        function changeFieldType(id) {
            let tokens = id.split('-');
            //generic-pgd-0-field-0-

            let value = $(`#${tokens[0]}-pgd-${tokens[2]}-field-${tokens[4]}-value-group`);
            let iteration_count = $(`#${tokens[0]}-pgd-${tokens[2]}-field-${tokens[4]}-iteration_count-group`);
            switch ($('#' + id).val()) {
                case 'STATIC':
                case 'REFERENCE':
                case 'CRC16':
                case 'CHECKSUM8':
                    value.show();
                    iteration_count.hide();
                    break;
                case 'SIMULATION':
                    value.hide();
                    iteration_count.hide();
                    break;
                case 'ITERATION':
                    value.show();
                    iteration_count.show();
                    break;
            }

        }
