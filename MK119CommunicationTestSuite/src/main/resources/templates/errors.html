    <script>
        /*<![CDATA[*/
        let devicesTable;
        let device_id;

        let frequency;
        let timeout;
        let garbageLength;

        function onload() {
            $('#timeout-from-group').hide();
            $('#garbage-length-from-group').hide();
            frequency = $('#frequency').bootstrapSlider();
            timeout = $('#timeout').bootstrapSlider();
            garbageLength = $('#garbage-length').bootstrapSlider();

            $('#removeButton').hide()

            let tableFirstRowId;
            $.ajax({
                url: '/api/device/devices',
                type: 'GET',
                async: false,
                success: function (data) {
                    let table = $('#devicesTable');

                    for (let i = 0; i < data.length; i++) {
                        let markup = "<tr onclick='viewSimulations(this.id)' id='" + data[i].id + "'><td>" + data[i].id + "</td><td>" + data[i].transport + "</td><td>" + data[i].protocol + "</td><td>" + data[i].host + "</td><td>" + data[i].port + "</td><td>" + data[i].name + "</tr>";
                        table.append(markup);
                        if (i === 0) {
                            tableFirstRowId = data[i].id;
                        }
                    }

                    devicesTable = $('#devicesTable').DataTable({
                        "paging": true,
                        "lengthChange": false,
                        "searching": false,
                        "ordering": true,
                        "info": true,
                        "autoWidth": false,
                        "responsive": true,
                    });
                }
            });

            viewSimulations(tableFirstRowId);
        }

        function displayForms(value) {
            let formTimeout = $('#timeout-from-group');
            let formGarbageLength = $('#garbage-length-from-group');
            let mode = parseInt(value);
            if (mode === 0) {
                formTimeout.hide();
                formGarbageLength.hide();
            } else if(mode === 1) {
                formTimeout.show();
                formGarbageLength.hide();
            } else {
                formTimeout.hide();
                formGarbageLength.show();
            }
        }

        let currentError;
        let currentDeviceId;
        let currentDeviceName;

        function viewSimulations(id) {
            currentDeviceId = id;
            for (let i = 0; i < devicesTable.rows().count(); i++) {
                if (devicesTable.cell(i, 0).data() === id) {
                    currentDeviceName = devicesTable.cell(i, 5).data();
                }
            }
            $.ajax({
                url: '/api/error/' + id,
                type: 'GET',
                async: false,
                success: function (data) {
                    currentError = data;
                    displayForms(data.intMode)
                    if (data !== '') {
                        $('#removeButton').show();
                        $('#submitButton').text('Edit')
                        $('#errorMode').val(data.intMode)
                        $('#enabled').val(data.enabled)
                        frequency.bootstrapSlider('setValue', data.frequency)
                        timeout.bootstrapSlider('setValue', data.timeout)
                        garbageLength.bootstrapSlider('setValue', data.garbageLength)
                    } else {
                        currentError = null;
                        $('#removeButton').hide();
                        $('#submitButton').text('Add')

                        $('#errorMode').val(0)
                        $('#enabled').val(0)
                        frequency.bootstrapSlider('setValue', 10)
                        timeout.bootstrapSlider('setValue', 4)
                        garbageLength.bootstrapSlider('setValue', 36)
                    }
                }
            });
        }

        function submit() {
            let error = {};
            error.device_id = currentDeviceId;
            error.intMode = $('#errorMode').val();
            error.frequency = frequency.bootstrapSlider('getValue');
            error.timeout = timeout.bootstrapSlider('getValue');
            error.enabled = $('#enabled').val();
            error.garbageLength = garbageLength.bootstrapSlider('getValue')

            let api = currentError === null ? '/api/error/addError' : '/api/error/updateError';
            let method = currentError === null ? 'PUT' : 'POST';

            $.ajax({
                url: api,
                type: method,
                contentType: 'application/json',
                data: JSON.stringify(error),
                success: function () {
                    location.reload()
                },
                error: function (request) {
                    alert(request.status + request.responseText);
                }
            });
        }

        function remove() {
            if(confirm("Confirm to delete error simulation for device '" + currentDeviceName + "'.")){
                $.ajax({
                    url: '/api/error/deleteError/' + currentDeviceId,
                    type: 'DELETE',
                    success: function () {
                        location.reload()
                    },
                    error: function (request) {
                        alert(request.status + request.responseText);
                    }
                });
            }
        }

        /*]]>*/
    </script>
