<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK119 CTS</title>

    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/plugins/tabulator/css/tabulator_bootstrap5.min.css">
    <!-- testplan.css 는 아직 AdminLTE 화면들과 공유한다. 겹치는 .cts-tabulator 는
         뒤에 오는 cts-table.css 가 Tabler 색으로 덮게 둔다 -->
    <link rel="stylesheet" href="/css/testplan.css">
    <link rel="stylesheet" href="/css/cts-table.css">

    <style>

        /* 가로로 긴 화면: 좌(목록) · 우(세부). 세로로 긴 화면: 상(목록) · 하(세부). */
        /* 좌우는 AdminLTE 의 .content 좌우 .5rem + 1rem = 1.5rem. 하단도 같게 1.5rem 을 둔다 */
        .tp-split { flex: 1 1 auto; min-height: 0; display: flex; gap: var(--cts-page-gap); }
        .tp-list { flex: 0 0 440px; min-width: 0; container-type: inline-size; container-name: tplist; }
        .tp-detail { flex: 1 1 auto; min-width: 0; }
        @media (orientation: portrait) {
            .tp-split { flex-direction: column; }
            .tp-list { flex: 0 0 34%; }
            .tp-detail { flex: 1 1 auto; min-height: 0; }
        }

        /*
         * 세부 영역은 카드 본문 높이를 다 쓴다(아래가 비지도, 넘쳐 스크롤되지도 않게). 가로·세로 같다.
         *   윗줄: Status · Schedule · Summary 를 한 줄로
         *   아랫줄: 남는 높이는 모두 Run history
         * Timeline 은 편집기에서만 보인다. 아주 낮은 화면에서 최소 높이를 못 채우면 그때만 스크롤한다.
         */
        .tp-detail > .card-body { display: flex; flex-direction: column; }
        .tp-detail-body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 10px; display: flex;
            flex-direction: column; gap: 10px; }
        .tp-history-section { flex: 1 1 0; min-height: 180px; }
        .tp-facts { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .tp-fact { border: 1px solid #eef0f2; border-radius: 4px; padding: 8px 10px; background: #fcfcfd; }
        .tp-fact h6 { font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px 0; }
        .tp-fact .tp-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 1px 0; }
        .tp-fact .tp-row span:first-child { color: #6c757d; }
        .tp-progress { height: 6px; background: #eef0f2; border-radius: 3px; overflow: hidden; margin: 6px 0 4px 0; }
        .tp-progress > div { height: 100%; background: #2f80ed; transition: width 0.3s ease; }
        .tp-section { border: 1px solid #eef0f2; border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
        .tp-section > header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #eef0f2; }
        .tp-section > header h6 { font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase;
            letter-spacing: 0.03em; margin: 0; }
        /* 비었을 때의 한 줄은 .cts-empty (css/cts-empty.css) 가 맡는다 */
        .tp-actions .btn { white-space: nowrap; }
        .cts-tabulator .tabulator-row.tp-current { background-color: #d6e8ff !important; }
        @media (max-width: 900px) { .tp-actions .btn-text { display: none; } }

        /* 목록 표: devices / simulations / errors 와 같은 툴바·footer(pagination) */
        .tp-list-tools .btn { white-space: nowrap; }
        @container tplist (max-width: 620px) {
            .tp-list .btn-text { display: none; }
        }
        @container tplist (max-width: 400px) {
            .tp-list-tools input[type="search"] { width: 90px !important; }
        }
        /* 세로: pageSize 가 행을 높이에 딱 맞추므로 스크롤이 필요 없다 */
        #planTable .tabulator-tableholder { overflow-x: auto !important; overflow-y: hidden !important; }
        .cts-tabulator .tabulator-footer,
        .cts-tabulator .tabulator-footer .tabulator-footer-contents { background: #fff !important; background-image: none !important; }
        .cts-tabulator .tabulator-footer { border-top: 1px solid #dee2e6 !important; padding: 0; }
        .cts-tabulator .tabulator-footer .tabulator-footer-contents { padding: 6px 10px; gap: 0.25rem; }
        .cts-tabulator .tabulator-footer .tabulator-page { border-radius: 3px; margin: 0 2px; transition: background-color 0.12s ease; }
        .cts-tabulator .tabulator-footer .tabulator-page:not(.disabled):not(.active):hover { background-color: #eef5ff; border-color: #b8dcff; }
        .cts-tabulator .tabulator-footer .tabulator-page.active { background-color: #007bff; color: #fff; border-color: #007bff; }
        .cts-tabulator .tabulator-footer .tabulator-page.disabled { opacity: 0.4; }
    </style>
</head>
<body>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('testplans')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('Test Plans', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list">
            <button type="button" class="btn btn-sm" onclick="downloadTemplate()" title="Download an empty Excel template">
                <i class="fas fa-file-excel"></i> Template
            </button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <input type="file" id="excelFile" accept=".xlsx" style="display:none">
            <div class="tp-split">
                <!-- 목록 -->
                <div class="card cts-card tp-list">
                    <div class="card-header">
                        <h3 class="card-title">Plans</h3>
                        <div class="card-actions ms-auto tp-list-tools">
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-action="export" title="Export the checked plans to the Excel template">
                                <i class="fas fa-file-export"></i> <span class="btn-text">Export</span></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete" title="Delete the checked plans">
                                <i class="fas fa-trash"></i> <span class="btn-text">Delete</span></button>
                            <select id="planSearchField" class="form-select form-select-sm" style="width:auto;">
                                <option value="name">Name</option>
                                <option value="state">State</option>
                            </select>
                            <input id="planSearchInput" type="search" class="form-control form-control-sm" placeholder="Search..." style="width:140px; min-width:0;">
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="planTable" class="cts-tabulator"></div>
                    </div>
                </div>

                <!-- 세부 -->
                <div class="card cts-card tp-detail">
                    <div class="card-header">
                        <h3 class="card-title" id="detailTitle">Select a plan</h3>
                        <div class="card-actions ms-auto tp-actions" id="detailTools" style="display:none">
                            <button class="btn btn-sm btn-success" id="runBtn" onclick="runPlan()"><i class="fas fa-play"></i> <span class="btn-text">Run</span></button>
                            <button class="btn btn-sm btn-outline-danger" id="stopBtn" onclick="stopPlan()"><i class="fas fa-stop"></i> <span class="btn-text">Stop</span></button>
                            <a class="btn btn-sm btn-outline-secondary" id="editBtn" href="#"><i class="fas fa-pen"></i> <span class="btn-text">Edit</span></a>
                            <button class="btn btn-sm btn-outline-secondary" onclick="duplicatePlan()"><i class="fas fa-copy"></i> <span class="btn-text">Duplicate</span></button>
                            <button class="btn btn-sm btn-outline-danger" id="deleteBtn" onclick="deletePlan()"><i class="fas fa-trash"></i> <span class="btn-text">Delete</span></button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="cts-empty" id="detailEmpty">Select a plan on the list to see its details.</div>
                        <div class="tp-detail-body" id="detailBody" style="display:none">
                            <div class="tp-facts">
                                <div class="tp-fact">
                                    <h6>Status</h6>
                                    <div id="statusText" class="tp-row"><span>State</span><span>—</span></div>
                                    <div class="tp-progress" id="progressWrap" style="display:none"><div id="progressBar" style="width:0"></div></div>
                                    <div id="statusMore" class="tp-row" style="display:none"></div>
                                </div>
                                <div class="tp-fact">
                                    <h6>Schedule</h6>
                                    <div class="tp-row"><span>When</span><span id="scheduleText">—</span></div>
                                    <div class="tp-row"><span>Enabled</span>
                                        <span><button type="button" class="cts-toggle" id="scheduleToggle" onclick="toggleSchedule()"></button></span></div>
                                    <div class="tp-row"><span>Next run</span><span id="nextRunText">—</span></div>
                                </div>
                                <div class="tp-fact">
                                    <h6>Summary</h6>
                                    <div class="tp-row"><span>Actions</span><span id="sumActions">—</span></div>
                                    <div class="tp-row"><span>Devices / cells</span><span id="sumDevices">—</span></div>
                                    <div class="tp-row"><span>Duration</span><span id="sumDuration">—</span></div>
                                </div>
                            </div>
                            <div class="tp-section tp-history-section">
                                <header><h6>Run history</h6><span class="text-muted small ml-2">latest 50 · click a run for its actions</span></header>
                                <div id="historyTable" class="cts-tabulator cts-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /.page-body -->

        <!-- 실행 1회의 Action 결과 -->
        <div class="modal fade" id="runModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="runModalTitle">Run</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0"><div id="runActionsTable" class="cts-tabulator" style="height:420px"></div></div>
                </div>
            </div>
        </div>
    </div>
    <!-- /.page-wrapper -->
</div>
<!-- /.page -->

<th:block th:replace="~{fragments/tabler :: scripts}"></th:block>
<script src="/plugins/tabulator/js/tabulator.min.js"></script>
<script src="/js/cts-table.js"></script>
<script src="/js/xlsx.full.min.js"></script>
<script src="/js/testplan-timeline.js"></script>
<script th:inline="javascript">
    const SELECTED_ON_LOAD = /*[[${selectedPlan}]]*/ null;
    const BATCH_KEY = 'batchAddTestPlans';
    const COLUMNS = ['RunAtSeconds', 'Device', 'Target', 'Value', 'DataType', 'LockSeconds', 'StopOnFailure'];
    const SCHEDULE_LABEL = { NONE: 'Manual only', SECOND: 'Every minute', MINUTE: 'Every hour', HOUR: 'Every day', INTERVAL: 'Interval' };

    let planTable, historyTable, runActionsTable;
    let plans = [], selectedId = null, detail = null, statuses = {};
    const checked = new Set();
    let planSelectAllBox = null;

    // ── 표시 도우미 ────────────────────────────────────────────────
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fmtDateTime(s) {
        if (!s) return '—';
        const d = new Date(s);
        if (isNaN(d)) return s;
        return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    function scheduleText(p) {
        const s = pad2(p.scheduleSecond || 0), m = pad2(p.scheduleMinute || 0), h = pad2(p.scheduleHour || 0);
        if (p.scheduleType === 'SECOND') return 'Every minute at :' + s;
        if (p.scheduleType === 'MINUTE') return 'Every hour at ' + m + ':' + s;
        if (p.scheduleType === 'HOUR') return 'Every day at ' + h + ':' + m + ':' + s;
        if (p.scheduleType === 'INTERVAL') return 'Every ' + (p.scheduleIntervalSeconds || 0).toLocaleString() + ' s';
        return 'Manual only';
    }
    function badge(result, text) {
        return '<span class="tp-badge ' + (result || 'NONE') + '">' + (text || (result ? result.replace(/_/g, ' ') : '—')) + '</span>';
    }
    function stateHtml(p) {
        const st = statuses[p.id];
        if (st) return badge('RUNNING', 'RUNNING ' + Math.min(st.nextAction, st.totalActions) + '/' + st.totalActions);
        return p.lastRun ? badge(p.lastRun.result) : badge(null, 'Never run');
    }
    /** State 열에 보이는 글자. State 검색이 이걸로 찾는다 */
    function stateText(p) {
        if (statuses[p.id]) return 'RUNNING';
        return p.lastRun ? p.lastRun.result.replace(/_/g, ' ') : 'Never run';
    }
    function durationOf(run) {
        if (!run.startedAt || !run.endedAt) return '—';
        const s = Math.round((new Date(run.endedAt) - new Date(run.startedAt)) / 1000);
        return TestPlanTimeline.fmtTime(Math.max(0, s));
    }
    function api(method, url, body) {
        return $.ajax({ url: url, method: method, contentType: 'application/json',
            data: body === undefined ? undefined : JSON.stringify(body) });
    }
    function errorText(xhr) {
        const b = xhr && xhr.responseJSON;
        if (b && b.error) return b.error;
        if (b && b.errors && b.errors.length) return b.errors.map(e => e.rule + ' ' + e.message).join('\n');
        return (xhr && xhr.statusText) || 'Request failed';
    }

    // ── 목록 ───────────────────────────────────────────────────────
    function initPlanTable() {
        // Export 할 Plan 은 체크박스로 고른다. 행 클릭은 세부 보기다 — Tabulator 의 행 선택을 쓰면 둘이 섞인다
        planTable = new Tabulator('#planTable', {
            data: [], index: 'id', layout: 'fitData', height: '100%', renderVertical: 'basic',
            pagination: true, paginationSize: 10, paginationButtonCount: 3,
            placeholder: 'No test plans yet. Create one or import an Excel file.',
            rowFormatter: function (row) { row.getElement().classList.toggle('tp-current', row.getData().id === selectedId); },
            columns: CtsTable.columns([
                { field: 'id', kind: 'action', headerSort: false, width: 36, title: '', resizable: false,
                  // 머리글의 Select all: 검색에 걸린 Plan 이 전부 체크면 비우고, 아니면 전부 체크한다.
                  titleFormatter: function (cell, formatterParams, onRendered) {
                      planSelectAllBox = document.createElement('input');
                      planSelectAllBox.type = 'checkbox';
                      planSelectAllBox.addEventListener('click', function (e) {
                          e.stopPropagation();
                          const ids = activePlanIds();
                          const allChecked = ids.length > 0 && ids.every(id => checked.has(id));
                          if (allChecked) checked.clear();
                          else ids.forEach(id => checked.add(id));
                          planTable.getRows().forEach(r => r.reformat());
                          syncPlanSelectAll();
                      });
                      onRendered(function () { syncPlanSelectAll(); });
                      return planSelectAllBox;
                  },
                  formatter: c => '<input type="checkbox"' + (checked.has(c.getValue()) ? ' checked' : '') + '>',
                  cellClick: function (e, cell) {
                      e.stopPropagation();
                      const id = cell.getValue();
                      if (checked.has(id)) checked.delete(id); else checked.add(id);
                      cell.getRow().reformat();
                      syncPlanSelectAll();
                  } },
                { title: 'Name', field: 'name', kind: 'text' },
                { title: 'State', field: 'id', kind: 'text', headerSort: false, formatter: c => stateHtml(c.getRow().getData()) },
                { title: 'Next run', field: 'nextRunAt', kind: 'text', formatter: c => c.getValue() ? fmtDateTime(c.getValue()) : '<span class="text-muted">—</span>' }
            ]),
            rowContextMenu: [
                { label: "<i class='fas fa-pen'></i> Edit plan",
                  action: function (e, row) {
                      const id = row.getData().id;
                      if (statuses[id]) { alert('Stop the plan to edit it.'); return; }
                      location.href = '/testplans/edit/' + id;
                  } },
                { label: "<i class='fas fa-trash'></i> Delete plan",
                  action: function (e, row) { deletePlans([row.getData().id]); } }
            ]
        });
        planTable.on('rowClick', function (e, row) { select(row.getData().id); });
        planTable.on('dataFiltered', function () { setTimeout(syncPlanSelectAll); });
        CtsTable.attach(planTable, { rowH: PLAN_BASE_ROW_H });
        planTable.on('tableBuilt', injectPlanFooterButtons);
    }

    function loadPlans() {
        return api('GET', '/api/testplans').then(function (data) {
            plans = data;
            data.forEach(p => p.state = stateText(p));
            // 주기적으로 다시 읽어도 보고 있던 페이지에 머문다
            const page = planTable.getPage() || 1;
            const ids = new Set(data.map(p => p.id));
            checked.forEach(id => { if (!ids.has(id)) checked.delete(id); });
            return planTable.replaceData(data).then(function () {
                const max = planTable.getPageMax() || 1;
                if (planTable.getPage() !== Math.min(page, max)) return planTable.setPage(Math.min(page, max));
            }).then(markSelected).then(function () {
                if (selectedId && !ids.has(selectedId)) clearDetail();
            });
        });
    }

    function markSelected() {
        planTable.getRows().forEach(r => r.reformat());
        syncPlanSelectAll();
    }

    /** 검색에 걸린(모든 페이지의) Plan id */
    function activePlanIds() {
        return planTable.getRows('active').map(r => r.getData().id);
    }

    /** 머리글의 Select all 체크박스를 현재 선택 상태로 맞춘다. 전부 체크면 ✓, 일부 체크면 중간 상태. */
    function syncPlanSelectAll() {
        if (!planSelectAllBox) return;
        const ids = activePlanIds();
        const n = ids.filter(id => checked.has(id)).length;
        planSelectAllBox.checked = ids.length > 0 && n === ids.length;
        planSelectAllBox.indeterminate = n > 0 && n < ids.length;
    }

    // ── 목록: 검색 · 툴바 · footer · pagination ─────────────────────
    function applyPlanSearch() {
        const field = $('#planSearchField').val();
        const val = $('#planSearchInput').val().trim();
        if (!val) planTable.clearFilter();
        else planTable.setFilter(field, 'like', val);
    }

    /** 체크한 Plan. 검색에 가려진 것도 체크가 남아 있으면 포함한다 */
    function checkedIds() {
        return plans.map(p => p.id).filter(id => checked.has(id));
    }

    function bindPlanToolbarActions() {
        // 툴바와 Tabulator footer 를 한 곳에서 받는다
        document.querySelector('.tp-list').addEventListener('click', function (e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            if (action === 'add') location.href = '/testplans/new';
            else if (action === 'batchAdd') $('#excelFile').click();
            else if (action === 'export') exportPlans();
            else if (action === 'delete') deletePlans(checkedIds());
        });
    }

    // 선택과 무관한 액션 버튼들을 Tabulator footer(pagination) 좌측에 주입
    function injectPlanFooterButtons() {
        const footerContents = planTable.element.querySelector('.tabulator-footer .tabulator-footer-contents');
        if (!footerContents || footerContents.querySelector('.cts-footer-actions')) return;
        const el = document.createElement('div');
        el.className = 'cts-footer-actions';
        el.style.cssText = 'display:inline-flex; gap:0.25rem;';
        el.innerHTML =
            '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="add" title="Create a new plan"><i class="fas fa-plus"></i> <span class="btn-text">Add</span></button>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="batchAdd" title="Import plans from Excel (one sheet per plan)"><i class="fas fa-file-excel"></i> <span class="btn-text">Batch Add</span></button>';
        footerContents.insertBefore(el, footerContents.firstChild);
    }

    // 기준 행 높이. 실제 높이는 CtsTable 이 표 높이를 나눠떨어지게 조금 늘린다
    const PLAN_BASE_ROW_H = 40;
    const RUN_BASE_ROW_H = 36;

    // ── 세부 ───────────────────────────────────────────────────────
    function select(id) {
        selectedId = id;
        markSelected();
        history.replaceState(null, '', '/testplans?plan=' + id);
        loadDetail();
    }

    function clearDetail() {
        selectedId = null; detail = null;
        $('#detailTitle').text('Select a plan');
        $('#detailTools').hide(); $('#detailBody').hide(); $('#detailEmpty').show();
    }

    function loadDetail() {
        if (!selectedId) return;
        const id = selectedId;
        $.when(api('GET', '/api/testplans/' + id), api('GET', '/api/testplans/' + id + '/runs?limit=50'))
            .done(function (p, r) {
                if (id !== selectedId) return;
                detail = p[0];
                renderDetail();
                historyTable.replaceData(r[0]);
            })
            .fail(function () { clearDetail(); });
    }

    function renderDetail() {
        const p = detail;
        $('#detailEmpty').hide(); $('#detailBody').show(); $('#detailTools').show();
        $('#detailTitle').text(p.name);
        $('#editBtn').attr('href', '/testplans/edit/' + p.id);
        $('#scheduleText').text(scheduleText(p));
        $('#nextRunText').text(p.nextRunAt ? fmtDateTime(p.nextRunAt) : '—');
        $('#scheduleToggle').toggleClass('on', !!p.scheduleEnabled).prop('disabled', p.scheduleType === 'NONE')
            .attr('title', p.scheduleType === 'NONE' ? 'Set a schedule in the editor first.' : '');
        const devices = new Set(), cells = new Set();
        p.actions.forEach(a => { devices.add(a.deviceId); (a.cells || []).forEach(c => cells.add(a.deviceId + ':' + c)); });
        $('#sumActions').text(p.actionCount);
        $('#sumDevices').text(devices.size + ' / ' + cells.size);
        $('#sumDuration').text(TestPlanTimeline.fmtTime(p.durationSeconds));
        renderStatus();
    }

    /** 실행 상태. 1초마다 다시 그린다. */
    function renderStatus() {
        if (!detail) return;
        const st = statuses[detail.id];
        const running = !!st;
        $('#runBtn').prop('disabled', running);
        $('#stopBtn').prop('disabled', !running);
        $('#editBtn').toggleClass('disabled', running).attr('title', running ? 'Stop the plan to edit it.' : '');
        $('#deleteBtn').prop('disabled', running);
        if (running) {
            const remain = Math.max(0, (st.nextAt - Date.now()) / 1000);
            const done = Math.min(st.nextAction, st.totalActions);
            $('#statusText').html('<span>State</span><span>' + badge('RUNNING', 'RUNNING') + '</span>');
            $('#progressWrap').show();
            $('#progressBar').css('width', (st.totalActions ? 100 * done / st.totalActions : 0) + '%');
            $('#statusMore').show().html('<span>Action ' + done + ' / ' + st.totalActions + '</span><span>' +
                (st.nextAction < st.totalActions ? 'next in ' : 'ends in ') + Math.ceil(remain) + ' s · ' + st.trigger + '</span>');
        } else {
            const last = (plans.find(x => x.id === detail.id) || {}).lastRun;
            $('#statusText').html('<span>Last run</span><span>' + (last ? badge(last.result) + ' ' + fmtDateTime(last.startedAt) : badge(null, 'Never run')) + '</span>');
            $('#progressWrap').hide(); $('#statusMore').hide();
        }
    }

    function initHistoryTable() {
        historyTable = new Tabulator('#historyTable', {
            data: [], index: 'id', layout: 'fitData', height: '100%', renderVertical: 'basic',
            pagination: true, paginationSize: 5, paginationButtonCount: 3,
            placeholder: 'No runs yet.',
            columns: CtsTable.columns([
                { title: 'Started', field: 'startedAt', kind: 'text', formatter: c => fmtDateTime(c.getValue()) },
                { title: 'Trigger', field: 'triggerType', kind: 'text' },
                { title: 'Result', field: 'result', kind: 'text', formatter: c => badge(c.getValue()) },
                { title: 'Duration', field: 'endedAt', kind: 'number', formatter: c => durationOf(c.getRow().getData()) },
                { title: 'Failed', field: 'failedActions', kind: 'number' },
                { title: 'Message', field: 'message', kind: 'text', formatter: c => c.getValue() || '' }
            ])
        });
        historyTable.on('rowClick', function (e, row) { openRun(row.getData()); });
        CtsTable.attach(historyTable, { rowH: RUN_BASE_ROW_H });
        runActionsTable = new Tabulator('#runActionsTable', {
            data: [], layout: 'fitData', height: '420px', renderVertical: 'basic',
            pagination: true, paginationSize: 10, placeholder: 'No action ran.',
            columns: CtsTable.columns([
                { title: '#', field: 'seq', kind: 'number', formatter: c => c.getValue() + 1 },
                { title: 'Time', field: 'executedAt', kind: 'text', formatter: c => fmtDateTime(c.getValue()) },
                { title: 'Device', field: 'deviceId', kind: 'text', formatter: c => deviceName(c.getValue()) },
                { title: 'Target', field: 'target', kind: 'text' },
                { title: 'Value', field: 'value', kind: 'number' },
                { title: 'Type', field: 'dataType', kind: 'text', formatter: c => c.getValue() || '' },
                { title: 'Lock', field: 'lockSeconds', kind: 'number' },
                { title: 'Status', field: 'status', kind: 'text', formatter: c => badge(c.getValue()) },
                { title: 'HTTP', field: 'httpStatus', kind: 'number', formatter: c => c.getValue() || '' },
                { title: 'Error', field: 'error', kind: 'text', formatter: c => c.getValue() ? $('<div>').text(c.getValue()).html() : '' }
            ])
        });
        CtsTable.attach(runActionsTable, { rowH: RUN_BASE_ROW_H });
    }

    function deviceName(id) {
        const a = detail && detail.actions.find(x => x.deviceId === id);
        return a && a.deviceName ? a.deviceName : '#' + id;
    }

    function openRun(run) {
        $('#runModalTitle').text('Run ' + fmtDateTime(run.startedAt) + ' · ' + run.triggerType + ' · ' + run.result.replace(/_/g, ' '));
        CtsModal.show('#runModal');
        api('GET', '/api/testplans/runs/' + run.id).then(function (d) {
            setTimeout(function () { runActionsTable.replaceData(d.actions); runActionsTable.redraw(true); }, 200);
        });
    }

    // ── 동작 ───────────────────────────────────────────────────────
    function runPlan() {
        api('POST', '/api/testplans/' + selectedId + '/run').then(pollStatus).fail(x => alert(errorText(x)));
    }
    function stopPlan() {
        api('POST', '/api/testplans/' + selectedId + '/stop').then(function () { pollStatus(); setTimeout(loadDetail, 300); });
    }
    function toggleSchedule() {
        const on = !detail.scheduleEnabled;
        api('POST', '/api/testplans/' + selectedId + '/schedule/enabled/' + (on ? 1 : 0))
            // interval 은 켜는 순간 한 번 돈다. 실행 상태도 다시 읽는다
            .then(function () { loadPlans(); loadDetail(); pollStatus(); }).fail(x => alert(errorText(x)));
    }
    function deletePlan() { deletePlans([selectedId]); }

    /** 하나씩 차례로 지운다. 실행 중인 Plan 은 서버가 거절한다(P4) — 실패로 모아 보여 준다 */
    function deletePlans(ids) {
        if (!ids.length) { alert('No plans selected.'); return; }
        const one = ids.length === 1 && plans.find(p => p.id === ids[0]);
        if (!confirm(one ? 'Delete "' + one.name + '"? Its run history is deleted too.'
                         : 'Delete ' + ids.length + ' plan(s)? Their run history is deleted too.')) return;
        const failures = [];
        let i = 0;
        const next = function () {
            if (i >= ids.length) {
                if (failures.length) alert('Failed:\n' + failures.join('\n'));
                loadPlans();
                return;
            }
            const id = ids[i++];
            api('DELETE', '/api/testplans/' + id)
                .done(function () { checked.delete(id); })
                .fail(function (x) {
                    const p = plans.find(q => q.id === id);
                    failures.push((p ? p.name : '#' + id) + ': ' + errorText(x));
                })
                .always(next);
        };
        next();
    }
    function duplicatePlan() {
        const names = new Set(plans.map(p => p.name));
        let name = detail.name + ' (copy)', n = 2;
        while (names.has(name)) name = detail.name + ' (copy ' + (n++) + ')';
        const body = {
            name: name, scheduleType: 'NONE',
            actions: detail.actions.map(a => ({ deviceId: a.deviceId, target: a.target, value: a.value, dataType: a.dataType,
                lockSeconds: a.lockSeconds, atSeconds: a.atSeconds, stopOnFailure: a.stopOnFailure }))
        };
        api('POST', '/api/testplans', body).then(function (r) {
            loadPlans().then(function () {
                planTable.setPageToRow(r.plan.id).catch(function () {});
                select(r.plan.id);
            });
        })
            .fail(x => alert(errorText(x)));
    }

    // ── 실행 상태 조회 ─────────────────────────────────────────────
    let lastRunning = '';
    function pollStatus() {
        if (document.hidden) return;
        return api('GET', '/api/testplans/status').then(function (list) {
            statuses = {};
            list.forEach(s => statuses[s.planId] = s);
            const key = Object.keys(statuses).sort().join(',');
            if (key !== lastRunning) {          // 시작·종료가 있었다: 목록과 이력을 다시 읽는다
                lastRunning = key;
                loadPlans();
                if (selectedId) loadDetail();
            } else {
                planTable.getRows().forEach(r => r.reformat());
                renderStatus();
            }
        });
    }

    // ── 엑셀 ───────────────────────────────────────────────────────
    function sheetName(name, used) {
        let base = String(name).replace(/[\\\/\?\*\[\]:]/g, '_').substring(0, 31), s = base, n = 2;
        while (used.has(s)) s = base.substring(0, 28) + '~' + (n++);
        used.add(s);
        return s;
    }
    /** 체크한 Plan 을 템플릿 형식(시트 하나 = Plan 하나)으로 내보낸다. 그대로 다시 import 할 수 있다 */
    function exportPlans() {
        const ids = checkedIds();
        if (!ids.length) { alert('No plans selected.'); return; }
        // ids 가 비면 서버는 전부를 돌려준다 — 위에서 막았으므로 여기선 늘 체크한 것만 온다
        api('GET', '/api/testplans/export?ids=' + ids.join(',')).then(function (sheets) {
            if (!sheets.length) { alert('There is no plan to export.'); return; }
            const wb = XLSX.utils.book_new(), used = new Set();
            sheets.forEach(s => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.rows), sheetName(s.name, used)));
            XLSX.writeFile(wb, 'test_plans.xlsx');
        });
    }
    /** 빈 템플릿: 머리글만 있는 시트 하나. 시트 이름이 Plan 이름이 된다 */
    function downloadTemplate() {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([COLUMNS]), 'Plan name');
        XLSX.writeFile(wb, 'test_plans_template.xlsx');
    }
    $('#excelFile').on('change', function (e) {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function () {
            try {
                const wb = XLSX.read(reader.result, { type: 'binary' });
                const sheets = wb.SheetNames.map(function (n) {
                    const ws = wb.Sheets[n];
                    const range = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s: { r: 0 } };
                    return { name: n, startRow: range.s.r + 1,
                             rows: XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: null }) };
                });
                sessionStorage.setItem(BATCH_KEY, JSON.stringify({ file: f.name, sheets: sheets }));
                location.href = '/testplans/batch';
            } catch (err) {
                alert('The file could not be read as an Excel workbook.');
            }
        };
        reader.readAsBinaryString(f);
        $('#excelFile').val('');
    });

    // ── 시작 ───────────────────────────────────────────────────────
    $(function () {
        initPlanTable();
        initHistoryTable();
        bindPlanToolbarActions();
        $('#planSearchField').on('change', applyPlanSearch);
        $('#planSearchInput').on('input', applyPlanSearch);
        loadPlans().then(function () {
            const want = SELECTED_ON_LOAD || (new URLSearchParams(location.search)).get('plan');
            if (want && plans.some(p => String(p.id) === String(want))) {
                const id = parseInt(want, 10);
                planTable.setPageToRow(id).catch(function () {});   // 다른 페이지에 있으면 그 페이지로
                select(id);
            }
        });
        pollStatus();
        setInterval(pollStatus, 1000);
        setInterval(function () { if (!document.hidden) loadPlans(); }, 10000);
    });
</script>
</body>
