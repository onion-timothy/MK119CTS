    <script>
        function socketTest(host, port) {
            $.ajax({
                url: '/api/socketTest?host_transport=' + host + '&port=' + port,
                type: 'GET',
                success: function (data) {
                    if (data) {
                        alert(host + ":" + port + ' is listening now.');
                    } else {
                        alert(host + ":" + port + ' isn\'t listening');
                    }
                }
            });
        }

        let clientsTable;
        let selectedServer;

        /*<![CDATA[*/
        window.onload = function () {
            $.ajax({
                url: '/api/device/devices',
                type: 'GET',
                success: function (data) {
                    let table = $('#devicesTable');
                    $('#devicesTable > tbody').empty();

                    for (let i = 0; i < data.length; i++) {
                        let button = "<td><button class='btn btn-info' id='" + data[i].host + "_" + data[i].transport + "' onclick='socketTest(this.id," + data[i].port + ")'></button></td>"
                        let markup = "<tr onclick='viewClients(this.id)' id='" + data[i].id + "'><td>" + data[i].id + "</td><td>" + data[i].transport + "</td><td>" + data[i].protocol + "</td><td>" + data[i].host + "</td><td>" + data[i].port + "</td><td>" + data[i].name + "</td>" + button + "</tr>"
                        table.append(markup);
                    }

                    devicesTable = table.DataTable({
                        "paging": true,
                        "lengthChange": false,
                        "searching": false,
                        "ordering": true,
                        "info": true,
                        "autoWidth": false,
                        "responsive": true,
                    });
                }
            });
            clientsTable = $('#clientsTable').DataTable({
                "paging": true,
                "lengthChange": false,
                "searching": false,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": true,
            });
        }

        function viewClients(id) {
            $.ajax({
                url: '/api/sessions/' + id,
                type: 'GET',
                success: function (data) {
                    clientsTable.destroy()
                    let table = $('#clientsTable');
                    $('#clientsTable > tbody').empty();

                    for (let i = 0; i < data.length; i++) {
                        let button = "<td><button class='btn btn-danger' id='" + data[i].remoteHost + ":" + data[i].remotePort + "' onclick='disconnect(this.id)'></button></td>"
                        let markup = "<tr><td>" + data[i].remoteHost + "</td><td>" + data[i].remotePort + "</td><td>" + data[i].tx + "</td><td>" + data[i].rx + "</td><td>" + sessionTimeFormat(data[i].uptime) + "</td>" + button + "</tr>"
                        table.append(markup);
                    }

                    clientsTable = table.DataTable({
                        "paging": true,
                        "lengthChange": false,
                        "searching": false,
                        "ordering": true,
                        "info": true,
                        "autoWidth": false,
                        "responsive": true,
                    });

                    selectedServer = id;
                }
            });
        }

        function sessionTimeFormat(msec) {
            var sec_num = parseInt(msec / 1000);
            var hours = Math.floor(sec_num / 3600);
            var minutes = Math.floor((sec_num - (hours * 3600)) / 60);
            var seconds = sec_num - (hours * 3600) - (minutes * 60);

            if (hours < 10) {
                hours = "0" + hours;
            }
            if (minutes < 10) {
                minutes = "0" + minutes;
            }
            if (seconds < 10) {
                seconds = "0" + seconds;
            }
            return hours + ' : ' + minutes + ' : ' + seconds;
        }

        function disconnect(remoteAddr) {
            $.ajax({
                url: '/api/disconnect/' + selectedServer + '/' + remoteAddr,
                type: 'DELETE',
                success: function (data) {
                    if(data)
                        viewClients(selectedServer);
                }
            });
        }

        /*]]>*/
