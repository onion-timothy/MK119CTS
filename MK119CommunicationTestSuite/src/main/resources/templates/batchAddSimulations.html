<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <title>MK119 CTS — Batch Add Simulations</title>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/plugins/tabulator/css/tabulator_bootstrap5.min.css">
    <link rel="stylesheet" href="/css/cts-table.css">
    <link rel="stylesheet" href="/css/cts-target-aid.css">
    <link rel="stylesheet" href="/css/cts-batch.css">
    <style>
        /* 가로로 길면 좌(목록) · 우(상세), 세로로 길면 위아래 */
        .cts-batch-panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); }
        @media (orientation: landscape) {
            .cts-batch-panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: minmax(0, 1fr); }
        }
        /* SEQUENCE 값 하나. 순서를 옮기고 지울 수 있다 (simulation_editor 의 목록과 같은 동작) */
        .seq-chip {
            display: inline-flex; align-items: center; gap: 4px; margin: 0 4px 4px 0; padding: 3px 6px;
            border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); font-size: .85rem;
        }
        .seq-chip .seq-no { color: var(--tblr-secondary); }
        .seq-chip .btn-link { padding: 0 2px; line-height: 1; text-decoration: none; }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const DEVICE_ID   = /*[[${device.id}]]*/ 0;
        const DEVICE_NAME = /*[[${device.name}]]*/ '';
        const SESSION_KEY = 'batchAddSimulations';

        const POLICIES = ['STATIC','RANDOM','ACCUMULATE','SEQUENCE'];
        const DEVICE_PROTOCOL = /*[[${device.protocol}]]*/ null;
        const DEVICE = /*[[${device}]]*/ null;   // target 입력 보조가 통신 설정(registers·PGD 등)을 본다
        /** 이 장비·target 이 받는 data type (CtsDataTypes, 서버의 DataTypeRules 와 같은 표). */
        function typesOf(target) { return CtsDataTypes.typesFor(DEVICE_PROTOCOL, target); }

        let simsTable;
        let simulations = [];        // [{name, target, interval, enabled, stopOnControl, policies:[{...}], error, _rid}]
        let existingNames = [];      // 이 device 에 이미 등록된 simulation 이름 (중복 검사 기준)
        let existingSims = [];       // 이 device 에 이미 등록된 simulation (target 입력 보조가 쓰는 target 을 본다)
        let targetAid = null;
        let selectedRid = null;
        let ridSeq = 1;

        function newRid() { return 'r' + (ridSeq++); }
        function simByRid(rid) { return rid ? simulations.find(s => s._rid === rid) : null; }
        function selectedSim() { return simByRid(selectedRid); }

        // ── 검증 (ApiController.validateSimulationBatchRow 와 같은 규칙) ──────────
        function blank(v) { return v === null || v === undefined || String(v).trim() === ''; }
        function num(v) {
            if (typeof v === 'number') return isFinite(v) ? v : null;
            if (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v))) return Number(v);
            return null;
        }
        function policyOf(s) {
            return (s.policies && s.policies.length > 0 && s.policies[0]) ? s.policies[0] : {};
        }

        function validateRow(s, existing, seen) {
            if (blank(s.name)) return 'Missing name.';
            let name = String(s.name);
            if (existing.has(name)) return 'Duplicated simulation name (already on this device).';
            if (seen.has(name)) return 'Duplicated simulation name in file.';

            if (blank(s.target)) return 'Missing target.';
            // 조립 줄이 오류로 보이는 target(범위 밖, EtherNet/IP 의 같은 태그)은 행도 막는다. 경고는 막지 않는다
            let targetError = CtsTargetAid.check({ device: DEVICE, selfId: s._rid, siblings: targetSiblings() }, s.target)
                .filter(p => p.level === 'error')[0];
            if (targetError) return targetError.text;

            let interval = num(s.interval);
            if (interval === null) return 'interval must be a number.';
            if (interval < 1) return 'interval must be >= 1.';

            let p = policyOf(s);
            if (blank(p.policy)) return 'Missing policy.';
            if (POLICIES.indexOf(String(p.policy)) < 0) return 'Invalid policy: ' + p.policy;
            let types = typesOf(s.target);
            if (blank(p.data_type)) return "Missing data_type. Use " + types.join(', ') + '.';
            if (types.indexOf(String(p.data_type)) < 0) {
                return 'Data type ' + p.data_type + ' is not allowed for target "' + s.target + '". Use ' + types.join(', ') + '.';
            }
            if (String(p.policy) === 'ACCUMULATE' && String(p.data_type) === 'BINARY') {
                return 'ACCUMULATE cannot be used with BINARY. Use STATIC, SEQUENCE or RANDOM.';
            }

            if (String(p.policy) === 'STATIC') {
                if (num(p.value) === null) return "STATIC policy requires a numeric 'value'.";
            } else if (String(p.policy) === 'SEQUENCE') {
                // value 에 숫자 배열이 들어온다
                if (!Array.isArray(p.value) || p.value.length === 0
                        || !p.value.every(function (v) { return num(v) !== null; })) {
                    return "SEQUENCE policy requires 'value' as a non-empty array of numbers.";
                }
            } else {
                if (!Array.isArray(p.range) || p.range.length < 2) {
                    return p.policy + " policy requires 'range' with 2 numbers.";
                }
                let lo = num(p.range[0]), hi = num(p.range[1]);
                if (lo === null || hi === null) return p.policy + " policy 'range' must be numeric.";
                if (String(p.policy) === 'RANDOM' && lo > hi) return "RANDOM policy 'range' low must be <= high.";
            }
            return null;
        }

        function validateAll() {
            let existing = new Set(existingNames);
            let seen = new Set();
            simulations.forEach(function (s) {
                s.error = validateRow(s, existing, seen);
                if (s.error === null && s.name) seen.add(String(s.name));
            });
        }

        function errorCount() {
            let n = 0;
            simulations.forEach(s => { if (s.error) n++; });
            return n;
        }

        function updateStatus() {
            let ok = simulations.filter(s => !s.error).length;
            let errs = errorCount();
            $('#statusLine').attr('class', 'cts-batch-status' + (errs > 0 ? ' bad' : ''))
                .text((errs > 0 ? errs + ' error(s) · ' : '') + 'Simulations: ' + ok + '/' + simulations.length);
            $('#registerBtn').prop('disabled', errs > 0 || simulations.length === 0);
        }

        /** 검증 + UI 갱신. 입력마다 호출되므로 Tabulator 를 재생성하지 않고 데이터만 교체한다. */
        function revalidate() {
            validateAll();
            if (simsTable) simsTable.replaceData(simulations);
            updateDetailAlert();
            updateStatus();
        }

        /** 셀 편집 '중' 검증. replaceData 는 열린 에디터를 파괴하므로 Error 셀만 직접 갱신한다. */
        function revalidateWhileEditing() {
            validateAll();
            if (simsTable) {
                simsTable.getRows().forEach(function (row) {
                    let s = row.getData();
                    let cell = row.getCell('error');
                    if (cell && cell.getElement()) {
                        cell.getElement().innerHTML = s.error
                            ? '<span class="error-chip">' + escapeHtml(s.error) + '</span>'
                            : '<span class="ok-chip">ok</span>';
                    }
                    if (s.error) row.getElement().classList.add('row-error');
                    else row.getElement().classList.remove('row-error');
                });
            }
            updateStatus();
        }

        function stripRow(s) {
            let o = { ...s };
            delete o._rid;
            delete o.error;
            return o;
        }

        // ── 테이블 / 상세 ────────────────────────────────────────────────────
        // 기준 행 높이. 실제 높이는 CtsTable 이 표 높이를 나눠떨어지게 조금 늘린다
        const ROW_H = 36;

        function initSimsTable() {
            if (simsTable) { simsTable.destroy(); }
            simsTable = new Tabulator('#simsTable', {
                data: simulations,
                layout: 'fitData',
                height: '100%',
                renderVertical: 'basic',
                pagination: true,
                paginationSize: 10,
                paginationButtonCount: 3,
                index: '_rid',
                selectableRows: 1,
                rowFormatter: function (row) {
                    if (row.getData().error) row.getElement().classList.add('row-error');
                    else row.getElement().classList.remove('row-error');
                },
                columns: CtsTable.columns([
                    { title:'Name', field:'name', kind: 'text',
                      tooltip: function (e, cell) { return cell.getRow().getData().error || cell.getValue(); } },
                    { title:'Target', field:'target', kind: 'text' },
                    { title:'', field:'error', kind: 'action', width: 56, resizable: false, headerSort:false,
                      cssClass:'status-cell',
                      tooltip: function (e, cell) { return cell.getValue() || 'ok'; },
                      formatter: function (cell) {
                        return cell.getValue()
                            ? '<i class="fas fa-exclamation-triangle text-danger"></i>'
                            : '<i class="fas fa-check text-success"></i>';
                      } }
                ])
            });
            // Tabulator v6 는 rowClick 을 생성자 옵션으로 주면 무시한다 — .on() 으로 등록해야 한다
            simsTable.on('rowClick', function (e, row) {
                selectedRid = row.getData()._rid;
                renderDetail();
            });
            CtsTable.attach(simsTable, { rowH: ROW_H });
        }

        let dataTypePicker = null;

        /**
         * 상세 폼. 칸·이름·설명은 simulation_editor 와 같다.
         * 가중 분포(Use weighted distribution)는 엑셀 열이 없어 일괄 등록에서는 다루지 않는다.
         */
        function renderDetail() {
            let s = selectedSim();
            let $f = $('#detailForm');
            if (!s) { $f.html('<div class="cts-empty">Select a simulation from the list.</div>'); return; }
            let p = policyOf(s);
            let range = Array.isArray(p.range) ? p.range : [];

            $f.html(''
                + '<div id="detailAlert">' + detailAlertHtml(s) + '</div>'
                + '<div class="row g-2 mb-3">'
                +   '<div class="col-12">'
                +     '<label class="form-label" for="d_name">Name</label>'
                +     '<input type="text" class="form-control" id="d_name" value="' + escapeAttr(s.name) + '"'
                +     ' placeholder="Displayed name for simulation">'
                +   '</div>'
                +   '<div class="col-6">' + selectHtml('Initial state', 'd_enabled',
                        [{v: '1', t: 'Enabled'}, {v: '0', t: 'Disabled'}], String(s.enabled === 1 ? 1 : 0)) + '</div>'
                +   '<div class="col-6">'
                +     '<label class="form-label" for="d_interval">Interval</label>'
                +     '<input type="number" class="form-control" id="d_interval" min="1" max="3600" step="1"'
                +     ' placeholder="Seconds" value="' + escapeAttr(s.interval) + '">'
                +     '<small class="form-hint">Seconds between executions (1–3600).</small>'
                +   '</div>'
                +   '<div class="col-12">'
                +     '<label class="form-label" for="d_stop">Stop on control</label>'
                +     '<input type="number" class="form-control" id="d_stop" step="1"'
                +     ' value="' + escapeAttr(s.stopOnControl === undefined || s.stopOnControl === null ? 0 : s.stopOnControl) + '">'
                +     '<small class="form-hint">Seconds to pause after a client write. 0 never pauses, -1 disables the simulation.</small>'
                +   '</div>'
                // 조각을 고르는 줄(CtsTargetAid) 아래에 target 입력칸을 붙인다. 둘 다 고칠 수 있고 서로 맞춘다
                +   '<div class="col-12">'
                +     '<label class="form-label" for="d_target">Target</label>'
                +     '<div id="d_target_aid"></div>'
                +     '<input id="d_target" class="form-control ta-text" type="text" value="' + escapeAttr(s.target) + '"'
                +     ' spellcheck="false" autocomplete="off">'
                +     '<div id="d_target_status" class="ta-status"></div>'
                +   '</div>'
                + '</div>'

                + '<div class="detail-section">Policy</div>'
                + '<div class="row g-2 mb-3">'
                +   '<div class="col-6">'
                +     '<label class="form-label" for="d_pid">ID</label>'
                +     '<input type="text" class="form-control" id="d_pid" value="' + escapeAttr(p.id) + '" placeholder="Policy ID">'
                +   '</div>'
                +   '<div class="col-6">' + selectHtml('Policy', 'd_policy', POLICIES.map(x => ({v: x, t: x})), p.policy || 'STATIC') + '</div>'
                +   '<div class="col-12">'
                +     '<label class="form-label">Datatype</label>'
                +     '<div id="d_dtp"></div>'
                +   '</div>'
                + '</div>'
                // Policy 에 따라 Value / Range / Sequence 중 하나만 보인다 (simulation_editor.changePolicy 와 같다)
                + '<div class="mb-3" id="d_value_wrap">'
                +   '<label class="form-label" for="d_value">Value</label>'
                +   '<input id="d_value" class="form-control" type="text" inputmode="decimal"'
                +   ' value="' + escapeAttr(Array.isArray(p.value) ? '' : p.value) + '" placeholder="Simulation designated value">'
                + '</div>'
                + '<div class="mb-3" id="d_range_wrap">'
                +   '<label class="form-label" for="d_range_min">Range</label>'
                +   '<div class="row g-2">'
                +     '<div class="col-md-6"><input id="d_range_min" class="form-control" type="text" inputmode="decimal"'
                +       ' value="' + escapeAttr(range[0]) + '"></div>'
                +     '<div class="col-md-6"><input id="d_range_max" class="form-control" type="text" inputmode="decimal"'
                +       ' value="' + escapeAttr(range[1]) + '"></div>'
                +   '</div>'
                + '</div>'
                + '<div class="mb-3" id="d_seq_wrap">'
                +   '<label class="form-label" for="d_seq_input">Sequence values</label>'
                +   '<div class="input-group">'
                +     '<input type="text" class="form-control" id="d_seq_input" inputmode="decimal" placeholder="Number to append">'
                +     '<button class="btn btn-outline-secondary" type="button" id="d_seq_add"><i class="fas fa-plus"></i> Add</button>'
                +   '</div>'
                +   '<small class="form-hint">Applied in order, one value per interval, then wraps to the first.</small>'
                +   '<div id="d_seq_list" class="mt-2"></div>'
                + '</div>'
            );
            // 폼이 어느 행을 편집 중인지 고정한다 (렌더 후 선택이 바뀌어도 엉뚱한 행에 쓰지 않도록)
            $f.data('rid', s._rid);

            // Datatype 은 편집기와 같은 조합 선택칸으로 고른다. 받는 타입은 target 에 따라 달라진다
            dataTypePicker = CtsDataTypePicker.mount(document.getElementById('d_dtp'), { onChange: applyDetail });
            dataTypePicker.setTypes(typesOf(s.target), p.data_type);

            applyPolicyVisibility();
            renderSequence();
            // 검증이 로컬에서 끝나므로 키 입력마다 즉시 반영한다. 시퀀스 입력칸은 Add 를 눌러야 들어간다
            $f.find('input, select').not('#d_seq_input, #d_dtp select').on('input change', applyDetail);
            $('#d_policy').on('change', applyPolicyVisibility);
            $('#d_target').on('input', function () {
                dataTypePicker.setTypes(typesOf($(this).val()), dataTypePicker.value());
            });
            $('#d_seq_add').on('click', addSequenceValue);
            $('#d_seq_input').on('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); addSequenceValue(); }
            });
            mountTargetAid(s);
        }

        /** 이미 등록된 simulation 과 이 파일의 다른 행. 같은 target 경고와 'Next free' 가 둘 다 본다. */
        function targetSiblings() {
            return existingSims.concat(simulations.map(r => ({
                id: r._rid, name: blank(r.name) ? 'row ' + (simulations.indexOf(r) + 1) : r.name,
                target: r.target, policies: r.policies })));
        }

        function mountTargetAid(s) {
            let fromAid = false;   // 조각을 골라 바꾼 값이면 조각 줄을 다시 그리지 않는다(입력 중인 조각의 커서를 지킨다)
            targetAid = CtsTargetAid.mount(document.getElementById('d_target_aid'), {
                device: DEVICE,
                selfId: s._rid,
                siblings: targetSiblings(),
                statusEl: document.getElementById('d_target_status'),
                onChange: function (text) {
                    fromAid = true;
                    $('#d_target').val(text).trigger('input');
                    fromAid = false;
                },
                // DB: 정책 자리표시자를 커서 자리에 넣는다
                insertText: function (text) {
                    const el = document.getElementById('d_target');
                    const a = el.selectionStart === null ? el.value.length : el.selectionStart;
                    const b = el.selectionEnd === null ? a : el.selectionEnd;
                    el.value = el.value.slice(0, a) + text + el.value.slice(b);
                    el.focus();
                    el.setSelectionRange(a + text.length, a + text.length);
                    $(el).trigger('input');
                },
                policyIds: () => [$.trim($('#d_pid').val())],
            });
            targetAid.setValue(s.target);
            $('#d_target').on('input', function () { if (!fromAid) targetAid.setValue($(this).val()); });
            $('#d_pid').on('input', () => targetAid.refresh());
        }

        /** Policy 에 따라 Value / Range / Sequence 표시를 전환하고 Range placeholder 를 바꾼다. */
        function applyPolicyVisibility() {
            let policy = $('#d_policy').val();
            $('#d_value_wrap').toggle(policy === 'STATIC');
            $('#d_seq_wrap').toggle(policy === 'SEQUENCE');
            $('#d_range_wrap').toggle(policy === 'RANDOM' || policy === 'ACCUMULATE');
            if (policy === 'RANDOM') {
                $('#d_range_min').prop('placeholder', 'Minimum for simulation value');
                $('#d_range_max').prop('placeholder', 'Maximum for simulation value');
            } else if (policy === 'ACCUMULATE') {
                $('#d_range_min').prop('placeholder', 'Initial simulation value');
                $('#d_range_max').prop('placeholder', 'Accumulate per interval');
            }
        }

        // ── SEQUENCE 값 목록 (simulation_editor 의 Sequence values 와 같은 동작) ──
        /** 지금 폼이 고치는 행의 SEQUENCE 배열. 배열이 아니면 빈 배열로 시작한다 */
        function sequence() {
            let s = simByRid($('#detailForm').data('rid'));
            if (!s) return [];
            if (!s.policies || s.policies.length === 0) s.policies = [{}];
            if (!Array.isArray(s.policies[0].value)) s.policies[0].value = [];
            return s.policies[0].value;
        }

        function addSequenceValue() {
            let $input = $('#d_seq_input');
            let raw = $.trim($input.val());
            if (raw === '' || !Number.isFinite(Number(raw))) {
                alert('Enter a number to add.');
                return;
            }
            sequence().push(Number(raw));
            $input.val('').trigger('focus');
            renderSequence();
            revalidate();
        }

        function removeSequenceValue(i) { sequence().splice(i, 1); renderSequence(); revalidate(); }

        function moveSequenceValue(i, delta) {
            let arr = sequence(), to = i + delta;
            if (to < 0 || to >= arr.length) return;
            let tmp = arr[i]; arr[i] = arr[to]; arr[to] = tmp;
            renderSequence();
            revalidate();
        }

        function clearSequenceValues() {
            if (sequence().length === 0) return;
            if (!confirm('Remove all sequence values?')) return;
            sequence().length = 0;
            renderSequence();
            revalidate();
        }

        function renderSequence() {
            let $list = $('#d_seq_list');
            if ($list.length === 0 || $('#d_policy').val() !== 'SEQUENCE') return;
            let arr = sequence();
            if (arr.length === 0) {
                $list.html('<div class="text-secondary" style="font-size:.85rem;">No values yet. Add at least one.</div>');
                return;
            }
            $list.html(arr.map((v, i) => '<span class="seq-chip">'
                    + '<span class="seq-no">' + (i + 1) + '.</span><b>' + escapeHtml(v) + '</b>'
                    + '<button type="button" class="btn btn-link btn-sm" title="Move left" onclick="moveSequenceValue(' + i + ',-1)">&#8592;</button>'
                    + '<button type="button" class="btn btn-link btn-sm" title="Move right" onclick="moveSequenceValue(' + i + ',1)">&#8594;</button>'
                    + '<button type="button" class="btn btn-link btn-sm text-danger" title="Remove" onclick="removeSequenceValue(' + i + ')">&times;</button>'
                    + '</span>').join('')
                + '<div class="mt-1 d-flex align-items-center gap-2">'
                + '<span class="text-secondary" style="font-size:.8rem;">' + arr.length + ' value(s)</span>'
                + '<button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="clearSequenceValues()">Clear all</button>'
                + '</div>');
        }

        function detailAlertHtml(s) {
            return s.error
                ? '<div class="alert alert-danger detail-alert">'
                    + '<i class="fas fa-exclamation-triangle me-1"></i>' + escapeHtml(s.error) + '</div>'
                : '<div class="alert alert-success detail-alert">'
                    + '<i class="fas fa-check me-1"></i>Valid</div>';
        }

        function updateDetailAlert() {
            let s = selectedSim();
            let $a = $('#detailAlert');
            if (!s || $a.length === 0) return;
            $a.html(detailAlertHtml(s));
        }

        /** 숫자 칸의 값. 비면 null, 아니면 숫자(숫자가 아니면 NaN — 검증이 잡는다) */
        function numberField(id) {
            let v = $.trim($(id).val());
            return v === '' ? null : Number(v);
        }

        function applyDetail() {
            let s = simByRid($('#detailForm').data('rid'));
            if (!s) return;
            s.name = $('#d_name').val();
            s.target = $('#d_target').val();
            s.enabled = parseInt($('#d_enabled').val(), 10);
            s.interval = numberField('#d_interval');
            s.stopOnControl = numberField('#d_stop');
            if (!s.policies || s.policies.length === 0) s.policies = [{}];
            let p = s.policies[0];
            p.policy = $('#d_policy').val();
            let dt = dataTypePicker ? dataTypePicker.value() : '';
            if (dt) p.data_type = dt; else delete p.data_type;
            let pid = $('#d_pid').val();
            if (pid === '') delete p.id; else p.id = pid;

            // Policy 에 해당하는 필드만 남긴다 (숨겨진 쪽 값이 payload 에 섞이지 않게)
            if (p.policy === 'STATIC') {
                let v = numberField('#d_value');
                if (v === null) delete p.value; else p.value = v;
                delete p.range;
            } else if (p.policy === 'SEQUENCE') {
                if (!Array.isArray(p.value)) p.value = [];
                delete p.range;
                renderSequence();
            } else {
                let lo = numberField('#d_range_min'), hi = numberField('#d_range_max');
                if (lo === null && hi === null) delete p.range; else p.range = [lo, hi];
                delete p.value;
            }
            revalidate();
        }

        /** options: [{v, t}] */
        function selectHtml(label, id, options, selected) {
            let opts = options.map(o =>
                '<option value="' + escapeAttr(o.v) + '"'
                + (String(o.v) === String(selected === undefined || selected === null ? '' : selected) ? ' selected' : '')
                + '>' + escapeHtml(o.t) + '</option>').join('');
            return '<label class="form-label" for="' + id + '">' + label + '</label>'
                + '<select id="' + id + '" class="form-select">' + opts + '</select>';
        }
        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }
        function escapeAttr(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/"/g, '&quot;');
        }

        // ── 로드 / 업로드 / 등록 ─────────────────────────────────────────────
        /**
         * SEQUENCE 의 value 를 숫자 배열로 편다. 엑셀 칸은 "1,2,3" 같은 글자나 숫자 하나로 들어온다.
         * 숫자가 아닌 조각이 있으면 그대로 두어 검증이 알리게 한다.
         */
        function normalizeSequence(s) {
            let p = policyOf(s);
            if (String(p.policy) !== 'SEQUENCE' || Array.isArray(p.value) || p.value === undefined || p.value === null) return s;
            let parts = String(p.value).replace(/^\s*\[|\]\s*$/g, '').split(',').map(x => x.trim()).filter(x => x !== '');
            if (parts.length && parts.every(x => Number.isFinite(Number(x)))) p.value = parts.map(Number);
            return s;
        }

        function load() {
            let raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return;
            try {
                let parsed = JSON.parse(raw);
                simulations = (parsed.simulations || []).map(s => normalizeSequence({ ...s, _rid: newRid(), error: null }));
            } catch (e) {
                console.error(e);
                alert('Failed to load batch data.');
            }
        }

        /** 중복 검사 기준이 되는 기존 simulation 이름. 진입 시 1회만 받아온다. */
        function fetchExistingNames() {
            return $.ajax({ url: '/api/simulation/simulations/' + DEVICE_ID, type: 'GET' })
                .done(function (res) {
                    existingSims = res || [];
                    existingNames = existingSims.map(s => s.name).filter(n => n);
                })
                .fail(function (xhr) {
                    alert('Failed to load existing simulations (' + xhr.status + '). '
                        + 'Duplicate name checks against this device will not work.');
                });
        }

        function normalizeSheetRow(r) {
            let p = {};
            ['id','policy','data_type','value'].forEach(k => { if (k in r && r[k] !== null) p[k] = r[k]; });
            if (r.range !== undefined && r.range !== null && r.range !== '') {
                p.range = String(r.range).split(',').map(b => Number(String(b).trim()));
            }
            return {
                name: r.name,
                target: r.target,
                interval: r.interval,
                enabled: r.enabled,
                // stopOnControl 은 Simulation 의 최상위 필드다 (기존 템플릿은 policies 안에 넣어 유실됐다)
                stopOnControl: r.stopOnControl,
                policies: [p]
            };
        }

        function onLoadFile(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function () {
                let wb = XLSX.read(reader.result, { type: 'binary' });
                let sheet = wb.SheetNames[0];
                let rows = sheet ? XLSX.utils.sheet_to_json(wb.Sheets[sheet]) : [];
                simulations = rows.map(r => normalizeSequence({ ...normalizeSheetRow(r), _rid: newRid(), error: null }));
                validateAll();
                selectedRid = simulations.length ? simulations[0]._rid : null;
                initSimsTable();
                renderDetail();
                updateStatus();
            };
            reader.readAsBinaryString(file);
            $('#excelFile').val('');
        }

        let inserting = false;
        function setBusy(on, text) {
            inserting = on;
            if (text) $('#busyText').text(text);
            $('#busyOverlay').toggleClass('show', on);
        }
        window.addEventListener('beforeunload', function (e) {
            if (!inserting) return;
            e.preventDefault();
            e.returnValue = '';
            return '';
        });

        function doRegister() {
            validateAll();
            if (errorCount() > 0) {
                revalidate();
                alert('Resolve errors first.');
                return;
            }
            if (!confirm('Register ' + simulations.length + ' simulation(s) to ' + DEVICE_NAME + '?')) return;
            $('#registerBtn').prop('disabled', true);
            setBusy(true, 'Registering ' + simulations.length + ' simulation(s)…');
            $.ajax({
                url: '/api/simulation/batchInsert',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ deviceId: DEVICE_ID, simulations: simulations.map(stripRow) }),
                success: function (res) {
                    let failures = res.failures || [];
                    setBusy(false);   // 우리가 거는 location.href 도 beforeunload 를 트리거하므로 먼저 내린다
                    if (failures.length > 0) {
                        alert('Completed with ' + failures.length + ' failure(s):\n\n' + failures.slice(0, 30).join('\n'));
                    }
                    sessionStorage.removeItem(SESSION_KEY);
                    location.href = '/simulations?device=' + DEVICE_ID;
                },
                error: function (xhr) {
                    setBusy(false);
                    alert('Insert failed: ' + xhr.status + ' ' + xhr.responseText);
                    $('#registerBtn').prop('disabled', false);
                }
            });
        }

        function doCancel() {
            if (simulations.length === 0 || confirm('Discard uploaded data and go back?')) {
                sessionStorage.removeItem(SESSION_KEY);
                location.href = '/simulations?device=' + DEVICE_ID;
            }
        }

        function batchInit() {
            $('#pageSubtitle').text(DEVICE_NAME + ' · ' + DEVICE_PROTOCOL);
            load();
            $('#excelFile').on('change', onLoadFile);
            $('#chooseBtn').on('click', function () { $('#excelFile').click(); });
            $('#registerBtn').on('click', doRegister);
            $('#cancelBtn').on('click', doCancel);

            // 검증 기준(기존 simulation 이름)을 먼저 받아온 뒤 첫 검증을 돌린다
            $('#statusLine').text('Loading existing simulations…');
            fetchExistingNames().always(function () {
                if (simulations.length === 0) {
                    $('#detailForm').html('<div class="cts-empty">No data loaded. Choose an Excel file to begin.</div>');
                    updateStatus();
                    return;
                }
                validateAll();
                selectedRid = simulations[0]._rid;
                initSimsTable();
                renderDetail();
                updateStatus();
            });
        }
        /*]]>*/
    </script>
</head>
<body>
<th:block th:replace="~{fragments/tabler :: busy-overlay}"></th:block>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('simulations')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('Batch Add Simulations', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list align-items-center">
            <span class="cts-batch-status" id="statusLine">No data loaded.</span>
            <button type="button" id="chooseBtn" class="btn btn-outline-secondary"><i class="fas fa-file-excel"></i> Choose Excel</button>
            <button type="button" id="cancelBtn" class="btn btn-outline-secondary">Cancel</button>
            <button type="button" id="registerBtn" class="btn btn-primary" disabled>Register</button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <input type="file" id="excelFile" accept=".xlsx" style="display:none">
            <div class="cts-batch-panes">
                <div class="card cts-card">
                    <div class="card-header"><h3 class="card-title">Simulations</h3></div>
                    <div class="card-body p-0"><div id="simsTable" class="cts-tabulator"></div></div>
                </div>
                <div class="card cts-card">
                    <div class="card-header"><h3 class="card-title">Simulation detail</h3></div>
                    <div class="card-body"><form id="detailForm" onsubmit="return false"></form></div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/tabler :: scripts}"></th:block>
<script src="/plugins/tabulator/js/tabulator.min.js"></script>
<script src="/js/cts-table.js"></script>
<script src="/js/cts-datatypes.js"></script>
<script src="/js/cts-datatype-picker.js"></script>
<script src="/js/cts-target-aid.js"></script>
<script src="/js/xlsx.full.min.js"></script>
<script>$(function(){ batchInit(); });</script>
</body>
</html></html>
