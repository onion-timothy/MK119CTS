<!DOCTYPE html>
<html lang="en" class="cts-fixed" data-bs-navbar-position="combined" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/tabler :: assets}"></th:block>
    <title>MK119 CTS — Batch Add Test Plans</title>
    <link rel="stylesheet" href="/css/cts-tabler.css">
    <link rel="stylesheet" href="/plugins/tabulator/css/tabulator_bootstrap5.min.css">
    <!-- testplan.css 의 .cts-tabulator 는 뒤에 오는 cts-table.css 가 Tabler 색으로 덮는다 (testplans 와 같다) -->
    <link rel="stylesheet" href="/css/testplan.css">
    <link rel="stylesheet" href="/css/cts-table.css">
    <link rel="stylesheet" href="/css/cts-batch.css">
    <style>
        /* 가로로 길면 좌(시트 목록) · 우(시트 내용), 세로로 길면 위아래 */
        .cts-batch-panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 2fr); }
        @media (orientation: landscape) {
            .cts-batch-panes { grid-template-columns: minmax(260px, 0.6fr) minmax(0, 1.6fr); grid-template-rows: minmax(0, 1fr); }
        }
        .cts-batch-panes .card-body { display: flex; flex-direction: column; }
        .cts-tabulator .tabulator-row.tp-current { background-color: var(--tblr-primary-lt) !important; }
        .tl-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
        .tl-head h6 { margin: 0; font-size: 11px; font-weight: 700; color: var(--tblr-secondary); text-transform: uppercase; letter-spacing: .04em; }
        #timeline.tpt { height: 220px; flex: 0 0 auto; }
        #rowTable { border-top: 1px solid var(--tblr-border-color) !important; }
        /* 두 표는 칸의 남는 높이를 채운다. Tabulator 가 박는 height:100% 를 무시해야 위의 타임라인을 빼고 채운다 */
        #sheetTable, #rowTable { flex: 1 1 0; min-height: 0; height: auto !important; }
        #rowTable .tabulator-cell.tabulator-editable { cursor: text; }
        /* 시트 전체에 걸린 문제는 카드 제목 옆에 붙인다. 제목처럼 대문자로 바꾸지 않는다 */
        #rowsTitle .error-chip { text-transform: none; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/tabler :: busy-overlay}"></th:block>
<div class="page">
    <th:block th:replace="~{fragments/tabler :: sidebar('testplans')}"></th:block>

    <th:block th:replace="~{fragments/tabler :: navbar('Batch Add Test Plans', ~{::#pageActions})}"></th:block>
    <!--/* 상단 바로 옮겨 그려진다. 이 자리에서는 지워진다 */-->
    <div th:remove="all">
        <div id="pageActions" class="btn-list align-items-center">
            <span class="cts-batch-status" id="statusLine">No file loaded.</span>
            <button type="button" class="btn btn-outline-secondary" onclick="$('#excelFile').click()"><i class="fas fa-file-excel"></i> Choose Excel</button>
            <a class="btn btn-outline-secondary" href="/testplans" onclick="sessionStorage.removeItem(BATCH_KEY)">Cancel</a>
            <button type="button" id="registerBtn" class="btn btn-primary" disabled onclick="doRegister()">Register</button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="page-body">
            <input type="file" id="excelFile" accept=".xlsx" style="display:none">
            <div class="alert alert-danger cts-batch-issues" id="fileIssues" hidden></div>
            <div class="cts-batch-panes">
                <div class="card cts-card">
                    <div class="card-header"><h3 class="card-title">Plan list</h3></div>
                    <div class="card-body p-0"><div id="sheetTable" class="cts-tabulator"></div></div>
                </div>
                <div class="card cts-card">
                    <div class="card-header"><h3 class="card-title" id="rowsTitle">Plan</h3></div>
                    <div class="card-body p-0">
                        <div class="tl-head">
                            <h6>Timeline</h6>
                            <div class="tpt-legend ms-2">
                                <span><i class="lg-lock"></i>Locked</span>
                                <span><i class="lg-hold"></i>Written, not locked</span>
                                <span><i class="lg-cut"></i>Overwritten</span>
                                <span><i class="lg-stop"></i>Stop on failure</span>
                            </div>
                            <div class="ms-auto btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" data-zoom="0.5" title="Zoom out"><i class="fas fa-minus"></i></button>
                                <button class="btn btn-outline-secondary" data-zoom="fit">Fit</button>
                                <button class="btn btn-outline-secondary" data-zoom="2" title="Zoom in"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <div id="timeline"></div>
                        <div class="tl-head">
                            <h6>Actions</h6>
                            <span class="text-secondary small ms-auto">Row numbers are the Excel rows. Blank rows are skipped. Click a cell to fix it here.</span>
                        </div>
                        <div id="rowTable" class="cts-tabulator"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/tabler :: scripts}"></th:block>
<script src="/plugins/tabulator/js/tabulator.min.js"></script>
<script src="/js/cts-table.js"></script>
<script src="/js/xlsx.full.min.js"></script>
<script src="/js/testplan-timeline.js"></script>
<script>
    const BATCH_KEY = 'batchAddTestPlans';
    const COLUMNS = ['RunAtSeconds', 'Device', 'Target', 'Value', 'DataType', 'LockSeconds', 'StopOnFailure'];
    const NUMERIC_COLUMNS = ['RunAtSeconds', 'Value', 'LockSeconds'];
    let payload = null, result = null, sheetTable, rowTable, timeline, current = 0;
    // 편집 중에는 표를 다시 그리지 않는다 — replaceData 가 열린 에디터를 없앤다. 그동안 온 검증 결과는 미뤄 둔다
    let pendingTimer = null, validateSeq = 0, validateTimer = null, cellsSeq = 0;

    function esc(s) { return $('<div>').text(s === null || s === undefined ? '' : s).html(); }

    function boolText(v) { return v === true ? 'TRUE' : v === false ? 'FALSE' : esc(v); }

    /** 시트의 행을 헤더 기준으로 펼친다. 검증은 서버가 하고, 여기서는 보여 주기만 한다. ri = rows 안의 위치(고칠 때 쓴다) */
    function rowsOf(sheet) {
        const rows = sheet.rows || [];
        if (!rows.length) return [];
        const header = rows[0].map(h => (h === null ? '' : String(h)).trim().toLowerCase());
        const col = {};
        COLUMNS.forEach(c => col[c] = header.indexOf(c.toLowerCase()));
        const out = [];
        for (let r = 1; r < rows.length; r++) {
            const cells = rows[r] || [];
            if (!cells.some(v => v !== null && String(v).trim() !== '')) continue;
            const o = { row: (sheet.startRow || 1) + r, ri: r };
            COLUMNS.forEach(c => o[c] = col[c] >= 0 ? cells[col[c]] : null);
            out.push(o);
        }
        return out;
    }

    // 기준 행 높이. 실제 높이는 CtsTable 이 표 높이를 나눠떨어지게 조금 늘린다
    const ROW_H = 36;

    function init() {
        sheetTable = new Tabulator('#sheetTable', {
            data: [], layout: 'fitData', height: '100%', renderVertical: 'basic',
            pagination: true, paginationSize: 10, paginationButtonCount: 3, placeholder: 'No sheets.',
            rowFormatter: r => r.getElement().classList.toggle('tp-current', r.getData().index === current),
            columns: CtsTable.columns([
                { title: 'Plan name (sheet)', field: 'name', kind: 'text', editor: 'input' },
                { title: 'Actions', field: 'actions', kind: 'number' },
                { title: 'Status', field: 'status', kind: 'text', formatter: c => c.getValue() },
            ])
        });
        sheetTable.on('rowClick', (e, r) => showSheet(r.getData().index));
        CtsTable.attach(sheetTable, { rowH: ROW_H });
        rowTable = new Tabulator('#rowTable', {
            data: [], layout: 'fitData', height: '100%', renderVertical: 'basic',
            pagination: true, paginationSize: 10, placeholder: 'No actions in this sheet.',
            rowFormatter: r => r.getElement().classList.toggle('row-error', !!(r.getData().errors || []).length),
            columns: CtsTable.columns([
                { title: 'Row', field: 'row', kind: 'number' },
                { title: 'Run At (s)', field: 'RunAtSeconds', kind: 'number', editor: 'input' },
                { title: 'Device', field: 'Device', kind: 'text', editor: 'input' },
                { title: 'Target', field: 'Target', kind: 'text', editor: 'input' },
                { title: 'Value', field: 'Value', kind: 'number', editor: 'input' },
                { title: 'DataType', field: 'DataType', kind: 'text', editor: 'input' },
                { title: 'Lock', field: 'LockSeconds', kind: 'number', editor: 'input' },
                { title: 'Stop on Failure', field: 'StopOnFailure', kind: 'text', formatter: c => boolText(c.getValue()),
                  editor: 'list', editorParams: { values: { '': '(blank)', 'TRUE': 'TRUE', 'FALSE': 'FALSE' } } },
                // 행 높이가 고정이라 한 줄로 잇는다. 하나씩 보려면 툴팁
                { title: 'Problem', field: 'errors', kind: 'text', headerSort: false,
                  tooltip: (e, c) => (c.getValue() || []).map(x => x.rule + ' ' + x.message).join('\n'),
                  formatter: c => {
                      const list = c.getValue() || [];
                      return list.length ? '<span class="error-chip">' + list.map(x => esc(x.rule + ' ' + x.message)).join(' · ') + '</span>' : '';
                  } }
            ])
        });
        // Tabulator v6 는 cellEdited 를 생성자 옵션으로 주면 무시한다
        sheetTable.on('cellEdited', function (cell) {
            const v = cell.getValue() === null || cell.getValue() === undefined ? '' : String(cell.getValue()).trim();
            payload.sheets[cell.getRow().getData().index].name = v;
            changed();
        });
        rowTable.on('cellEdited', function (cell) {
            writeBack(cell.getRow().getData(), cell.getField(), cell.getValue());
            changed();
        });
        CtsTable.attach(rowTable, { rowH: ROW_H });
        timeline = TestPlanTimeline.create(document.getElementById('timeline'), { editable: false, onSelect: function () {} });
        $('[data-zoom]').on('click', function () {
            const z = $(this).data('zoom');
            if (z === 'fit') timeline.fit(); else timeline.zoom(Number(z));
        });
        $(window).on('resize', function () { timeline.render(); });
        $('#excelFile').on('change', readFile);
        const raw = sessionStorage.getItem(BATCH_KEY);
        if (raw) { try { payload = JSON.parse(raw); validate(); } catch (e) { sessionStorage.removeItem(BATCH_KEY); } }
    }

    /** 표에서 고친 값을 시트의 행에 되돌려 쓴다. 등록은 시트(payload)를 보내므로 고친 값이 그대로 검증·등록된다. */
    function writeBack(rowData, field, value) {
        const sheet = payload.sheets[current];
        let v = value === null || value === undefined ? null : typeof value === 'string' ? value.trim() : value;
        if (v === '') v = null;
        // 엑셀이 숫자로 주던 칸은 숫자로 둔다
        if (typeof v === 'string' && NUMERIC_COLUMNS.indexOf(field) >= 0 && /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(v)) v = Number(v);
        const cells = sheet.rows[rowData.ri] = sheet.rows[rowData.ri] || [];
        cells[columnIndex(sheet, field)] = v;
    }

    /** 헤더에서 열 위치를 찾는다. 없는 열(X4)이면 헤더 끝에 붙여 만든다. */
    function columnIndex(sheet, name) {
        const header = sheet.rows[0];
        const i = header.findIndex(h => h !== null && h !== undefined && String(h).trim().toLowerCase() === name.toLowerCase());
        if (i >= 0) return i;
        header.push(name);
        return header.length - 1;
    }

    function changed() {
        clearTimeout(pendingTimer);                 // 미뤄 둔 결과는 이제 낡았다
        sessionStorage.setItem(BATCH_KEY, JSON.stringify(payload));
        $('#registerBtn').prop('disabled', true);   // 다시 검증할 때까지
        clearTimeout(validateTimer);
        validateTimer = setTimeout(validate, 300);
    }

    /** 열린 에디터가 있는가. 값을 바꾸지 않고 닫으면 Tabulator 가 아무 이벤트도 주지 않아 DOM 으로 본다. */
    function isEditing() {
        return !!document.querySelector('#sheetTable .tabulator-editing, #rowTable .tabulator-editing');
    }

    function readFile(e) {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function () {
            try {
                const wb = XLSX.read(reader.result, { type: 'binary' });
                payload = { file: f.name, sheets: wb.SheetNames.map(function (n) {
                    const ws = wb.Sheets[n];
                    const range = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s: { r: 0 } };
                    return { name: n, startRow: range.s.r + 1, rows: XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: null }) };
                }) };
                sessionStorage.setItem(BATCH_KEY, JSON.stringify(payload));
                validate();
            } catch (err) {
                $('#statusLine').attr('class', 'cts-batch-status bad').text('The file could not be read as an Excel workbook.');
            }
        };
        reader.readAsBinaryString(f);
        $('#excelFile').val('');
    }

    function validate() {
        const seq = ++validateSeq;
        $('#statusLine').attr('class', 'cts-batch-status').text('Checking ' + (payload.file || 'the file') + '…');
        $.ajax({ url: '/api/testplans/validate', method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ sheets: payload.sheets }) })
            .done(function (r) { if (seq === validateSeq) show(r); })
            .fail(function () { if (seq === validateSeq) $('#statusLine').attr('class', 'cts-batch-status bad').text('The check failed. Try again.'); });
    }

    function show(r) {
        clearTimeout(pendingTimer);
        if (isEditing()) { pendingTimer = setTimeout(function () { show(r); }, 200); return; }
        result = r;
        $('#fileIssues').html((r.errors || []).map(e => esc(e.rule + ' ' + e.message)).join('<br>')).prop('hidden', !(r.errors || []).length);
        const sheets = payload.sheets.map(function (s, i) {
            const o = (r.sheets || [])[i] || { errors: [], warnings: [] };
            const nErr = o.errors.length;
            return { index: i, name: s.name, actions: rowsOf(s).length,
                status: nErr ? '<span class="tp-badge FAILED">' + nErr + ' error' + (nErr > 1 ? 's' : '') + '</span>'
                             : '<span class="tp-badge COMPLETED">OK</span>' + (o.warnings.length ? ' <span class="warn-chip">' + o.warnings.length + ' warning</span>' : '') };
        });
        sheetTable.replaceData(sheets);
        const bad = sheets.filter((s, i) => ((r.sheets || [])[i] || { errors: [] }).errors.length).length;
        $('#registerBtn').prop('disabled', !r.ok);
        $('#statusLine').attr('class', 'cts-batch-status ' + (r.ok ? 'ok' : 'bad')).text(
            (payload.file || 'File') + ': ' + sheets.length + ' sheet(s), ' + (r.ok ? 'ready to register.'
                : (bad ? bad + ' with errors. Fix them in the table or choose the file again.' : 'the file has errors.')));
        showSheet(Math.min(current, Math.max(0, sheets.length - 1)));
    }

    function showSheet(i) {
        current = i;
        // reformat 은 행을 다시 그려 이름 칸의 에디터를 닫는다. 표시만 바꾼다
        sheetTable.getRows().forEach(r => r.getElement().classList.toggle('tp-current', r.getData().index === current));
        const sheet = payload.sheets[i];
        if (!sheet) { rowTable.replaceData([]); drawTimeline([], {}); return; }
        const o = (result.sheets || [])[i] || { errors: [], warnings: [] };
        const rows = rowsOf(sheet);
        const byRow = {}, badRows = {};
        o.errors.concat(o.warnings).forEach(e => { if (e.row) (byRow[e.row] = byRow[e.row] || []).push(e); });
        o.errors.forEach(e => { if (e.row) badRows['r' + e.row] = true; });
        rows.forEach(x => x.errors = byRow[x.row] || []);
        const sheetLevel = o.errors.filter(e => !e.row || !rows.some(x => x.row === e.row));
        $('#rowsTitle').html(esc(sheet.name) + (sheetLevel.length
            ? ' <span class="error-chip ms-2">' + sheetLevel.map(e => esc(e.rule + ' ' + e.message)).join(' · ') + '</span>' : ''));
        rowTable.replaceData(rows);
        drawTimeline(rows, badRows);
    }

    function numOr0(v) {
        const n = v === null || v === undefined || v === '' ? 0 : Number(v);
        return isFinite(n) ? n : 0;
    }

    /**
     * 시트의 행을 다이어그램으로 그린다. 오류가 있는 행도 읽히는 만큼 그리고 빨간 테두리를 친다.
     * 칸(Lane)은 서버가 장비 이름·target·dataType 으로 계산한다 — 편집기와 같은 /cells.
     */
    function drawTimeline(rows, badRows) {
        const seq = ++cellsSeq;
        const items = rows.map(x => ({
            uid: 'r' + x.row, deviceName: x.Device === null || x.Device === undefined ? '' : String(x.Device).trim(),
            target: x.Target === null || x.Target === undefined ? '' : String(x.Target).trim(),
            value: x.Value, dataType: x.DataType ? String(x.DataType).trim() : null,
            lockSeconds: Math.max(0, numOr0(x.LockSeconds)), at: Math.max(0, numOr0(x.RunAtSeconds)),
            stop: x.StopOnFailure === true || String(x.StopOnFailure).trim().toLowerCase() === 'true'
        }));
        if (!items.length) { timeline.set(TestPlanTimeline.place({ items: [] }), { errors: {} }); return; }
        $.ajax({ url: '/api/testplans/cells', method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ actions: items.map(it => ({ device: it.deviceName, target: it.target, dataType: it.dataType })) }) })
            .done(function (res) {
                if (seq !== cellsSeq) return;
                items.forEach(function (it, k) {
                    const c = res[k] || {};
                    // 없는 장비는 이름으로 묶는다
                    it.deviceId = c.deviceId !== null && c.deviceId !== undefined ? c.deviceId : 'name:' + it.deviceName;
                    it.protocol = c.protocol;
                    it.cells = c.cells && c.cells.length ? c.cells : (it.target ? [it.target] : []);
                });
                timeline.set(TestPlanTimeline.place({ items: items.filter(it => it.cells.length) }), { errors: badRows });
            });
    }

    function doRegister() {
        if (!result || !result.ok) return;
        if (!confirm('Register ' + payload.sheets.length + ' test plan(s)?')) return;
        $('#busyOverlay').addClass('show');
        $.ajax({ url: '/api/testplans/import', method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ sheets: payload.sheets }) })
            .done(function (r) {
                sessionStorage.removeItem(BATCH_KEY);
                location.href = '/testplans' + (r.plans && r.plans.length ? '?plan=' + r.plans[0].id : '');
            })
            .fail(function (x) {
                $('#busyOverlay').removeClass('show');
                if (x.responseJSON && x.responseJSON.sheets) show(x.responseJSON);
                else alert('Registering failed.');
            });
    }

    $(init);
</script>
</body>
</html>
