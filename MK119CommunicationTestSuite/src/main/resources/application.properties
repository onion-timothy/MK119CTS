server.port=8082
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false

# DataSource (MariaDB)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/cts
spring.datasource.username=root
spring.datasource.password=midknight1!
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# DataSource (SQL Server) - 예전 설정, 전환 시 위를 주석 처리하고 아래 해제
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cts_mk119_test
#spring.datasource.username=sa
#spring.datasource.password=midknight1!
spring.jpa.hibernate.ddl-auto=update
# OSIV 끄기: 켜져 있으면 HTTP 요청 하나가 영속성 컨텍스트를 끝까지 들고 가서
# batch insert 중 flush 마다 누적된 전체 엔티티를 dirty 검사/UPDATE 한다 (O(n^2)).
spring.jpa.open-in-view=false
# 대량 insert 를 JDBC 배치로 묶는다
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
